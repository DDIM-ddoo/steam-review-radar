<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>유저 반응 기반 장르 분석 · 기획 도출 대시보드</title>
<meta name="description" content="Steam 리뷰와 판매·동시 접속 지표로 장르를 분석하고 신작 기획 방향을 도출하는 대시보드">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@500;700;800&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a research desk. Left rail = the query you are asking Steam; right = the answer, summary first, evidence one click away. */
:root{
  --bg:#eef1ef; --surface:#f8faf9; --raised:#ffffff; --ink:#142120; --ink-2:#435250; --muted:#6f7c79;
  --line:#d5dcd9; --line-2:#e5eae7; --accent:#0d6e66; --accent-ink:#ffffff; --accent-soft:#dcece8;
  --pos:#2a78d6; --neg:#e34948; --mid:#e6e9e6; --s1:#2a78d6; --s2:#eb6834; --cta:#5b45d6; --cta-ink:#ffffff; --c1:#2a78d6;--c2:#eb6834;--c3:#1baf7a;--c4:#eda100;--c5:#e87ba4;--c6:#008300;--c7:#6250d6;--c8:#e34948;
  --good:#0f7f12; --good-mark:#0ca30c; --warn:#946200; --warn-mark:#fab219; --crit:#c03030; --crit-mark:#d03b3b;
  --font-d:"Gothic A1","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --font-b:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --font-m:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1514; --surface:#141c1b; --raised:#1a2322; --ink:#e6eeec; --ink-2:#b2bfbc; --muted:#85928f;
  --line:#2b3735; --line-2:#212b29; --accent:#43b5a8; --accent-ink:#051c19; --accent-soft:#17312e;
  --pos:#3987e5; --neg:#e66767; --mid:#2c3533; --s1:#3987e5; --s2:#d95926; --cta:#a497f5; --cta-ink:#17113d; --c1:#3987e5;--c2:#d95926;--c3:#199e70;--c4:#c98500;--c5:#d55181;--c6:#008300;--c7:#9085e9;--c8:#e66767;
  --good:#4cc24c; --good-mark:#0ca30c; --warn:#f0b43c; --warn-mark:#fab219; --crit:#f07a7a; --crit-mark:#d03b3b;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1514; --surface:#141c1b; --raised:#1a2322; --ink:#e6eeec; --ink-2:#b2bfbc; --muted:#85928f;
  --line:#2b3735; --line-2:#212b29; --accent:#43b5a8; --accent-ink:#051c19; --accent-soft:#17312e;
  --pos:#3987e5; --neg:#e66767; --mid:#2c3533; --s1:#3987e5; --s2:#d95926; --cta:#a497f5; --cta-ink:#17113d; --c1:#3987e5;--c2:#d95926;--c3:#199e70;--c4:#c98500;--c5:#d55181;--c6:#008300;--c7:#9085e9;--c8:#e66767;
  --good:#4cc24c; --good-mark:#0ca30c; --warn:#f0b43c; --warn-mark:#fab219; --crit:#f07a7a; --crit-mark:#d03b3b;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-b);font-size:14px;line-height:1.55;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--font-m);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:12.5px}
h1,h2,h3{font-family:var(--font-d);text-wrap:balance;margin:0;letter-spacing:-.01em}

/* top bar */
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-block:18px 14px;border-bottom:1px solid var(--line);max-width:1480px;margin:0 auto}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand h1{font-size:21px;font-weight:800}
.brand .tick{font-family:var(--font-m);font-size:11px;letter-spacing:.08em;color:var(--accent);text-transform:uppercase}
.top .spacer{flex:1}
.caps{display:flex;gap:6px;flex-wrap:wrap}
.cap{font-size:12px;padding:3px 9px;border-radius:999px;border:1px solid var(--line);color:var(--ink-2);display:inline-flex;gap:6px;align-items:center;background:var(--surface)}
.cap i{width:7px;height:7px;border-radius:50%;background:var(--muted);display:inline-block}
.cap.on i{background:var(--good-mark)} .cap.off i{background:var(--crit-mark)}
.runpick{display:flex;gap:6px;align-items:center}
select,input[type=text],input[type=search],textarea{background:var(--raised);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-width:0}
textarea{width:100%;resize:vertical}

/* shell */
.shell{max-width:1480px;margin:0 auto;display:grid;grid-template-columns:340px minmax(0,1fr);gap:22px;padding-top:20px;align-items:start}
@media (max-width:1060px){.shell{grid-template-columns:minmax(0,1fr)}}
.rail{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:18px;position:sticky;top:12px}
@media (max-width:1060px){.rail{position:static}}
.rail h2{font-size:15px;font-weight:700}
.field{display:flex;flex-direction:column;gap:7px}
.label{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:transparent;padding:8px;cursor:pointer;color:var(--ink-2)}
.seg button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--raised);border-radius:999px;padding:3px 10px;font-size:12.5px;cursor:pointer;color:var(--ink-2)}
.chip:hover{border-color:var(--accent)}
.chip.sel{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
.chip .x{opacity:.6}
.ac{position:relative}
.ac-list{position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--raised);border:1px solid var(--line);border-radius:8px;z-index:20;max-height:260px;overflow:auto;box-shadow:0 8px 24px rgb(0 0 0 / .12)}
.ac-list button{display:flex;justify-content:space-between;gap:8px;width:100%;text-align:left;border:0;background:none;padding:7px 10px;cursor:pointer}
.ac-list button:hover,.ac-list button:focus{background:var(--accent-soft)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.checks{display:flex;gap:12px;flex-wrap:wrap}
.checks label{display:inline-flex;gap:5px;align-items:center;cursor:pointer}
.btn{border:1px solid var(--line);background:var(--raised);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.primary:hover{filter:brightness(1.07)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.sm{padding:4px 10px;font-size:12.5px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.note{font-size:12.5px;color:var(--ink-2);background:var(--bg);border-radius:8px;padding:9px 11px;border:1px dashed var(--line)}
.warnbox{font-size:13px;border:1px solid var(--crit-mark);border-left-width:4px;border-radius:8px;padding:10px 12px;background:var(--raised)}

/* candidates */
.cands{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:8px;max-height:340px;overflow:auto;background:var(--raised)}
.cand{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center;padding:7px 10px;border-bottom:1px solid var(--line-2);cursor:pointer}
.cand:last-child{border-bottom:0}
.cand .nm{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cand .meta{display:block;font-size:11.5px;color:var(--muted)}
.grp{font-size:10.5px;padding:1px 6px;border-radius:4px;border:1px solid var(--line);color:var(--ink-2)}

/* progress */
.steps{display:flex;flex-direction:column;gap:6px}
.step{display:grid;grid-template-columns:18px minmax(0,1fr) auto;gap:8px;align-items:center;font-size:13px;color:var(--muted)}
.step .dot{width:10px;height:10px;border-radius:50%;border:2px solid var(--line);justify-self:center}
.step.run{color:var(--ink)} .step.run .dot{border-color:var(--accent);background:var(--accent);animation:pulse 1.2s infinite}
.step.done{color:var(--ink-2)} .step.done .dot{border-color:var(--accent);background:var(--accent-soft)}
.step.err{color:var(--crit)} .step.err .dot{border-color:var(--crit-mark)}
@keyframes pulse{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.step.run .dot{animation:none}}
.bar{height:4px;background:var(--line-2);border-radius:4px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.log{font-family:var(--font-m);font-size:11.5px;color:var(--muted);max-height:180px;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere;user-select:text}

/* main */
.main{min-width:0;display:flex;flex-direction:column;gap:18px}
.runhead{display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap;justify-content:space-between}
.runhead h2{font-size:26px;font-weight:800;line-height:1.2}
.runhead .sub{color:var(--ink-2);font-size:13px;margin-top:4px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 14px;cursor:pointer;color:var(--ink-2);border-bottom:2px solid transparent;white-space:nowrap;font-weight:500}
.tabs button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.tabs .q{font-family:var(--font-m);font-size:10.5px;color:var(--muted);margin-left:4px}
.panel{display:flex;flex-direction:column;gap:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.card h3{font-size:16px;font-weight:700}
.card .lead{color:var(--ink-2);font-size:13px;margin-top:4px;max-width:72ch}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
@media (max-width:640px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--surface);padding:12px 14px}
.kpi b{display:block;font-family:var(--font-m);font-size:22px;font-weight:500;font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;color:var(--muted)}
.summary{font-size:15.5px;line-height:1.7;max-width:80ch}

/* insight columns */
.cols3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-items:start}
@media (max-width:1240px){.cols3{grid-template-columns:minmax(0,1fr)}}
.colhead{display:flex;align-items:center;gap:8px;padding:2px 2px 8px;border-bottom:2px solid var(--c);margin-bottom:10px}
.colhead .ic{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff;background:var(--cm)}
.colhead h3{font-size:15px}
.colhead .cnt{margin-left:auto;font-size:12px;color:var(--muted)}
.t-reinforce{--c:var(--good-mark);--cm:var(--good-mark);--ct:var(--good)}
.t-avoid{--c:var(--crit-mark);--cm:var(--crit-mark);--ct:var(--crit)}
.t-verify{--c:var(--warn-mark);--cm:#b77a00;--ct:var(--warn)}
.ins{background:var(--raised);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:9px;margin-bottom:10px}
.ins h4{margin:0;font-size:14.5px;font-family:var(--font-d);font-weight:700;line-height:1.35}
.ins p{margin:0;color:var(--ink-2);font-size:13.2px}
.metric{font-family:var(--font-m);font-size:11.8px;color:var(--ct);background:var(--bg);border-radius:6px;padding:5px 8px}
.ev{border-left:2px solid var(--line);padding-left:9px;font-size:12.5px;color:var(--ink-2)}
.ev .src{font-size:11px;color:var(--muted);display:block}
.ev q{quotes:none}
.verd{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.verd button{font-size:12px;border:1px solid var(--line);background:none;border-radius:6px;padding:2px 8px;cursor:pointer;color:var(--ink-2)}
.verd button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.conf{font-size:11px;color:var(--muted)}
.linkbtn{border:0;background:none;padding:0;color:var(--accent);cursor:pointer;font-size:12.5px;text-decoration:underline;text-underline-offset:2px}
.memo{font-size:12.5px;min-height:34px}

/* charts */
.chartwrap{overflow-x:auto}
svg text{fill:var(--ink-2);font-family:var(--font-b)}
svg .ax{stroke:var(--line);stroke-width:1}
svg .grid{stroke:var(--line-2);stroke-width:1}
.help{border:1px solid var(--line);border-radius:8px;background:var(--raised)}
.help summary{cursor:pointer;padding:9px 12px;font-weight:600;font-size:13px;color:var(--accent);list-style:none;display:flex;gap:8px;align-items:center}
.help summary::-webkit-details-marker{display:none}
.help summary::before{content:"?";display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-size:11.5px;font-family:var(--font-m)}
.help[open] summary{border-bottom:1px solid var(--line-2)}
.helpbody{padding:4px 14px 10px;font-size:13px;color:var(--ink-2);max-width:86ch}
.helpbody p{margin:8px 0}
.card .help{margin-top:12px}
.card>.help:first-child{margin-top:0;border:0;background:none}
.card>.help:first-child summary{padding:0 0 8px}
.perf-t{min-width:980px}.perf-t th{white-space:nowrap;vertical-align:bottom}.perf-t td.off{min-width:190px}.srcbadge{display:inline-block;font-size:10.5px;padding:0 5px;border-radius:4px;background:var(--accent-soft);color:var(--accent);font-weight:600}.src-line{line-height:1.5;margin-top:2px}.offact{margin-top:4px}.perf-t td.off a{color:var(--accent)}
.offform td{background:var(--bg)}.offbox{display:flex;flex-direction:column;gap:10px;padding:6px 2px}.offgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.offgrid label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--ink-2)}.offgrid .wide{grid-column:1/-1}@media (max-width:700px){.offgrid{grid-template-columns:1fr 1fr}}.perf-t td.n{white-space:nowrap}.perf-t td.gname{min-width:170px}.perf-t td.gname .linkbtn{text-align:left}
.meta-lab{white-space:nowrap;font-size:12px}.meta-lab.is-dlc{color:var(--warn);font-weight:600}.dlc-tag{font-size:10.5px;padding:0 5px;border-radius:4px;background:color-mix(in oklab,var(--warn-mark) 25%,transparent);color:var(--ink);font-weight:600}#dlcNote{display:flex;flex-direction:column;gap:6px}
.btn-cta{border:0;background:var(--cta);color:var(--cta-ink);border-radius:8px;padding:9px 16px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:8px;box-shadow:0 1px 0 rgb(0 0 0 / .08)}
.btn-cta:hover{filter:brightness(1.08)}
.btn-cta:disabled{opacity:.45;cursor:not-allowed;filter:none}
.btn-cta .ico{font-size:13px}
.btn-cta[aria-pressed=true]{outline:2px solid var(--cta);outline-offset:2px}
.dir-hero{border-color:var(--cta);border-width:1.5px}
.dir-hero .label{color:var(--cta)}
.dir-list{margin:6px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:5px;font-size:13.2px;color:var(--ink-2)}
.dir-card{display:flex;flex-direction:column;gap:12px;scroll-margin-top:16px}
.dir-card.is-chosen{border-color:var(--cta);box-shadow:0 0 0 1px var(--cta)}
.dir-top{display:flex;gap:12px;align-items:flex-start}
.dir-no{flex:0 0 auto;width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:var(--cta);color:var(--cta-ink);font-family:var(--font-m);font-weight:600;font-size:15px}
.dir-title{font-size:17px;line-height:1.35;margin-top:2px}
.dir-pitch{margin:0;font-size:14.5px;line-height:1.65;max-width:80ch}
.dir-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 22px}
@media (max-width:900px){.dir-grid{grid-template-columns:minmax(0,1fr)}}
.dir-grid h4{margin:0;font-family:var(--font-d);font-size:13.5px;font-weight:700}
.dir-foot{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--ink-2);border-top:1px solid var(--line-2);padding-top:10px}
.dir-foot b{color:var(--ink);margin-right:6px}
.dir-quotes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:900px){.dir-quotes{grid-template-columns:minmax(0,1fr)}}
.dir-rec{font-size:11px;padding:1px 7px;border-radius:999px;background:color-mix(in oklab,var(--cta) 16%,transparent);color:var(--cta);font-weight:700;white-space:nowrap}
.dir-chosen-tag{font-size:11px;padding:1px 7px;border-radius:999px;background:var(--cta);color:var(--cta-ink);font-weight:700;white-space:nowrap}
.lvl{font-size:11.5px;padding:1px 8px;border-radius:999px;border:1px solid var(--line);white-space:nowrap}
.lvl-높음,.lvl-큼{border-color:var(--good-mark);color:var(--good)}
.lvl-보통{border-color:var(--warn-mark);color:var(--warn)}
.lvl-낮음,.lvl-작음{color:var(--muted)}
.dir-t{min-width:760px}.dir-t th{white-space:nowrap}.dir-t td:nth-child(2){white-space:nowrap}

.cs-sheet{background:var(--raised);border:1px solid var(--line);border-top:4px solid var(--cta);border-radius:var(--r);padding:26px 26px 18px;display:flex;flex-direction:column;gap:14px;max-width:1080px}
.cs-head .label{color:var(--cta)}
.cs-title{font-size:24px;font-weight:800;line-height:1.3;margin-top:6px}
.cs-pitch{margin:8px 0 0;font-size:15px;line-height:1.7;color:var(--ink-2);max-width:80ch}
.cs-row{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
.cs-two{grid-template-columns:repeat(2,minmax(0,1fr))}
.cs-pillars{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:820px){.cs-two,.cs-pillars{grid-template-columns:minmax(0,1fr)}}
.cs-cell{border:1px solid var(--line);border-radius:8px;padding:14px 16px;background:var(--surface);min-width:0}
.cs-cell h4{margin:0 0 6px;font-family:var(--font-d);font-size:14px;font-weight:700}
.cs-cell h4 .muted{font-weight:400;font-size:12px;margin-left:4px}
.cs-cell p{margin:0;font-size:13.5px;line-height:1.6;color:var(--ink-2)}
.cs-pillars .cs-cell{border-top:3px solid var(--cta)}
.cs-pno{font-family:var(--font-m);font-size:11px;color:var(--cta);margin-bottom:2px}
.cs-exp{font-size:17px!important;font-weight:600;color:var(--ink)!important;font-family:var(--font-d)}
.cs-list{margin:4px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:13.3px;color:var(--ink-2)}
.cs-ex{font-size:12.5px;color:var(--muted);margin-top:2px}
.cs-tag{font-size:11px;padding:1px 7px;border-radius:999px;border:1px solid var(--line);color:var(--ink-2)}
.cs-risk{border-left:3px solid var(--warn-mark)}
.cs-foot{font-size:11.5px;color:var(--muted);border-top:1px solid var(--line-2);padding-top:10px}

.trbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:8px 12px;margin-bottom:12px;border:1px solid var(--line);border-radius:10px;background:var(--accent-soft);font-size:13px;color:var(--ink-2)}.trbtn{float:right;margin:0 0 6px 10px;font:inherit;font-size:11.5px;line-height:1.5;padding:1px 9px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);cursor:pointer;white-space:nowrap;align-self:flex-end;width:auto;flex:none}.trbtn:hover{border-color:var(--accent);color:var(--accent)}.trbtn[aria-pressed=true]{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}.rv .h .trbtn{float:none;margin:0 0 0 auto}.trx .tr-ko{display:block}.trx .tr-orig{display:block;margin-top:4px;font-size:.88em;color:var(--muted);font-style:normal}.trx .tr-orig::before{content:"원문 · ";font-weight:600}.trx.inl .tr-inl{color:var(--muted);font-weight:400}
.brand h1{word-break:keep-all}@media (max-width:560px){.brand{flex-direction:column;align-items:flex-start;gap:2px}.brand h1{font-size:20px}}

.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.tip{position:fixed;z-index:50;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;padding:7px 9px;border-radius:7px;max-width:280px;line-height:1.45;white-space:pre-line;opacity:0;transition:opacity .08s}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
@media (max-width:900px){.split{grid-template-columns:minmax(0,1fr)}}
table.t{border-collapse:collapse;width:100%;font-size:13px}
table.t th{text-align:left;font-weight:600;font-size:11.5px;color:var(--muted);letter-spacing:.04em;padding:6px 8px;border-bottom:1px solid var(--line)}
table.t td{padding:6px 8px;border-bottom:1px solid var(--line-2);vertical-align:top}

.term .tb{position:relative;font-size:13px;padding:2px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.term .tb::before{content:"";position:absolute;inset:0 auto 0 0;width:var(--w);background:var(--tc);opacity:.16;border-radius:4px}
.term .n{font-size:11.5px;color:var(--muted);text-align:right}

/* explorer */
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filters select,.filters input{font-size:13px;padding:6px 8px}
.rv{border-bottom:1px solid var(--line-2);padding:12px 2px;display:flex;flex-direction:column;gap:6px}
.rv .h{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--muted)}
.rec{font-weight:600;font-size:11.5px;padding:1px 7px;border-radius:5px}

.rec.n{color:var(--neg);background:color-mix(in oklab,var(--neg) 12%,transparent)}
.rv .tx{font-size:13.4px;white-space:pre-line;max-width:90ch;overflow-wrap:anywhere}

.op{font-size:11.5px;border-radius:5px;padding:1px 7px;border:1px solid var(--line)}
.op.p{border-color:color-mix(in oklab,var(--pos) 50%,var(--line))}
.op.n{border-color:color-mix(in oklab,var(--neg) 55%,var(--line))}
.op b{font-weight:600}
.wish{font-size:12.5px;color:var(--accent)}

.empty{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:22px}

.flow div{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;align-items:start}

.runlist{display:flex;flex-direction:column;gap:6px}

.runlist button:hover{border-color:var(--accent)}
.need{display:grid;grid-template-columns:52px minmax(0,1fr);gap:12px;padding:12px 0;border-bottom:1px solid var(--line-2)}

y", "onboarding"], "count": 5, "desc": "패배 시 포인트 손실 완화, 다시 시작 기능, 보스 연습모드, 레벨링 속도 개선 등 도전 장벽을 낮추는 요구입니다.", "evidence": ["215398329", "213809468", "234771832", "211809963"], "title": "실패 부담 완화와 진행 편의"}], "summary": "소울라이크 신작에서 코어 루프(순감성 0.65)와 아트(0.85)는 확실한 강점이지만, 서버·네트워크(-0.95, 비추천 리뷰의 49.6%가 부정 언급)와 라이브 서비스·소통(업데이트 -0.78, 개발사 소통 -0.83)이 가장 큰 이탈 요인입니다. 멀티·협동을 핵심으로 삼은 게임일수록 매칭·밸런스·핑 문제가 겹쳐 평가가 갈리므로, 멀티를 넣는다면 인프라와 출시 후 운영 계획이 함께 설계되어야 합니다."}, "mode": "genre", "settings": {"langs": ["koreana"], "minRev": 500, "nGames": 5, "perGame": 100, "tier": "quick", "years": 3}, "tags": [29482], "title": "소울라이크", "verdicts": {}, "reviews": [{"ea": false, "g": 2622380, "h": 97, "id": "214302529", "l": "koreana", "o": [["difficulty", -1, "방 건너편까지 채찍질이 닿게 되었다"]], "pt": 352, "t": "모두가 미야자키의 어린 시절을 알고 있다.\r\n미야자키의 아버지는 어린 미야자키를 가죽 벨트로 학대할 때, 미야자키가 피할 수 없도록 엇박으로 허리띠를 휘둘렀다는 것이다.\r\n\r\n그러나 이 훌륭한 이야기의 비하인드를 아는 사람은 거의 없다.\r\n\r\n어느 날, 미야자키는 아버지의 패턴에 적응하게 되었다.\r\n허리띠의 피격 판정 프레임을 전부 외워, 아버지의 채찍질을 단 한대도 맞지 않고 전부 피하게 된 것이다.\r\n\r\n하지만 아버지는 포기하지 않았고, 사랑하는 아들을 놀래킬 방법을 찾기 위하여 꼬박 2년이라는 시간을 보냈다.\r\n\r\n그 결과, 미야자키의 아버지는 한 번의 채찍질로 이전보다 10배가 넘는 피해를 입히고, 미친 사람처럼 방을 뛰어다니며, (이전에 하던 엇박과 함께)빠른 연속 타격을 가함으로써, 미야자키가 그 패턴을 눈으로 쫓기 조차 힘들 정도로 변화했다.\r\n\r\n하지만 아버지는 이 정도로도 아들을 놀라게 하기에는 충분하지 않다는 것을 알았기에, 이제 그 가죽 벨트는 아들이 자신의 뒤쪽로 구르기를 할 때를 대비하여 본체 주변에 광역딜까지 추가되었다.\r\n\r\n심지어 미야자키가 안전하게 음료수를 마실 수 있는 타이밍이라 생각했을 때에도, 방 건너편까지 채찍질이 닿게 되었다.", "ts": 1766806321, "up": true}, {"ea": false, "g": 2622380, "h": 41, "id": "212927624", "l": "koreana", "o": [], "pt": 3901, "t": "엘든링을 너무 사랑해서 엘든링에 밥 말아 먹고 엘든링으로 샤워하고 엘든링으로 똥 닦고 싶은 사람이면 사자. \n\n엘든링을 dlc까지 싹싹 긁어먹고 더 먹고 싶다면 사는게 어떨까.\n\n아니면 사지마셈 이거 게임아님.", "ts": 1765301429, "up": true}, {"ea": false, "g": 2622380, "h": 32, "id": "235061262", "l": "koreana", "o": [["updates", -1, "DLC 하나 내고 유기하지말고"], ["volume", -1, "추가적인 컨텐츠 좀 더 달라고"]], "pt": 14922, "t": "재능은 충만하고 앞날이 창창한 아이였지만 부모님께 버려진 고아같은 게임\n쉽할 DLC 하나 내고 유기하지말고 추가적인 컨텐츠 좀 더 달라고", "ts": 1789179490, "up": true, "w": "추가 콘텐츠 지속 업데이트"}, {"ea": false, "g": 2622380, "h": 28, "id": "212928403", "l": "koreana", "o": [["balance", -1, "트롤저격수 삭제해라"]], "pt": 3179, "t": "대체씨발 중앙성체 트롤저격수는 어떤새끼가 낸 아이디어임? 도가니기사나 땅기사처럼 좀 가만히좀 쳐있지 씨 발 무슨 멀리서 폭격을 처날리노 트롤저격수만든 돌고래보다못한새끼는 트롤저격수 삭제해라 씨 발", "ts": 1765302216, "up": true, "w": "트롤저격수 삭제 또는 너프"}, {"ea": false, "g": 2622380, "h": 30, "id": "225765004", "l": "koreana", "o": [["monetization", -1, "그의 아버지는 dlc라는 새로운 밥을 가져왔다"], ["difficulty", -1, "매우 강한 적을 처치하여야 했다"]], "pt": 10432, "t": "모두가 미야자키의 어린 시절을 알고있다\r\n미야자키의 아버지는 매일 그를 학대하며 한 가지 밥에 콩 반찬을 올려주었고\r\n다른걸 달라고 조르는 미야자키의 울음에 그의 아버지는 콩자반에서 콩밥으로 바꾸어주었다\r\n\r\n어느날 미야자키는 도저히 못버티겠다고 시위한 끝에 그의 아버지는 심도라는 콩고기반찬을 가져왔지만\r\n그 위에 빨간 적이라는 해물비빔소스를 뿌려주었다\r\n\r\n그러던 어느날 그의 아버지는 dlc라는 새로운 밥을 가져왔다\r\n그 밥을 먹을려면 서로 멀리 떨어진 던전에 들어가야했고 그곳에 들어가면 젖가락이 하나가되며 매우 강한 적을 처치하여야 했다\r\n\r\n미야자키는 겨우 맵 곳곳에 흩어진 젖가락 조각을 찾아서 맵 중앙에서 합치고서야 두개의 젓가락으로 반찬을 수호하는 강한 보스를 잡을 수 있게 되었다.", "ts": 1779028639, "up": false}, {"ea": false, "g": 2622380, "h": 25, "id": "215184342", "l": "koreana", "o": [["network", -1, "본인들이 서버 관리 부실하게 해 놓고"], ["bugs", -1, "버그 터져서 게임 터지면 유저점수 까고"], ["multiplayer", -1, "트롤유저들이 탈주 해서 게임 진행 불가능한걸"], ["dev", -1, "몇 달째인데 개선이 안됨"]], "pt": 14090, "t": "본인들이 서버 관리 부실하게 해 놓고 서버 터지면 유저점수 까고 트롤유저들이 탈주 해서 게임 진행 불가능한걸 유저 점수 까고 버그 터져서 게임 터지면 유저점수 까고 게임 출시한 지 몇 달째인데 개선이 안됨", "ts": 1767576630, "up": false, "w": "서버 안정화 및 버그 수정"}, {"c": "엘든링", "ea": false, "g": 2622380, "h": 18, "id": "219119077", "l": "koreana", "o": [["loop", 1, "할 떄마다 느끼지만 재밌다"], ["multiplayer", 1, "친구랑 같이하니까 더 재밌게 느껴진"], ["difficulty", -1, "1인플레이로 게임하기에는 거의 지옥급"]], "pt": 446, "t": "멀티 엘든링,\n\n초창기에는 호불호가 많이 탔던 게임이었다. 어떤 사람은 진짜 별로다하고, 어떤 사람은 진짜 재밌다하고...\n친한 동생이 이거 개 재밌다고 해서 같이 해봤는데 본인은 호에 가까웠음.\n가끔 같이 하는데 할 떄마다 느끼지만 재밌다.!\n\n특히 고인물 친구랑 같이하니까 더 재밌게 느껴진게 아닌가 싶다. 게임의 특징은 로그라이크의 스타일을 섞은 엘든링인데, 매판은 30~45분정도 걸리고, 전략은 어느정도 비슷하긴 하지만, 클래스별 특징과 함께 보스 공략하는 맛이 있었음.\n\n지금은 1인플레이 2인플레이도 가능하긴 한데, 1인플레이로 게임하기에는 거의 지옥급이니 친구들과 함께 혹은 온라인으로 3인 플레이로 즐기는 것이 가장 좋을 거 같다. 그런데 트롤 유저 걸리면 좀 많이 꼬움...", "ts": 1771941653, "up": true}, {"ea": false, "g": 2622380, "h": 30, "id": "232742163", "l": "koreana", "o": [["updates", -1, "패치내역이 꼴랑 9번임"], ["ea", -1, "출시 1~2개월 내에 몰아넣은 사실상 미완성"]], "pt": 10247, "t": "원래 평가 잘 안남기는데 이건 남겨야겠다\n25년 5월 30일에 출시해서 9월 11일에 심도 추가하고 12월 4일에 DLC 하나 낸 다음 마지막 사후지원 패치가 26년 1월 16일인 라이브 서비스 게임이 있다?\n출시 1년 2개월된 DLC도 1개 있는 라이브서비스 게임의 패치내역이 꼴랑 9번임\n그 중 초기 6번은 출시 1~2개월 내에 몰아넣은 사실상 미완성 게임 보완 패치들인거 감안하면 실질적으로 라이브서비스답게 서비스유지를 위한 패치는 3번밖에 안됨\n14개월에서 초기 2개월 자르고 1년동안 패치 3번 한 라이브서비스 게임\n이래놓고 더스크블러드는 뭘 믿고 사라는건데 심지어 걔는 스위치 독점이라 스위치도 사야돼\n프롬의 개발 센스는 인정하는데 개발성향은 라이브서비스와는 전혀 맞지 않음", "ts": 1786640127, "up": false, "w": "출시 후 정기적인 라이브 서비스 패치"}, {"ea": false, "g": 2622380, "h": 35, "id": "209175948", "l": "koreana", "o": [["ui", -1, "기본 키세팅 이따위로 했는지는 모르겠지만"]], "pt": 30, "t": "어떤 미친새끼가 기본 키세팅 이따위로 했는지는 모르겠지만 그것만 제외하고 본다면 씨발 병신겜", "ts": 1763102318, "up": true, "w": "기본 키 설정 개선"}, {"ea": false, "g": 2622380, "h": 16, "id": "217744092", "l": "koreana", "o": [], "pt": 18986, "t": "솔직히 애매하긴 한데\r\n어차피 니들 엘든링 이후로 프롬겜 나올라면 100만년 기다려야되는거 알잖아 ㅋㅋㅋㅋ\r\n이거 해 ㅋㅋㅋㅋ", "ts": 1770431613, "up": true}, {"ea": false, "g": 2622380, "h": 12, "id": "215563845", "l": "koreana", "o": [["loop", 0, "겜 자체는 재밌긴 함 근데"]], "pt": 7988, "t": "겜 자체는 재밌긴 함\n근데 뭐냐 맛있는거 먹는게 아니라 똥 퍼먹으면서 맛있다 하는 느낌임", "ts": 1767968383, "up": true}, {"ea": false, "g": 2622380, "h": 18, "id": "213809915", "l": "koreana", "o": [["onboarding", -1, "초반 적응이 힘들 수도 있다"], ["ui", -1, "서렌 기능이 없는 게 좀 아쉽다"], ["variety", 1, "다양한 보스들을 멀티로 잡을 수 있다"], ["multiplayer", -1, "썩은 고인물들이 캐리하는 상황이 종종 벌어진다"]], "pt": 14378, "t": "- 자기장 시스템과 로그라이크의 결합... 호불호가 크게 갈릴 수 있을 요소이다.\n- 전투, 파밍 템포가 매우 빠르기 때문에 평소 스피드런을 즐긴 사람이 아니라면 초반 적응이 힘들 수도 있다.\n- 길이 복잡해서 헤매는 경우도 많이 나오는 편.\n- 한 판당 플레이 시간이 꽤 길다. 3일 차까지 진행 시 40~50분 소요.\n- 부활 시스템이 있다. 이로 인해 썩은 고인물들이 캐리하는 상황이 종종 벌어진다.\n- 서렌 기능이 없는 게 좀 아쉽다.\n- 이전 출격들의 이동 경로, 진행 상황 등을 간략하게 리플레이하는 기능이 있어서 뭔가 복기하기 좋았음.\n- 다양한 보스들을 멀티로 잡을 수 있다는 것에 이 게임의 가치는 충분함.\n- 유물 가챠 요소 존재. 역시나 확률은 희박하다.\n- 도전 과제 난이도는 소울류치고 상당히 낮다.\n\n총평 : 이 게임을 입문작으로서는 절대 비추. 하지만 로베이스부터 시작한다고 생각하면 게임이 너무 입문하기 어려움"], ["network", 1, "매칭도 잘 잡혀서 혼자 하기도 좋아요"]], "pt": 785, "t": "게임 취향에 따라 호불호가 갈릴 느낌\n\n엘든링이나 혹은 소울류 시리즈를 해온 사람들에겐 엄청 재밌는 게임 같음\n사람들이랑 같이 보스 잡으면서 죽고 죽으면서 살리고... 유대감 느끼기 아주 좋음\n캐릭터들도 개성 있고 고유 능력 가지고 있는 게 잘 어울리는 듯\n\n근데 제로베이스부터 시작한다고 생각하면 게임이 너무 입문하기 어려움...\n게임이 밤의 비가 다 오기 전에 더 많이, 더 빨리, 효율적으로 루트를 짜야 하는데 그게 어려움...\n그리고 개인적으로 맵이 너무 수직으로 넓은 듯.. 내가 가고 싶은 곳 가는데 언덕이 크게 져서 돌아가야함.. 귀찮..\n\n일단 주변에 게임 좀 하는 고인물 있으면 같이 하는 걸 추천드립니다 매칭도 잘 잡혀서 혼자 하기도 좋아요\n나름 머리 수십번 터지면서 하는데 왠지 모르겠는데 재밌네요...\n근데 쌩으로 혼자 할 생각은 버리시는 거 추천.. 뉴비 폐사하기 딱 좋을 거 같음", "ts": 1763891927, "up": true, "w": "맵 이동 편의 개선"}, {"ea": false, "g": 2622380, "h": 16, "id": "213574479", "l": "koreana", "o": [["loop", -1, "유저에게 불쾌감 강요하는 방식의 플레이"], ["variety", -1, "선택지따위 좆도 안남기고"]], "pt": 26732, "t": "진짜 앵간하면 좋게 평가할려고 했는데\n시발 진짜 개좆같은 기믹 강요하면서 선택지따위 좆도 안남기고 유저에게 불쾌감 강요하는 방식의 플레이만 남겨두는건 기본적인 예의도 없는 거 아니냐 시발새끼들아\n\n애초에 시발 니들 맵 이변 이벤트를 자기장 바깥에 스폰하도록 짜는 게 맞다고 생각하냐?\n그딴짓을 할거면 레이팅을 쳐 넣질 말던가\n\n프롬소프트라는 이름 빌려서 만든 데이터 폐기물임 시발", "ts": 1766073107, "up": true, "w": "이변 이벤트를 자기장 안에 스폰"}, {"ea": false, "g": 2622380, "h": 18, "id": "212649746", "l": "koreana", "o": [["balance", -1, "강화 리브라 과해"], ["progression", -1, "케릭터 성장 탬 파밍이 아무 의미도 없는"], ["difficulty", -1, "난이도 조절좀 해"], ["feel", -1, "락온 회피 게임이 딴데 처다보게 만들고"]], "pt": 15453, "t": "니들은 니네 게임 하기는 하냐? 게임이 재밌어야지 락온 회피 게임이 딴데 처다보게 만들고 뒤에서 장판기 갈겨대는데 그게 재밌다고 생각하는거냐? \n강화 리브라 과해. 죄인끼리 싸우는거 빈도를 높히든 리브라 공격에도 맞게하던 난이도 조절좀 해 과하다고.\n\n마무리하면서 왜 로그라이트라는 타이틀은 단거냐? 케릭터 성장 탬 파밍이 아무 의미도 없는 그저 손빨겜. 이게 좋아서 하는 사람들이 하는 거지만 적어도 기존 시리즈들은 레벨이 올라가면 내가 강해졌다는 기분을 느낄 수 있는데 밤의 통치자는 그런게 없음. \n좋은 템을 먹든 만랩을 찍든 그런건 그저 스타트 라인에 섰다는 느낌이고 실제로는 보스의 패턴을 외우지 못하면 아무 의미 없이 40분을 인생에서 허비해 버린것임. \n스위치에 나온다는 게임은 어떨지 모르겠지만 이게 프로토 타입이라면 손도 안댈 것 같음", "ts": 1764976531, "up": false, "w": "강화 리브라 난이도 하향"}, {"ea": false, "g": 2622380, "h": 10, "id": "228681961", "l": "koreana", "o": [["loop", 1, "글래디우스 잡고나서의 그 희열"]], "pt": 68802, "t": "오픈 첫날 랜덤매칭으로 21시간만에 글래디우스 잡고나서의 그 희열을 아직도 잊지 못한다.", "ts": 1782263349, "up": true}, {"ea": false, "g": 2622380, "h": 15, "id": "227222399", "l": "koreana", "o": [["difficulty", -1, "피가 20퍼 이하로 남자"], ["network", -1, "네트워크 에러가 발생했습니다"]], "pt": 36910, "t": "이어지는 시산혈하와 바이크창의 세례에 피가 20퍼 이하로 남자...\n강브라는 고대로부터 전해 내려오는 비기\n「 네트워크 에러가 발생했습니다 」 를 사용했다.", "ts": 1780654123, "up": false}, {"c": "아이작", "ea": false, "g": 2622380, "h": 12, "id": "219244046", "l": "koreana", "o": [["variety", -1, "매 판마다 다른 재미가 있어야 되는데"], ["repetition", -1, "계속 똑같은 것만 하는 것 같아서"], ["loop", -1, "손이 안감"]], "pt": 1650, "t": "아무리 로그라이크 느낌의 게임이라고 해도 매 판마다 다른 재미가 있어야 되는데 (아이작류 게임에서의 다양한 아이템 조합 등) 지금까지는 맵도 몹도 거의 똑같고 무기도 본편이랑 큰 차이 없이 단조롭고 보스도 똑같고 몇 번 하니까 계속 똑같은 것만 하는 것 같아서 손이 안감", "ts": 1772078436, "up": false, "w": "맵·몹·무기 다양화"}, {"ea": false, "g": 2622380, "h": 15, "id": "218066037", "l": "koreana", "o": [["dev", -1, "3인 기준으로 만들었습니다'같은 소리"], ["bugs", -1, "겜에 하자가 한두개도 아니고"]], "pt": 1266, "t": "내 생각에 디렉터 이시자키 니는 여기서 커리어 끝일듯 겜에 하자가 한두개도 아니고\n모든 문제를 그냥 '3인 기준으로 만들었습니다'같은 소리하면 다 끝나는 줄 알지 그냥?", "ts": 1770804457, "up": false, "w": "솔로 플레이 난이도 조정"}, {"ea": false, "g": 2622380, "h": 7, "id": "222679089", "l": "koreana", "o": [["multiplayer", 1, "멀티플레이를 게임 설계의 가장 핵심적인 기둥으로"], ["loop", 0, "그 실험은 절반만 성공했습니다"]], "pt": 8155, "t": "엘든링이라는 이름이 없었다면 : 엘든링 밤의 통치자 \n프롬소프트웨어를 정의하는 게임 철학이 있다면, 그것은 단연 '고독과 인내 끝에 찾아오는 성취감'이라고 생각합니다. 데몬즈소울부터 시작된 그 철학은 다크소울 시리즈를 거치고 블러드본과 세키로로 진화했으며 엘든링에 이르러 마침내 완전히 개화했습니다. 그 장구한 여정에서 멀티플레이는 언제나 보조적인 역할에 머물렀습니다. 내가 한계에 봉착했을 때 백기를 들고 타인의 손을 빌리거나, 혹은 남의 세계를 침범해 한바탕 소동을 일으키는 방식, 말 그대로 게임의 주류와는 거리를 둔 불완전한 형태의 연결이었습니다. 그랬던 프롬소프트웨어가 처음으로 멀티플레이를 게임 설계의 가장 핵심적인 기둥으로 세운 게임이 바로 엘든링 밤의 통치자입니다.\n결론부터 말하자면, 프롬이 야심 찬 실험을 했습니다. 그리고 그 실험은 절반만 성공했습니다.\n(스포일러 없는 리뷰입니다.)\n\n 엘든링의 옷을 입은 전혀 다른 게임 \n엘든링 밤의 통치자는 엘든링이라는 IP의 껍데기 위에 로그라이크와 배틀로얄 메커니즘을 이식한 스핀오프입니다. 3인 파티를 구성해 림벨드라는 필드에 진입하고, 세 번의 주야 사이클을 버티며 강해진 다음, 마지막에 등장하는 밤의 통치자를 쓰러뜨리는 것이 게임의 전부입니다. 한 번의 런은 30분에서 45분 사이에 완결됩니다.\n쓰고 나니 굉장히 단순합니다. 실제로도 단순합니다. 엘든링이 만들어낸 방대한 세계와 수직적으로 쌓인 레벨 디자인, 그리고 서사의 깊이를 기대하고 진입한다면 상당히 당혹스러울 겁니다. 본 작에 그런 것은 없습니다. 있는 건 전투뿐입니다. 끊임없이 이어지는 전투, 그리고 그 전투를 위한 효율적인 준비뿐입니다. 이 점을 먼저 명확히 짚어야 하는 이유는 본 작이 가진 단점과 장점 모두 이 전제에서 출발하기 때문입니다.\n\n 전투만큼은 역시 프롬이 한다, 하지만 \n밤의 통치자에서 전투는 여전히 훌륭합니다. 정확히는 엘든링의 전투 시스템이 여전히 훌륭하다고 해야 맞겠지만, 그 전투가 3인 협동이라는 혼돈의 환경 속에서도 무너지지 않는다는 것이 인상적이었습니다. 8종의 나이트파러 캐릭터가 각자 뚜렷한 전투 스타일과 패시브를 보유하고 있어 파티 구성에 따른 시너지와 전술적 선택의 폭이 생각보다 다채롭습니다.\n밤의 통치자 보스전은 연출과 비주얼만큼은 지금까지 프롬소프트웨어가 만들어온 보스전 중에서도 단연 최상급입니다. 3인이 동시에 맞서 싸우는 상황을 전제로 설계되었기에 그 규모와 시각적 임팩트는 오리지널 엘든링의 어떤 보스와 비교해도 압도적입니다. 밤의 통치자 테마곡들 역시 코타 호시노의 작업답게 보스전의 연출과 정확히 맞물려 긴장감을 극도로 끌어올립니다.\n그러나 연출이 화려할수록 실제 전투 설계의 아쉬움이 더 도드라집니다. 3인 기준으로 밸런싱된 보스는 필연적으로 광역 패턴 위주로 설계될 수밖에 없고, 이로 인해 패턴의 다양성이 ", "ts": 1775493047, "up": true}, {"ea": false, "g": 2622380, "h": 14, "id": "227063935", "l": "koreana", "o": [["balance", -1, "조정이 아예 안 되어있거나 미흡한 부분들이 많아"], ["performance", -1, "레이디 재상영은 쓸 때마다 게임이 뚝뚝 끊기고"], ["network", -1, "자기들 네트워크"], ["updates", -1, "출시한 지 1년이 지난 아직까지도 개선이 안 됐어요"]], "pt": 1944, "t": "요약: 프롬 게임 희대의 망작. 장르에 대한 이해도가 아예 없는 수준이라는 평가가 대부분이었지만, 실상은 장르를 이해하려고 시도조차 하지 않은, 재능과 노력 둘 다 없는 사람이 그저 엘든링이라는 이름만 믿고 만든 게임.\n\n이 게임의 재미는 엘든링 자체가 재미있으니 재미있을 뿐이며 이 게임이 잘 만든 게임이기 때문은 절대 아닙니다. 이 게임의 경우 소울 게임을 로그라이크 식으로, 심지어 시간이 촉박한 빠른 템포의 게임으로 바꿨기에 이에 맞도록 조정해야 하는 것들이 상당한데, 조정이 아예 안 되어있거나 미흡한 부분들이 많아 불쾌함이 상당합니다. 어떻게 해야 소울 게임을 로그라이크 식으로 잘 바꿀까 고민한 흔적이 거의 없어요. 그저 엘든링이라는 게임 자체의 재미만 믿고 장르만 딸깍하고 바꾼 오만하고 게으른 게임입니다.\n\n그리고 가장 어이가 없는 건 자기들 게임들이 최적화나 네트워크 상태가 썩 좋지 않음을 충분히 알고 있었을 텐데, 전혀 개선하지 않은 채로 출시했다는 점입니다. 아니, 심지어 출시한 지 1년이 지난 아직까지도 개선이 안 됐어요. 맵도 하나짜리인 주제에 무슨 로딩을 그리 오래 하는지 시간이 촉박한 게임에서 사망 후 리스폰 시간이 어쩔때는 10초까지도 걸리고, 레이디 재상영은 쓸 때마다 게임이 뚝뚝 끊기고, 게임 잘 하다가도 자기들 네트워크 문제로 게임이 해산되면 그냥 패배 처리하는 등 그냥 말이 안 나오는 수준입니다.\n\n6개월 동안 업데이트도 없는 거 보면 가망도 없는 게임이니까 굳이 프롬사의 멀티게임이 하고 싶으시다면 추후 출시될 더스크 블러드를 하세요. 더스크 블러드는 미야자키가 디렉터이니 최소 이 게임마냥 쓰레기처럼 만들지는 않을 겁니다. 앞으론 저도 아무리 프롬 게임이라고 하더라도 디렉터 자리에 미야자키가 없으면 쳐다도 안 볼 예정입니다.", "ts": 1780461611, "up": false, "w": "최적화 및 리스폰 시간 단축"}, {"ea": false, "g": 2622380, "h": 8, "id": "215398329", "l": "koreana", "o": [["multiplayer", -1, "상대의 트롤링으로 인한 패널티"], ["volume", -1, "한판의 길이가 너무 길다는 것"], ["progression", -1, "한번의 패배로 모두 잃으면"], ["characters", 1, "캐릭터들은 잘 만들었어요"]], "pt": 14846, "t": "꾸준히 같이 할 친구들이 함께 한다면 추천하나, 없다면 명백한 비추천입니다.\n쓰고 싶은 말이야 엄청 많으나... 그것도 불쾌한 경험 이상으로 좋았던 추억이 있어야 되나 봅니다.\n\n죽음 그 자체는 기분 나쁘진 않습니다. 그러나 게임은 너무 길고, 상대의 트롤링으로 인한 패널티를 저도 패널티를 받아야 한단 점입니다. 그 패널티가 역시 강력하죠.\n패널티가 약했으면 씁 하고 다음 게임으로 가겠는데. 올릴 땐 3~4판은 해야 올리는 분량을 한번의 패배로 모두 잃으면 그 날 하룻동안 올린 심도 포인트를 모조리 까먹으니 할 맛이 적어도 저는 안 나네요.\n그래서 친구들 끼리 해서 3명 다 심도 9999 만든 이후엔 안 킵니다.\n\ndlc 이야기 나왔을 때, 잠깐 해봤으나 이 게임은 근본적으로 잘못 만들어졌음을 다시 느낄 뿐입니다. 캐릭터들은 잘 만들었어요, 컨셉트도 그럴 듯 해요.\n그러나 설계, 이 게임의 최대 단점은 한판의 길이가 너무 길다는 것과 숨돌릴 틈도 없다는 겁니다.\n심도 랭크 및 매칭 시스템은 생각하고 만든 건가 싶은 수준이고요.\n\n적어도 무기 리롤 같은 건 없어도, 상점에 해당 클래스의 전용 무기 1개는 확정적으로 떠준다거나, 난이도 조절 및 배분(본 게임보다 2단계 더 쉬운 난이도부터 심도 5보다 1단계 더 어려운 난이도 까지/ 플레이 시간 모드, 필드와 보스 수준)은 있어야 했어요.\n프롬 게임이면 다 해보고 1000시간 이상은 해보는 편인데, 이 게임은 못하겠습니다.", "ts": 1767791285, "up": false, "w": "패배 시 심도 포인트 손실 완화"}, {"ea": false, "g": 2622380, "h": 8, "id": "225255647", "l": "koreana", "o": [["volume", -1, "맵이 1개라 너무 아쉽고"], ["price", -1, "5만원에는 비추"]], "pt": 1452, "t": "맵만 늘려줘도 할만했을 텐데 맵이 1개라 너무 아쉽고 5만원에는 비추 다만 세일해서 3만원때면 그냥 한 10시간 정도는 할 거 같음 그리고 엘든링을 보고 이 게임을 사서 한다? 그냥 엘든링 다 회차를 해라", "ts": 1778481082, "up": false, "w": "맵 추가 제공"}, {"ea": false, "g": 2622380, "h": 9, "id": "234566862", "l": "koreana", "o": [["performance", -1, "게임의 프레임이나 밸런싱"], ["balance", -1, "밸런싱"], ["network", -1, "서버 관리"], ["updates", -1, "서비스 유지에 대한 패치를 할 줄 모르는"]], "pt": 2761, "t": "게임의 프레임이나 밸런싱, 서버 관리 등 서비스 유지에 대한 패치를 할 줄 모르는 게임사.\n 온라인 라이브 서비스 게임보단 싱글 패키지 게임에만 몰두해야 할 이유가 과감히 보인다.", "ts": 1788642921, "up": false, "w": "프레임·서버 관리 패치"}, {"c": "엘든링", "ea": false, "g": 2622380, "h": 6, "id": "231296292", "l": "koreana", "o": [["updates", -1, "DLC같은 ㅈ같은 맵만 내지말고"], ["performance", -1, "렉이 아주 쓰발이고"], ["monetization", -1, "유저들 돈 빨아먹으려면 제대로 빨아먹어야지"], ["price", -1, "재미만 없었어도 바로 환불 때렸다"]], "pt": 2529, "t": "프롬소프트는 들어라. 당장 엘밤통을 라이브서비스 게임으로 전환하고 DLC같은 ㅈ같은 맵만 내지말고 제대로 만든 맵, 무기, 유물, 신캐, 보스, 저널스토리 당장 가져와라\n개발비가 아깝다 유저들 돈 빨아먹으려면 제대로 빨아먹어야지 여름세일해서 유입들 들어왔으니까 물들어올때 노저어라 지금 새로 개발하는거 뭔진모르겠지만 가망 없으니까 이거나 IP확장하고 존나 키워서 스피드런 E-sport 같은거도 내고해라 그리고 최적화 담당자를 변기에 처박고 내렸냐 출시일이 2025년인데 엘든링보다 더 퇴보하는게 말이됨???? 렉이 아주 쓰발이고 재미만 없었어도 바로 환불 때렸다", "ts": 1785001033, "up": true, "w": "라이브 전환, 맵·무기·보스 추가"}, {"ea": false, "g": 2622380, "h": 7, "id": "213612447", "l": "koreana", "o": [["multiplayer", -1, "매번 파티원 중에 탈주자가 생겨"], ["monetization", -1, "버려진 공허를 구매하면 심도 점수도 떨어지며"], ["loop", -1, "게임에 대한 의욕도 떨어뜨릴 수 있다"]], "pt": 61674, "t": "버려진 공허\n\n이름 그대로 게임을 공허로 버려버렸다는 것을 의미한다.\n\n해당 DLC의 지변 대공동이 뜨면 매번 파티원 중에 탈주자가 생겨 게임을 제대로 할 수 없게 한다.\n\n하지만 탈주 하는 이유는 이해 할 수 있기에 화가 나지 않는다.\n\n버려진 공허를 구매하면 심도 점수도 떨어지며 게임에 대한 의욕도 떨어뜨릴 수 있다.\n\n더스크 블러드에 대한 기대감도 공허에 버릴 수 있게 해준다.", "ts": 1766113421, "up": false}, {"c": "엘든링", "ea": false, "g": 2622380, "h": 9, "id": "229843215", "l": "koreana", "o": [["bugs", -1, "뭐만하면 튕겨서 제대로플레이할수없다"], ["performance", -1, "엘든링이랑 사펑도 돌아가는데 왜엘밤통이"]], "pt": 1377, "t": "tlqkf 게임을하는데 뭐만하면 튕겨서 제대로플레이할수없다 엘든링이랑 사펑도 돌아가는데 왜엘밤통이 안돌아가냐 있는게임 싹다지우고 엘밤통만해도 튕기는데 이게 게임이냐 이딴게임 다시는안한다", "ts": 1783424846, "up": false, "w": "크래시 해결 및 최적화"}, {"c": "엘든링", "ea": false, "g": 2622380, "h": 5, "id": "207950297", "l": "koreana", "o": [["multiplayer", 1, "기존 프롬겜의 멀티에서 아쉬움을 느꼈던"]], "pt": 3860, "t": "기존 프롬겜의 멀티에서 아쉬움을 느꼈던 나 같은 사람에겐 강추\n엘든링보다 발전한 무언가를 원한다거나 본인이 이런 류의 게임 경험이 없다면 사지말것", "ts": 1761824880, "up": true}, {"ea": false, "g": 2622380, "h": 3, "id": "226264258", "l": "koreana", "o": [["audio", 1, "보스 연출과 ost가 좋았음"], ["monetization", -1, "dlc가 컨텐츠 양질이 좋지 않아서"], ["volume", -1, "탐험하고 격파하는 요소가 부족하기 때문에"], ["multiplayer", 1, "사람들과 코옵 하는게 좋다"]], "pt": 13977, "t": "엘든링 황금 나무 그림자가 나왔을때 2년 이라는 시간이 지난 만큼 \n본편 게임보다 ost가 더 웅장 하다고 느낄 정도로 성장한게 느껴졌는데 \n밤의 통치자는 게임성이 멀티 플레이어 기반으로 만들어져서 본작과 비교 하기에는 좀 그렇지만\n그 엘든링 dlc보다 더 성장 했다고 느낄 정도로 보스 연출과 ost가 좋았음 \n\n다만 dlc가 컨텐츠 양질이 좋지 않아서 평가가 좋지는 않지만 스트라게스 ost 듣고나면 좋지 않은 평가가\n잊혀질 정도로 오케스트라와 클래식 장르를 자연스럽게 이어 나가는게 정말 놀라웠음 \n그냥 나멜레스와 같이 통틀어서 엘밤통 교향곡이라고 해도 될 정도임\n \n엘든링처럼 탐험하고 격파하는 요소가 부족하기 때문에 본작 같은 재미를 바란다면 추천을 하기엔 어렵지만 \n보스만 잡아도 재밌고 사람들과 코옵 하는게 좋다 하면은 추천할 수 있음", "ts": 1779579276, "up": true}, {"ea": false, "g": 2622380, "h": 5, "id": "213809468", "l": "koreana", "o": [["loop", -1, "이건 그딴거 없음 그냥 불쾌함"], ["repetition", -1, "몇십분동안 파밍해도 파밍 ㅈ박으면"], ["difficulty", -1, "깨는건 거의 불가능하고"], ["ui", -1, "다시시작 기능좀 넣어줘라"]], "pt": 697, "t": "닼소3 엘든링 세키로 올 도전과제 한 사람으로써 이건 기존 소울류의 장점이 없는 게임임\n소울류 자체가 보스를 계속 트라이 하면서 깼을때 쾌감을 느끼는게 장점인데 이건 그딴거 없음\n그냥 불쾌함 몇십분동안 파밍해도 파밍 ㅈ박으면 깨는건 거의 불가능하고 보스 한번 뒤지면 재미없는 파밍을 다시 해야함\n그리고 그냥 엿먹으라고 만든듯한 부분이 너무 많음 중앙성채 항아리거인이나 2번째날 밤 부패늪 보스라던지 \n내가 보기엔 제작진들도 지들 게임 해보면 욕나올걸 \n그리고 다시시작 기능좀 넣어줘라 이미 ㅈ망해서 다시해야되는데 그런 기능도 안만들어 놓냐?", "ts": 1766311748, "up": false, "w": "다시 시작(리셋) 기능 추가"}, {"ea": false, "g": 2622380, "h": 9, "id": "220357133", "l": "koreana", "o": [["monetization", 1, "새로운 스킨을 DLC로 만들어주면"]], "pt": 17116, "t": "새로운 스킨을 DLC로 만들어주면, 나는 당장 구매한다\r\n新しいスキンをDLCにしてくれたら、私は今すぐ購入する\r\nIf they make new skins as DLC, I'll buy it right away", "ts": 1773157788, "up": true, "w": "신규 스킨 DLC 출시"}, {"c": "엘든링", "ea": false, "g": 2622380, "h": 10, "id": "212756229", "l": "koreana", "o": [["loop", -1, "설계부터 하자덩어리"], ["monetization", -1, "특히 dlc는 개병신이라 비추"], ["volume", -1, "적어도 추가장비랑 기도, 마법들이라도"], ["art", 1, "이쁘고 넓음"]], "pt": 6528, "t": "앞으로 프롬게임이라고 믿고 사는 게임은 아닐듯 함. 설계부터 하자덩어리. 로그라이크를 할거면 차라리 시간제한을 보스 강화로 집어넣지 왜 밤의비를 처 넣었는지 이해가 안돼는 부분. 특히 dlc는 개병신이라 비추 드립니다. 보스만 잘만들면 뭐함 나머지가 창났는데. 신보스 2마리는 마음에 들지만 그게 끝임. 맵? 이쁘고 넓음, 이게 엘든링 본편이었으면 굉장히 호평했겠지만, 밤의비랑 거지같은 습격이랑 복잡한맵, 낙사랑 합쳐지니 지랄이 나버렸음. 이딴게 7개월 걸려서 만든 dlc? 적어도 추가장비랑 기도, 마법들이라도 같이 넣어줬으면 덜했을텐데.", "ts": 1765093520, "up": false, "w": "DLC에 장비·기도·마법 추가"}, {"ea": false, "g": 2622380, "h": 4, "id": "213481721", "l": "koreana", "o": [["balance", -1, "그냥 딜만 개뻥튀기 돼서"], ["loop", -1, "재미없음"]], "pt": 14306, "t": "심도 4부터 그냥 딜만 개뻥튀기 돼서 역겹고 재미없음\r\n스트레스 받기 싫으면 3에서 노셈", "ts": 1765951697, "up": false, "w": "심도별 딜 증가 완화"}, {"ea": false, "g": 2622380, "h": 3, "id": "226685254", "l": "koreana", "o": [["multiplayer", 1, "같이 놀아주는 친구들이 있어서"], ["updates", 0, "새 게임 새 DLC 또 내주면 좋겠어"]], "pt": 5343, "t": "같이 놀아주는 친구들이 있어서 이것만 평생 할 수 있음\n그치만 새 게임 새 DLC 또 내주면 좋겠어\n맡겨놨냐고? 당연하지 당장 내놔 평생 게임 만들어줘", "ts": 1780048116, "up": true, "w": "새 게임·DLC 지속 출시"}, {"ea": false, "g": 2622380, "h": 3, "id": "237709464", "l": "koreana", "o": [["updates", -1, "유기 쳐하지 말고 dlc나 더 내라"], ["multiplayer", 1, "3명이서 하면 꿀잼이긴한데"], ["volume", -1, "걍 먹을게 겁나 없음"], ["dev", -1, "개발진들이 뇌에 문제가 있는 듯"]], "pt": 9603, "t": "유기 쳐하지 말고 dlc나 더 내라. 그냥 개발진들이 뇌에 문제가 있는 듯, 이런 국밥 같은 겜 쳐 냅두고 무려 '스위치2 독점' ㅇㅈㄹ하는 더스크 블러드 개발 쳐 하고 있노. 왜 쳐 유기 한지 아직도 모르겠음\n\n할인할때 사셈 3명이서 하면 꿀잼이긴한데 친구 2명이서 해도 꽤 재밌음. 걍 먹을게 겁나 없음 게임은 잘 만들었는데", "ts": 1791994230, "up": false, "w": "DLC·콘텐츠 추가 업데이트"}, {"ea": false, "g": 2622380, "h": 2, "id": "235688362", "l": "koreana", "o": [["loop", 1, "그래도 겜은 재밌게 즐기고 있네요"], ["network", -1, "서버관리 좀 해줘요"], ["updates", -1, "dlc말고 다른 업데이트가 있었으면 좋겠어요"]], "pt": 27328, "t": "재미는 있는데 문제가 아직 많네요, 서버관리 좀 해줘요. 제발 글고 dlc말고 다른 업데이트가 있었으면 좋겠어요. dlc 이 겜 dlc 나온지도 거즘 1년 됐는디 그래도 이 게임 오랫동안 했는데 다른 업뎃 좀 해줬으면 좋겠네요 그래도 겜은 재밌게 즐기고 있네요", "ts": 1789910346, "up": true, "w": "서버 관리 및 DLC 외 업데이트"}, {"ea": false, "g": 2622380, "h": 3, "id": "213431639", "l": "koreana", "o": [["bugs", -1, "뭐하면 팅기고 뭐하면 로그아웃 상태되고"], ["network", -1, "프롬 고질적인 서버문제가 있는데"]], "pt": 4332, "t": "개 병2신 게임임 뭐하면 팅기고 뭐하면 로그아웃 상태되고 프롬 고질적인 서버문제가 있는데 멀티 지향겜이라는거임", "ts": 1765903545, "up": false}, {"ea": false, "g": 2622380, "h": 9, "id": "223208810", "l": "koreana", "o": [["bugs", -1, "종종 튕기는 문제"], ["multiplayer", -1, "소통이 핑, 감정표현 하나밖에 없어서"], ["network", -1, "악성유저랑 서버, 소통수단좀"]], "pt": 10736, "t": "추가 업데이트까진 안바라는데 제발 악성유저랑 서버, 소통수단좀 어떻게든 해봐라 대가리 깨져서 몇번이고 플레이 할 정도로 나쁘지 않은데 종종 튕기는 문제랑 지 안풀린다고 좆같다고 던져대는 북미, 짱깨새끼들이랑 협동이 중요한테 소통이 핑, 감정표현 하나밖에 없어서 뉴비 갈려나가는거 보면 이겜 하는 내내 좆같더라", "ts": 1776120072, "up": false, "w": "소통 수단 및 악성유저 대응"}, {"ea": false, "g": 2622380, "h": 9, "id": "209472299", "l": "koreana", "o": [["updates", -1, "dlc 오래걸려서 새 필드 정도는 나올 줄 알았는데"]], "pt": 11792, "t": "dlc 오래걸려서 새 필드 정도는 나올 줄 알았는데 지변으로 퉁친거 보고 빡쳤으면 개추", "ts": 1763390336, "up": true, "w": "새 필드 DLC 출시"}, {"ea": false, "g": 2622380, "h": 1, "id": "210785030", "l": "koreana", "o": [["multiplayer", -1, "그냥 솔플 하는게 나음"]], "pt": 22729, "t": "나쁜 게임은 아니지만, 그렇다고 해서 프롬 특유의 문제점이 없어졌나 치면 그것도 아닌 아쉬운 겜\r\n화딱지 나기 싫고 우정을 지키고 싶다면 그냥 솔플 하는게 나음.", "ts": 1764141309, "up": true}, {"ea": false, "g": 2622380, "h": 3, "id": "209283019", "l": "koreana", "o": [["progression", -1, "도가니만도 못한 보상"], ["multiplayer", -1, "트롤새~끼야"]], "pt": 4361, "t": "씨2발 트롤새~끼야 도가니만도 못한 보상 쳐 주면서 왜 좆같게 구는건데\n\n리브라 개 씨발새끼", "ts": 1763213506, "up": false}, {"ea": false, "g": 2622380, "h": 9, "id": "221236578", "l": "koreana", "o": [["multiplayer", -1, "엘든링을 멀티로 할 수 있다고 했을 때"]], "pt": 1331, "t": "엘든링을 멀티로 할 수 있다고 했을 때\n누구도 이런걸 기대하진 않았을텐데", "ts": 1774072021, "up": false}, {"ea": false, "g": 2622380, "h": 2, "id": "218005849", "l": "koreana", "o": [["loop", 1, "재밌기도 하고"], ["network", -1, "키면 렉이 좀 심해서"], ["multiplayer", 1, "채팅 없어서 좋음"]], "pt": 7995, "t": "재밌기도 하고\n채팅 없어서 좋음\n근데 키면 렉이 좀 심해서 바로 키자마자 출전 하지 말고 좀 있다가 하는걸 추천\n(3050)", "ts": 1770734467, "up": true}, {"c": "엘든링", "ea": false, "g": 2622380, "h": 8, "id": "231757244", "l": "koreana", "o": [["loop", 1, "겜은 재밌는데"], ["updates", -1, "닌텐도독점엘든타르코프 만든다고 유기해서"]], "pt": 2102, "t": "겜은 재밌는데 닌텐도독점엘든타르코프 만든다고 유기해서 걍 비추함", "ts": 1785519221, "up": false, "w": "유기하지 않고 업데이트 지속"}, {"c": "다크소울", "ea": false, "g": 2622380, "h": 3, "id": "225173409", "l": "koreana", "o": [["feel", -1, "조작법이 20년전 게임보다 못하다"], ["ui", -1, "esc를 눌러도 뒤로가기 안되고"], ["difficulty", -1, "난이도조절 귀찮아서 원킬딸깍"], ["onboarding", -1, "불친절이야 프롬겜 특이니"]], "pt": 1303, "t": "이 게임은 조작법이 20년전 게임보다 못하다는 점 에서 이미 비추를 받을만 함\n불친절이야 프롬겜 특이니 그렇다 쳐도 esc를 눌러도 뒤로가기 안되고 Q 굳이 누르라는거 보면 어우 씹\n\n+보스가 쳐 가만히있을 생각을 안함 다크소울 원툴이란게 증명된 ㅄ회사\n보스가 캐릭터를 공격하는게 아닌 컴퓨터를 공격하는 미친게임\n난이도조절 귀찮아서 원킬딸깍, 시점과 락온은 개지랄 얘들수준 으로는 만들면 안되는 보스만 대량양산\n\n액션성 이외에는 중소기업만 못한 게임", "ts": 1778392817, "up": false, "w": "ESC 뒤로가기, 조작 개선"}, {"ea": false, "g": 2622380, "h": 1, "id": "221527891", "l": "koreana", "o": [["multiplayer", 1, "같이할 "h": 4, "id": "237491086", "l": "koreana", "o": [["updates", -1, "포텐셜이 엄청난데 유기됨"]], "pt": 40549, "t": "포텐셜이 엄청난데 유기됨\n좆소다운 행보", "ts": 1791745307, "up": true, "w": "업데이트 재개"}, {"ea": false, "g": 2622380, "h": 1, "id": "237460019", "l": "koreana", "o": [["network", -1, "서버도 점수 시스템도 쓰레기면서"], ["progression", -1, "점수 시스템도 쓰레기면서"]], "pt": 26361, "t": "서버도 점수 시스템도 쓰레기면서 무슨 심도 같은 랭크를 처만들어 놓은 건지 이해가 안되네", "ts": 1791722532, "up": false}, {"ea": false, "g": 2622380, "h": 0, "id": "237459565", "l": "koreana", "o": [["multiplayer", 1, "친구들과 함께 한다면 5배 재밌는"]], "pt": 3734, "t": "이 게임 모두에게 추천합니다 친구들과 함께 한다면 5배 재밌는 ㄹㅈㄷ 게임 엘든링 밤의 통치자", "ts": 1791722153, "up": true}, {"ea": false, "g": 2622380, "h": 0, "id": "237451638", "l": "koreana", "o": [["difficulty", 1, "할 만하네요"]], "pt": 242741, "t": "조금 밖에 안했는데 할 만하네요", "ts": 1791714699, "up": true}, {"c": "엘든링", "ea": false, "g": 2622380, "h": 0, "id": "237403250", "l": "koreana", "o": [["difficulty", -1, "난이도가 너무 어렵다"], ["progression", -1, "정해진 시간 내에 성장을 많이 해야"], ["endgame", -1, "랭크 최고점수를 한 5번 정도 찍고나서 할게없어서"]], "pt": 54425, "t": "프롬 소프트웨어에서 야심차게 내어놓은 멀티플레이어 기반 소울.\r\n\r\n랭크 최고점수를 한 5번 정도 찍고나서 할게없어서, 구매를 망설이는 사람들에게 도움이 되도록 몇 글자 적어내려봄.\r\n\r\n1. 난이도가 너무 어렵다.\r\n이 게임을 구매하려고 리뷰를 보는 사람들의 대다수는 엘든링 혹은 그 전작의 영향을 받았을 확률이 높을 것 같음. 즉 고난이도 전투에 꽤 익숙해진 사람들이 밤의 통치자를 들여다보고 있을것 같은데, 결론적으로 이 게임은 진짜 고난이도임.\r\n\r\n예를 들어, 전작들의 경우 정해진 레벨 디자인이라는 것이 있었고, 내가 해당 레벨의 전투가 힘겨울 경우에는 다른 곳에서 돈을 더 모으거나 새로운 장비를 강화해서.. 즉 준비해서 올 수 있었음. 내가 자신이 없으면 특정 패턴을 천천히 유도해서 한대씩 누적시키는 방법도 하나의 전략이었고, 기본적으로 시간적인 압박은 없었음.\r\n\r\n그러나 림벨드에서의 전투는 배틀그라운드처럼 자기장이 다 좁혀오기 전에 '최대한 빠른 속도로' 적을 주파해야함. 정해진 시간 내에 성장을 많이 해야 하다보니까 고밸류 고난이도 노드를 우선시하게 됨. 또한 정해진 시간 내에 적을 많이 잡아야하니까 천천히 전투하기보다는 딜을 말그대로 우겨넣는 방식이 더 선호됨. 그럴려면 당연히 적들의 패턴을 정확히 숙지해야함.\r\n\r\n특히 고심도(승천 개념)로 갈수록 적들의 스펙이 굉장히 높아져서, 사실상 플레이 중에 안 죽는게 이상할 정도임. \r\n\r\n2. 하지만 멀티플레이 게임이다.\r\n그럼에도 불구하고 따봉을 박은 이유는 바로 이 게임이 멀티플레이 기반이기 떄문임. 안 죽는게 이상하지만, 나의 팀원들은 무려 나를 때려서(?) 살릴 수 있다! 백령을 제외하면 거의 혼자서만 세계를 모험하던 수많은 선불자, 저짊자, 재의귀인, 빛바랜자들이 이제는 힘을 모아 적들과 싸울 수 있다니, 정말 낭만적인 일이 아닐 수 없음..\r\n\r\n물론 멀티플레이라고 하면 팀원의 실력이 많이 모자라거나, 고집불통이거나, 탈주하거나, 핵쟁이거나, 기타 등등 인간군상을 경험할 확률이 있다는 거겠지만, 뭐 어떻겠음. 다른 멀티게임이라고 안 그런것도 아니고. 근데 현재에 한해서는 그런 사람들 거의 못 보긴함.\r\n\r\n3. 그럼 재미가 있는가?\r\n음, 재밌긴 한데, 이건 호불호가 좀 갈릴 것 같음. \r\n기본적으로 내가 느끼는 재미는 보스전의 재미이고, 뭔가 빌드업하고 세팅하고 이런 재미가 아님. \r\n일단 한 판의 파밍과정이 지루하지 않음. 왜냐하면 파밍이 거의 계속 보스전의 연속이기 때문에.\r\n또 최종보스(밤왕)도 굉장히 잘 만들었음. 처음 접해보면 뭔가 좀 억까같은 패턴들이 있을텐데, 질주나 아츠같이 새로 추가된 기능을 잘 활용해보면 좋음. 새로운 기능을 잘 활용하도록 설계한 것 같음. \r\n\r\n반면 엘든링 혹은 다크소울 시리즈에서 구석구석 돌면서 아이템 루팅하거나, 노가다해서 내실 차곡차곡 쌓고, 퀘스", "ts": 1791662418, "up": true}, {"ea": false, "g": 2622380, "h": 0, "id": "237303188", "l": "koreana", "o": [["performance", -1, "가끔씩 렉걸리긴 하는데"], ["loop", 1, "재밌음"]], "pt": 25003, "t": "가끔씩 렉걸리긴 하는데 재밌음", "ts": 1791567965, "up": true}, {"ea": false, "g": 2622380, "h": 0, "id": "237089446", "l": "koreana", "o": [["multiplayer", -1, "멀티가 취향이 아님"]], "pt": 1388, "t": "멀티가 취향이 아님", "ts": 1791328637, "up": false}, {"ea": false, "g": 2622380, "h": 2, "id": "237055921", "l": "koreana", "o": [["updates", -1, "게임 유기하지 마시오"]], "pt": 10346, "t": "게임 유기하지 마시오 이건 경고요", "ts": 1791298928, "up": false, "w": "유기하지 않고 업데이트 지속"}, {"ea": false, "g": 2622380, "h": 0, "id": "236960578", "l": "koreana", "o": [["balance", -1, "토룡 7연돌진은 아니잖아"]], "pt": 6659, "t": "아니 토룡 7연돌진은 아니잖아", "ts": 1791199143, "up": true}, {"ea": false, "g": 2622380, "h": 0, "id": "236951928", "l": "koreana", "o": [["loop", 1, "재밌음"]], "pt": 1443, "t": "심술나긴 한데 재밌음;", "ts": 1791188359, "up": true}, {"ea": false, "g": 2622380, "h": 2, "id": "236913371", "l": "koreana", "o": [["loop", 1, "처음 몇시간할땐 진짜 재밌음"], ["updates", -1, "유기를 쳐때릴거면 게임 완성부터"], ["variety", -1, "로그라이크면 매판 다른빌드가 되어야하는데"], ["difficulty", -1, "난이도가 올라가면 체력만 뻥튀기시킬게"]], "pt": 5362, "t": "게임 시스템 처음엔 나름 재밌음 처음 만든거니까 그러려니함\n보스전 웅장해서 재밌음\n오픈월드를 지루하지 않게 달리는법을 잘 적용한것같아서 이동이 딱히 ㅈ같지도 않음\n탬포도 빨라서 기존에 보스전하려면 보스찾는다고 평생 싸돌아다니던거 보완된것같아서 괜찮았음\n처음 몇시간할땐 진짜 재밌음\n근데\n유기를 쳐때릴거면 게임 완성부터 시켜놓던가 난이도가 올라가면 체력만 뻥튀기시킬게 아니라 패턴추가형태의 요소라도 넣어놓던가 빌드는 뭐 대충 좋은무기 찾아서 강화땅땅 때리면 늘상 고점이 ", "o": [["volume", -1, "컨텐츠가 부족해요"]], "pt": 174035, "t": "컨텐츠가 부족해요", "ts": 1787863543, "up": false, "w": "콘텐츠 추가 필요"}, {"ea": false, "g": 2622380, "h": 4, "id": "233820598", "l": "koreana", "o": [["performance", -1, "최적화도 안되있고"], ["loop", -1, "재미가 있냐? 그거도 아님"], ["multiplayer", -1, "입장할때 사람모으느라 2시간 날려서"], ["price", -1, "환불 못하는게 한이다"]], "pt": 66, "t": "사놓고 딱 한판하고 껐음. 이거에 추천주는사람은 뭐하는 사람들임? 최적화도 안되있고 제한도 겁나많고 그렇다고 재미가 있냐? 그거도 아님. 입장할때 사람모으느라 2시간 날려서 환불 못하는게 한이다. 어떻게든 매우 부정적으로 만들어서 추가 피해자를 막아야함. 내가 사본게임중 제일 역한게임", "ts": 1787837100, "up": false}, {"ea": false, "g": 2622380, "h": 0, "id": "233811165", "l": "koreana", "o": [], "pt": 41993, "t": "깨달음이 느린 나는 아직도 갈 길이 멀다.", "ts": 1787827427, "up": true}, {"ea": false, "g": 2622380, "h": 0, "id": "233767325", "l": "koreana", "o": [["loop", 1, "너무 재밌는데"], ["difficulty", -1, "마지막 보스가 너무 어려워서"], ["multiplayer", 1, "친구들이랑 재밌게 하는거 같아요"], ["monetization", 1, "DLC도 같이 나와주면 아주 좋습니다"]], "pt": 1984, "t": "너무 재밌는데 마지막 보스가 너무 어려워서 친구들이랑 재밌게 하는거 같아요 다른 주제로 많은 게임이 나오면 정말 재밌게 사고 바로 추천해주면서 즐길수 있을거 같아요 DLC도 같이 나와주면 아주 좋습니다 엘든링 관계자 분들 부탁드려ㅑ요", "ts": 1787772125, "up": true, "w": "DLC 출시"}, {"ea": false, "g": 2622380, "h": 0, "id": "233572306", "l": "koreana", "o": [["loop", 1, "소울류 좋아하면 무조건 해야하는 게임"]], "pt": 3650, "t": "소울류 좋아하면 무조건 해야하는 게임", "ts": 1787552736, "up": true}, {"ea": false, "g": 2358720, "h": 34, "id": "232431679", "l": "koreana", "o": [["feel", 1, "액션이 너무 재미있다"], ["story", 1, "스토리 몰입이 자연스럽게 된다"]], "pt": 3534, "t": "좋았던 점\n - 액션이 너무 재미있다\n - 스토리 몰입이 자연스럽게 된다\n - 친숙한 소재\n\n아쉬웠던 점\n - 없음\n\n총평\n5/5", "ts": 1786285386, "up": true}, {"ea": false, "g": 2358720, "h": 14, "id": "217703362", "l": "koreana", "o": [["loop", 1, "도파민 터지는 액션씬"], ["repetition", -1, "사당과 사당의 사이 거리가 김"], ["ui", -1, "쉬벌 이게 벽인지 길인지 몰라"], ["art", 1, "눈이 즐겁고"]], "pt": 6256, "t": "소울류 게임을 좋아하는 사람이라면 추천\n맵 핥아 먹기 좋아하는 사람이라면 추천\n서유기에 관해 알면 더 재밌고 모르는 사람도 재밌게 플레이 가능\n\n- 단점으로 다가올 수 있는 부분을 굳이 꼽자면\n\n1. 보스가 많다\n2. 쉬벌 이게 벽인지 길인지 몰라\n3. 사당과 사당의 사이 거리가 김.. 근데 좀 많이 김 ( 화톳불 = 사당 )\n4. 이랑진군\n\n보스를 상대할 때 편하게 상대하게 해주는 아이템이 존재하지만 필수로 갖고 있지도 않고,\n이스터에그처럼 숨어있기도 함. 그래서 맨땅에 헤딩 하듯이 1회차 진행하고 나서 검색하면서 플레이하니까\n2회차 부터는 즐기는 모드가 됌. 새로 오픈되는 업적도 생기고 장비도 생김. 필수는 아니지만 오기가 생김.\n\n마지막으로, 이 게임은 자기가 넣고 싶은 전투요소를 과하지 않게 적절히 잘 넣어놨음.\n플레이하는 입장에선 눈이 즐겁고 클리어했을 때의 쾌감..을! 즐기는 아주 야물딱진 게임이다.\n\n정말 육성으로 감탄하면서 즐기는 게임은 이것이 첫번째이지 않을까 단연코, 생각이 들게 만듦.\n\n결론, 때론 짜증나고 이랑진군 대가리 눈을 깨부시고 싶지만, 간파할 때의 짜릿함, 도파민 터지는 액션씬.\n이만큼 재밌는 게임은 처음. 정말 정말로 추천 한다.\n관심이 있다면 당장 사도록.", "ts": 1770391459, "up": true}, {"ea": false, "g": 2358720, "h": 10, "id": "236474588", "l": "koreana", "o": [["story", 1, "스토리부터 맵 구성"], ["characters", 1, "개성있는 필드몹과 사연있는 수많은 보스들"], ["difficulty", 1, "정통 소울라이크보다는 쉽습니다"], ["ui", -1, "길 잘못들면 만나지 못하는 보스들"]], "pt": 6632, "t": "근두운에 여의봉!! 저팔계까지 나옵니다. 중국 4대기서중 하나인 서유기를 각색한 게임인데, 엄청납니다. 스토리부터 맵 구성, 개성있는 필드몹과 사연있는 수많은 보스들, 그리고 연출까지!! 중국게임 대단하네요. 길 잘못들면 만나지 못하는 보스들이 제법 있다는게 단점 정도 되겠습니다. 정통 소울라이크보다는 쉽습니다. 조금 어려운 액션 RPG에 가깝습니다. 기회가 되면 꼭 해 보시기를 추천합니다. 아쉽게도 사오정과 삼장법사는 나오지 않습니다.", "ts": 1790693737, "up": true, "w": "길 안내 및 지도 개선"}, {"ea": false, "g": 2358720, "h": 14, "id": "212518986", "l": "koreana", "o": [["price", 1, "육만 오천원 아깝지 않습니다"], ["loop", 1, "정말 재밌습니다"]], "pt": 441, "t": "클릭 세 번으로 통장 잔고가 10에서 3.5가 되니까 기분이 많이 나빴는데,\r\n게임 들어가서 인트로 보자마자 '사길 잘 했다' 생각하며 너무나 재밌게 게임 중 입니다\r\n이 게임을 하면서 \"이게 중국이지!!!!\" 라는 극 찬을 여러 차례 입 밖으로 꺼내었습니다\r\n정말 재밌습니다 육만 오천원 아깝지 않습니다", "ts": 1764816890, "up": true}, {"ea": false, "g": 2358720, "h": 7, "id": "216401781", "l": "koreana", "o": [["art", 1, "그래픽, 스토리, 연출, 어느 하나 빠짐 없이"], ["loop", 1, "재미있게 플레이 하는 게임"]], "pt": 12454, "t": "그래픽, 스토리, 연출, 어느 하나 빠짐 없이 재미있게 플레이 하는 게임\r\n이제는 중국 게임이라고 무시 못한다는 말을 만들어준 게임이라고 평가한다", "ts": 1768917685, "up": true}, {"ea": false, "g": 2358720, "h": 15, "id": "232473031", "l": "koreana", "o": [["art", 1, "그래픽.스토리.난이도 모든면에서 만족"], ["difficulty", 0, "처음에 너무 어려워서 안하고 있었는데"], ["loop", 1, "마지막 보스잡고 오랜만에 전율이 오더라구요"]], "pt": 3186, "t": "100% 만족했습니다. 중국 게임에 대한 선입견이 있었는데. 그래픽.스토리.난이도 모든면에서 만족했고. 처음에 너무 어려워서 안하고 있었는데. 천천히 다시해보니까. 보스 약점이 있어서. 공략 보면서 하면되고. 마지막 보스잡고 오랜만에 전율이 오더라구요. 우리나라 게임은 빠칭고만들동안 중국에서는 이런 대작을 만들었다는게. 너무 한탄스럽네요.", "ts": 1786324336, "up": true}, {"ea": false, "g": 2358720, "h": 6, "id": "230217698", "l": "koreana", "o": [["loop", 1, "지루함 없이 제일 재미있게 하고 있음"], ["volume", 1, "거의 놓치는 컨텐츠 없이 싹싹 빨고 있음"], ["repetition", 1, "지루함 없이"]], "pt": 4233, "t": "처음에 인정하기 싫었지만....최근... 비슷한 장르 아니.... 그냥 올해 즐긴 게임들 중에 지루함 없이 제일 재미있게 하고 있음..\n보통....30시간쯤 하면... 빨리 엔딩 보려고 쭈욱 샛길로 안빠지고 정주행만 하는 스타일인데...\n거의 놓치는 컨텐츠 없이 싹싹 빨고 있음.... 진짜... 차기작이 너무 기대됨...", "ts": 1783781263, "up": true}, {"c": "다크소울", "ea": false, "g": 2358720, "h": 52, "id": "233012167", "l": "koreana", "o": [["feel", -1, "성향이 안맞는 사람은 전혀 손맛이 없어요"], ["art", 1, "그래픽은 정말 좋아요"]], "pt": 1406, "t": "다크소울, 세키로, P의거짓, 몬스터헌터 등등 안맞는 사람은 하지 마세요. 제가 그렇고, 혹시나 기대하고 이 악물고 23시간 정도했는데 성향이 아예 안맞는겁니다. 재밌는 사람만 하면 됩니다. 소울라이크랑 결이 다르다고 하는데 우리 같이 안맞는 사람들한테는 저위에 게임들 다 비슷한 움직임, 패링(오공은간파), 구르기(잠시 무적판정)등등 앞으로, 옆으로, 어색한 동작, 손맛이 좋다고 하는데 성향이 안맞는 사람은 전혀 손맛이 없어요. 그냥 엥? 엥? 이게? 이렇습니다. 절대 비하할 의도 없고 저처럼 안맞는 사람은 굳이 안해도 됩니다. 그래픽은 정말 좋아요.", "ts": 1786924983, "up": false}, {"c": "아스트로봇", "ea": false, "g": 2358720, "h": 9, "id": "232582078", "l": "koreana", "o": [["art", 1, "일단 그래픽이 정말 뛰어나다"], ["characters", 1, "보스를 비롯한 여러 캐릭터들의 디자인또한 일품이다"], ["story", 1, "영신도에 적힌 요괴들의 일화"], ["difficulty", 1, "게임의 난이도 자체가 높지는 않은데"]], "pt": 2411, "t": "일단 그래픽이 정말 뛰어나다. 부들방석에 앉아 주변을 보고 있으니, 내가 정말 서유기 속의 장관들을 보고 있는 듯한 기분이 든다. 이러한 그래픽을 바탕으로 보스를 비롯한 여러 캐릭터들의 디자인또한 일품이다. \n 스토리적인 측면에서 보자면, 비록 나는 서유기를 전혀 알지 못하지만 길바닥에 널린 잡몹들부터 메인 보스들까지 짧지 않은 설명과 일화가 적힌 영신도가 있기에 스토리를 이해하는데에 큰 어려움이 있지는 않았다. 오히려 영신도에 적힌 요괴들의 일화를 보면서 인물들간의 관계를 파악하고 선악 구도를 찾아내는 것이 상당히 재미있었다.\n\n게임의 난이도 자체가 높지는 않은데, 여기에 각각의 메인 보스들을 훨씬 쉽게 깰 수 있게 해주는 법보라는 아이템또한 존재하기에 소울 입문자가 하면 참 좋을 것같다. \n\n개인적인 생각이지만 아스트로봇이 없었다면 24년 고티는 오공의 자리가 아니었을까?", "ts": 1786457124, "up": true}, {"ea": false, "g": 2358720, "h": 6, "id": "217752625", "l": "koreana", "o": [["loop", 1, "너무나 오랫만의 도파민이 터지면서"], ["difficulty", -1, "보스들을 깨는게 힘들지만"]], "pt": 810, "t": "겜도 잘못하는 아재이고 똥손인데,\r\n보스들을 깨는게 힘들지만...\r\n너무나 오랫만의 도파민이 터지면서 재미나게 하고 있습니다ㅎㅎ", "ts": 1770442800, "up": true}, {"ea": false, "g": 2358720, "h": 8, "id": "230816606", "l": "koreana", "o": [["endgame", 1, "다시윤회 횟수올라갈수록 보스도 점점더쌔지고"], ["variety", 1, "장비도 엄청많아서"], ["ui", -1, "미니맵이없고 자막이 너무 작아요"], ["difficulty", -1, "보스도 진짜 빡세서 스트레스도"]], "pt": 11230, "t": "초회차부터 다시윤회하기6회해서 총7회 진엔딩을보고 리뷰쓰는데요.\r\n게임퀄리티부터 전투시스템이나 정말모두 엄청좋네요!\r\n장비도 엄청많아서 다시할때마다 장비세트 바꿔서 하는재미도 있고 스킬트리도 많아서 스킬트리세트도 따로해서 하면재미도 두배라. 다시윤회 횟수올라갈수록 보스도 점점더쌔지고 그만큼어렵고 재미도 더있습니다. 초회차에는 맵도없고 해서진짜 많이헤매고 보스도 진짜 빡세서 스트레스도 많이받으면서 게임했는데 하면할수록 패턴파악하고 간파를 잘하게되면 게임이 엄청재미있어요!\r\n다만 아쉬운점이 있다면 미니맵이없고 자막이 너무 작아요.어쩔수없이 미니맵이랑 자막은 모드로깔고쓰네요.\r\n이거빼고는 완벽합니다!", "ts": 1784446579, "up": true, "w": "미니맵 추가, 자막 크게"}, {"ea": false, "g": 2358720, "h": 4, "id": "234304173", "l": "koreana", "o": [["loop", 1, "전반적으로 재미있지만"], ["onboarding", -1, "딱히 퀘스트 네비나 가이드도 없는"], ["progression", -1, "루트 잘못 타면 못 깨는 퀘스트가 한 두 개가 아니다"]], "pt": 1993, "t": "전반적으로 재미있지만 ㅈ같은 점이 몇 개 있다. \r\n다회차를 하라는 의미로 만든 건지 모르겠지만 딱히 퀘스트 네비나 가이드도 없는 주제에 루트 잘못 타면 못 깨는 퀘스트가 한 두 개가 아니다. 그거 말고는 다 괜찮은 듯.", "ts": 1788356371, "up": true, "w": "퀘스트 네비 및 가이드"}, {"ea": false, "g": 2358720, "h": 3, "id": "208432218", "l": "koreana", "o": [["feel", 0, "처음에는 타격감이 없는거같아서"], ["art", 1, "그래픽이 너무좋아서 플레이하는 내내 눈이 즐거웠음"], ["balance", 1, "몹들 패턴도 불합리한게 별로 없었다"], ["story", -1, "서유기 스토리에대한 전반적인 지식이 많았다면"]], "pt": 2582, "t": "처음에는 타격감이 없는거같아서 뭐 이래싶었는데 반격같은스킬 배우고나서는 괜찮아졌고\n\n몹들 패턴도 불합리한게 별로 없었다.\n\n그래픽이 너무좋아서 플레이하는 내내 눈이 즐거웠음.\n\n서유기 스토리에대한 전반적인 지식이 많았다면 더 재미있게 즐겼을거 같음.", "ts": 1762296237, "up": true}, {"ea": false, "g": 2358720, "h": 4, "id": "227756604", "l": "koreana", "o": [["art", 1, "진짜 그래픽, 액션, 스토리, 연출 모든 부분을"], ["story", 1, "스토리"]], "pt": 5920, "t": "중국산이란 이유로 억까가 많지만 진짜 그래픽, 액션, 스토리, 연출 모든 부분을 만족시키는 갓겜임. 특히 이후에 나온 다른 국내외 소율류 게임들 보면 우콩이 진짜 말도 안되는 수작이였구나 다시한번 느끼게됨", "ts": 1781226804, "up": true}, {"ea": false, "g": 2358720, "h": 2, "id": "237963846", "l": "koreana", "o": [["difficulty", 1, "난이도도 너무 잘 만들었음"], ["art", 1, "그래픽은 얘가 이 분야에서 가장 압도적임"], ["repetition", 1, "소울류 특유의 피로감도 적음"], ["story", 1, "특히 스토리, 연출, 그래픽은"]], "pt": 3719, "t": "정말 잘 만들었음.\n난이도도 너무 잘 만들었음.\n특히 스토리, 연출, 그래픽은 얘가 이 분야에서 가장 압도적임.\n신기하게도, 게임의 분위기가 딱히 무겁지도 않아서 소울류 특유의 피로감도 적음.\n5/5", "ts": 1792269249, "up": true}, {"ea": false, "g": 2358720, "h": 2, "id": "220151864", "l": "koreana", "o": [["loop", 1, "드디어 존잼 게임을 만났다"]], "pt": 5085, "t": "기존 게임이 재미없어서 15년간 축구게임만 하다가\r\n드디어 존잼 게임을 만났다...\r\n\r\n그냥 강추!!! 말이 필요 없음", "ts": 1772946355, "up": true}, {"ea": false, "g": 2358720, "h": 2, "id": "215948131", "l": "koreana", "o": [["feel", 1, "보스패는맛이 일품"], ["variety", 1, "다양한 스킬을 써가면서"], ["art", 1, "그래픽도 매우 수려"], ["bugs", -1, "짜치는 투명벽"]], "pt": 3663, "t": "소울라이크처럼 접근하기보다 스킬액션게임으로 접근해야하는게임\r\n\r\n패링치는스킬이있긴한데 숙련도가필요함 \r\n\r\n분신술 시간정지술 변신술 다양한 스킬을 써가면서 보스패는맛이 일품\r\n\r\n갈수 있어보이는데 못가는 짜치는 투명벽 마감처리만빼면 맵디자인 레벨디자인도 준수하고\r\n\r\n그래픽도 매우 수려 컷신 완성도도 훌륭하고 챕터끝나고 나오는애니퀄도 훌륭\r\n\r\n오공은 예술이다", "ts": 1768385474, "up": true}, {"ea": false, "g": 2358720, "h": 3, "id": "220491123", "l": "koreana", "o": [["ui", -1, "지도가 있어도 갈래길만 보면 숨이막히는"]], "pt": 1531, "t": "지도가 있어도 갈래길만 보면 숨이막히는 병이 있어요\n길찾다가 원숭이 머리털 다빠지겠어요\n\n우 우 돌숭이 빠른 도파민 빠른 액션 원한다", "ts": 1773322031, "up": true, "w": "전투 템포 빠르게"}, {"ea": false, "g": 2358720, "h": 6, "id": "231872520", "l": "koreana", "o": [["feel", 1, "맛깔나는 봉술과 다양한 법술로 인해 기깔나는 전투"], ["art", 1, "그래픽은 진짜 너무나 황홀하고"], ["difficulty", -1, "어려운 보스는 진짜 욕 나올 정도로 빡셈"], ["ui", -1, "지도도 없으며"]], "pt": 1956, "t": "오랜만에 정말 재밌게 한 액션게임!! 그래픽은 진짜 너무나 황홀하고, 맛깔나는 봉술과 다양한 법술로 인해 기깔나는 전투를 맛볼 수 있었다. 매챕터가 끝날떄마다 나오는 애니메이션도 재밌는 부분이다. 단점은 길찾기.... 지도도 없으며, 자연 배경이다 보니 눈이 좀 아팠다. 그리고 어려운 보스는 진짜 욕 나올 정도로 빡셈!! 스토리는 처음에는 이해가 잘 안 가지만 유튜브로 찾아보니 정말 잘 만들었다는 생각이 들었다. 최적화도 처음 출시때보다 훨씬 좋아진 것 같았다. 여름휴가때 진득하게 앉아서 즐긴 게임인데 안 했으면 후회 할 뻔...", "ts": 1785650612, "up": true, "w": "지도 추가"}, {"c": "엘든링", "ea": false, "g": 2358720, "h": 3, "id": "223175935", "l": "koreana", "o": [["ui", -1, "갈 수 없는 곳의 경계가 모호함"], ["art", 1, "뽕차는 보스전 연출"], ["difficulty", 0, "다들 2트 클 안에 잡음"], ["story", 1, "스토리 및 게임 진행에 따른 이해 용이함"]], "pt": 2826, "t": "맵 복잡한 정도 : 오공(갈 수 없는 곳의 경계가 모호함, 그래서 피로가 심하고 헤맴) > 엘든링(그냥 방대함, 사실 이게 더 맵은 큼) > 다크소울 > 세키로 > p의 거짓 = 카잔\r\n\r\n연출 : 오공(요약을 잘 집는 애니 연출, 뽕차는 보스전 연출) > p의 거짓(dlc 한정) > 엘든링 > 세키로 > 카잔 > 다크소울\r\n\r\n보스전 난이도 : 엘든링 > 세키로 > p의 거짓 > 다크소울 > 카잔 > 오공 ( 보스전은 최후반 보스 몇 빼고는 다들 2트 클 안에 잡음.. 최종 보스들도 3트 클 안 넘김)\r\n\r\n스토리 및 게임 진행에 따른 이해 용이함 정도 : 세키로(사실 스토리가 별로 없어서.. 이해 못할 수가 없음) > 오공 > p의 거짓 > 카잔 > 엘든링(불친절) > 다크소울(불친절 끝판왕)", "ts": 1776084835, "up": true}, {"ea": false, "g": 2358720, "h": 5, "id": "231244748", "l": "koreana", "o": [["story", 1, "스토리, 음악, 연출, 대사 모두 대단히 훌륭합니다"], ["audio", 1, "음악, 연출, 대사 모두 대단히 훌륭합니다"], ["loop", 1, "끝까지 끌고 가는 힘이 있습니다"]], "pt": 1608, "t": "스토리, 음악, 연출, 대사 모두 대단히 훌륭합니다. 개인적으로 어려운 게임은 중도 하차하는 경우가 많은데 오공은 끝까지 끌고 가는 힘이 있습니다. 추천 합니다.", "ts": 1784943246, "up": true}, {"ea": false, "g": 2358720, "h": 3, "id": "226537216", "l": "koreana", "o": [["feel", -1, "타격감이 아주 조금 아쉽고"], ["repetition", -1, "중간 보스가 많아서 피로도가 조금 느껴졌습니다"], ["difficulty", -1, "난이도 자체가 너무 쉽다 라는 생각이 들어서"], ["loop", 1, "너무 재밌는 게임이에요"]], "pt": 2133, "t": "고티 선정되어도 이상하지 않을 게임입니다.\n\n모든 것이 거의 다 완벽했습니다.\n\n다만 저는 타격감이 아주 조금 아쉽고\n\n다른 게임에 비해 중간 보스가 많아서 피로도가 조금 느껴졌습니다. \n\n전투 좋아하시는 분들은 오히려 좋아하실 것 같습니다.\n\n그거 외에는 다 좋았습니다.\n\n난이도 자체가 너무 쉽다 라는 생각이 들어서 파밍 안하고 플레이 하다가\n\n마지막에서 벽 느끼고 진땀 뺐습니다. \n\n너무 힘들었어요.\n\n그렇다고 다시 파밍하러 다니기에는 오기가 생겨서 그냥 그대로 깼습니다.\n\n진엔딩이 따로 있다는데 저는 진엔딩은 못 보고 노멀 엔딩 봤어요.\n\n가격이 부담스러우시면 세일 할 때라도 사서 해보시길 바랍니다.\n\n너무 재밌는 게임이에요. 꼭 해보시길 바랍니다.", "ts": 1779873043, "up": true}, {"ea": false, "g": 2358720, "h": 1, "id": "221528099", "l": "koreana", "o": [["art", 1, "눈이 즐거움"], ["difficulty", 1, "보스전은 소울류처럼 어려워서 만족"]], "pt": 3092, "t": "플스로만 하다가 스팀으로 패키지류 게임 처음 사서 해본게임\r\n눈이 즐거움, 보스전은 소울류처럼 어려워서 만족\r\n연출도 기가막힘\r\n다만 투명벽이 많아서 그건 아쉬움", "ts": 1774304119, "up": true, "w": "투명벽 제거"}, {"ea": false, "g": 2358720, "h": 1, "id": "234832493", "l": "koreana", "o": [["feel", -1, "직관적이지 못한 답답함은 있었다"], ["progression", 1, "내가 원하는 부분을 선택해서 키워가는 재미가 있다"], ["variety", 1, "매우 다양한 보스와 적 캐릭터가 많다"], ["art", 1, "아주 아름다운 풍경과 불교의 사찰"]], "pt": 5634, "t": "검은 신화 오공 \n\n장점 :\n\n검은 신화 오공은 중국 4대 기서 중 서유기를 모티프로 한 손오공 게임이다. \n작성 기준 무려 3천만 장 이상 판매 게임.\n소울 라이크 게임이지만 그렇게 어렵지는 않다. 다만 리듬 게임 같은 엇박 타이밍과 공격 모션의 딜레이 때문에 선 입력에 따른 직관적이지 못한 답답함은 있었다. 다행히 사망 시 패널티 가 없어 마음 편하게 도전하는 재미가 있다.\n\n3가지 봉술 자세를 가지고 바꾸는 재미와 내가 원하는 부분을 선택해서 키워가는 재미가 있다. 물론 초기화도 가능해서 스킬과 장비를 이것저것 조합하는 재미가 상당하다. 능력치를 최대까지 찍으려면 3회차 이상해야 하는데 다양한 조합으로 다회차 도전 재미를 느낄 수 있다. \n\n아주 아름다운 풍경과 불교의 사찰 등의 배경 그래픽, 장비 그래픽이 굉장히 섬세하고 돋보인다. 자세히 보게 되는 즐거움이 있다.\n\n그리고 또 다른 장점은 매우 다양한 보스와 적 캐릭터가 많다는 점이다. \n일반적인 게임의 경우 색깔 놀이나 돌려 막기 적이 많은데, 이 게임은 특색 있는 많은 적을 만날 수 있고 서유기처럼 여행하던 중 새로운 적을 만나는 느낌이 들어서 더 좋았다. 매번 새로운 적 패턴과 페이즈, 각각 공략하는 재미가 있어 개인적으로 가장 만족한 부분이었다. \n강력하게 추천하는 게임.\n\n단점 :\n\n서유기 스토리와 고유명사 때문에 배경지식이 없다면 스토리상 이해하기 어려운 부분이 있다. \n게임 하기 전에 서유기를 읽고 나면 더 좋을 것 같다. \n\n개인적으로 가장 큰 문제점은 투명 벽이라고 생각한다. 갈 수 있는 부분과 갈 수 없는 부분이 너무 애매하고 갈 수 없는 곳을 보이지 않는 벽으로 막아 놓은 맵 구성은 정말 아쉽다.\n배경의 모든 곳을 갈 수 있는 레데리2 오픈 월드가 새삼 얼마나 대단한지 알 정도이다.", "ts": 1788951573, "up": true}, {"ea": false, "g": 2358720, "h": 1, "id": "227405308", "l": "koreana", "o": [["difficulty", 1, "소울류 입문자 난이도"], ["art", 1, "웅장한 그래픽"], ["story", 1, "흥미로운 스토리"], ["repetition", -1, "보스만 잡는구간이 나와서 약간 루즈해짐"]], "pt": 2175, "t": "소울류 입문자 난이도\n웅장한 그래픽\n긴 플레이타임\n흥미로운 스토리\n패턴 파악하며 잡는맛\n\n서유기를 아예 몰라서 가끔 스토리 이해가 안가서 해석을 봐야함\n마지막 챕터쯤 가면 갑자기 연속으로 보스만 잡는구간이 나와서 약간 루즈해짐", "ts": 1780838369, "up": true}, {"ea": false, "g": 2358720, "h": 1, "id": "226533214", "l": "koreana", "o": [["loop", 1, "막 미칠 듯이 재미있다"], ["art", 1, "언리얼엔진5의 아트와 그래픽 감상하는 맛이 일품"], ["characters", -1, "캐릭터만 더 매력적 이었으면"], ["audio", -1, "원숭이 우끼끼 대는게 듣기 싫어서"]], "pt": 3427, "t": "막 미칠 듯이 재미있다! 이 정도까진 아니지만 만듦 새 자체는 고급 진 느낌. 뭐랄까 중국의 자본력이 느껴지는 게임이라고 해야 할까요.. 언리얼엔진5의 아트와 그래픽 감상하는 맛이 일품입니다. 솔직히 캐릭터만 더 매력적 이었으면 다회차 충분히 씹어 먹었을 것 같은데 외형 모드는 막힌건지 적용도 안되고 원숭이 우끼끼 대는게 듣기 싫어서 2회차에서 전 중도 하차 합니다. 웬만한 소울류 최고회차까지 싹싹 발라먹는 사람인데 얘는 손이 안가네요...", "ts": 1779867086, "up": true, "w": "외형 모드 허용"}, {"ea": false, "g": 2358720, "h": 2, "id": "217094860", "l": "koreana", "o": [["feel", 1, "타격감, 그래픽 다 좋고 재밌음"], ["variety", 1, "보스 디자인, 스킬 구성"], ["art", 1, "그래픽 다 좋고 재밌음"]], "pt": 1142, "t": "보스 디자인, 스킬 구성, 타격감, 그래픽 다 좋고 재밌음. 근데 맵 디자인이 갈 수 있는 것 처럼 만들어 놓고 투명벽이라 좀 짜침", "ts": 1769696999, "up": true, "w": "투명벽 제거"}, {"ea": false, "g": 2358720, "h": 1, "id": "215096771", "l": "koreana", "o": [["story", 1, "관심이 생길 정도임"]], "pt": 3106, "t": "잘 만든 게임임. 서유기에 대한 관심 1도 없었는데 관심이 생길 정도임.", "ts": 1767508595, "up": true}, {"ea": false, "g": 2358720, "h": 1, "id": "214483994", "l": "koreana", "o": [["performance", 0, "이펙트 너무 많은 보스 나올 때 프레임 드랍"], ["art", 1, "특히 연출이랑 그래픽이 미쳤습니다"], ["loop", 1, "익숙해지니 계속 붙잡고 게임 하게 되더라고요"], ["difficulty", 0, "초반에 진행할 시에는 와 진짜 어렵다"]], "pt": 1406, "t": "5080 qhd로 울트라 옵션 돌리면, 이펙트 너무 많은 보스 나올 때 프레임 드랍 걸리기는 합니다.\r\n하지만 그래도 기본적으로는 울트라 환경으로 80~90 프레임은 나오기 때문에 플레이에 그렇게까지 지장은 없었습니다.\r\n이 게임을 초반에 진행할 시에는 와 진짜 어렵다 오직 회피플로만 게임 해야하네 하면서 쩔쩔 맸지만, \r\n익숙해지니 계속 붙잡고 게임 하게 되더라고요.\r\n특히 연출이랑 그래픽이 미쳤습니다. 볼 때마다 우와하고 연신 감탄했습니다.\r\n사서 플레이하면 절대 후회 안 할 게임입니다.", "ts": 1766957770, "up": true}, {"ea": false, "g": 2358720, "h": 1, "id": "208946268", "l": "koreana", "o": [["art", 1, "아름답고 정교하게 짜인 그래픽"], ["variety", 1, "정말 겹치지 않고 다양하게 준비된 보스들"], ["loop", -1, "게임성 부분에선 2프로 부족한 부분도 느껴졌으나"]], "pt": 3546, "t": "우선 처음 접했을 땐 아름답고 정교하게 짜인 그래픽에 눈이 즐거웠습니다.\r\n특히 인상적이었던 부분은 정말 겹치지 않고 다양하게 준비된 보스들이었습니다.\r\n큰 비용을 들여 개발에 공들인 노력을 게임 내에서 확인할 수 있었고,\r\n\r\n서유기의 오공만이 할 수 있는 특색있고 다양하게 준비된 전투 방식에 즐겁게 2회차까지 진행네요.\r\n다만 막혀있는 벽이나 게임성 부분에선 2프로 부족한 부분도 느껴졌으나, 차기작에선 더 좋은 모습을 기대해 봅니다. 정말 잘 만든 수작이니 한 번쯤은 해보시는 걸 추천합니다.", "ts": 1762857050, "up": true}, {"ea": false, "g": 2358720, "h": 2, "id": "234625552", "l": "koreana", "o": [["loop", 1, "맵탐험하는 재미가 엄청나다"], ["progression", 1, "스킬트리구성도 좋음"], ["ui", 1, "각종 편의가 넘치는 스킬트리구성도 좋음"]], "pt": 2230, "t": "뒤늦게 플레이해 봄\n\n초울트라 슈퍼 갓갓갓 겜\n\n소울류를 떠나서 퀘스트 짜임새 라든지 맵탐험하는 재미가 엄청나다.\n\n각종 편의가 넘치는 스킬트리구성도 좋음\n\n중국게임 대단하네", "ts": 1788706086, "up": true}, {"ea": false, "g": 2358720, "h": 1, "id": "221452697", "l": "koreana", "o": [["feel", -1, "패드 진동이 왜 이럼?"]], "pt": 4443, "t": "다른 걸 떠나서 패드 진동이 왜 이럼?\n온 신경을 집중해야만 느껴질 정도로 너무 미약한데?\n이 정도면 그냥 진동이 없는 수준 아닌가?\n다른 게임 할 때는 진동이 빵빵하게 울리는고만.\n허참. 손 맛 떨어지네.\n\n혹시 이 게임에서 패드 진동을 경험하고 싶은 분들은\n듀얼센스로 스팀의 DSX 오디오 햅틱을 이용하세요.\n효과음마다 진동이 빵빵하게 울립니다.", "ts": 1774233519, "up": true, "w": "패드 진동 강화"}, {"c": "엘든링", "ea": false, "g": 2358720, "h": 6, "id": "232713020", "l": "koreana", "o": [["difficulty", -1, "진짜 의지가 꺾일뻔했습니다"], ["story", 1, "스토리도 좋고 그래픽도 좋아서"], ["art", 1, "그래픽도 좋아서 몰입하기 좋은데"], ["repetition", -1, "1시간 반동안 트리이반복해서 겨우깼네요"]], "pt": 178, "t": "스토리도 좋고 그래픽도 좋아서 몰입하기 좋은데 처음 보스 대머리대갈장군 이새끼 때문에 진짜 의지가 꺾일뻔했습니다..... 1시간 반동안 트리이반복해서 겨우깼네요.. 엘든링으로 치면 트리가드같아요", "ts": 1786608171, "up": true}, {"ea": false, "g": 2358720, "h": 1, "id": "219630840", "l": "koreana", "o": [["difficulty", 0, "소울류보다는 조금 쉽긴하지만 그래도 엄청나게 쉬운건 아님"], ["ui", -1, "메인, 서브퀘스트를 표기가 없어서"], ["story", 1, "스토리가 보장된 소재이기 때문에 재미있을수밖에없음"], ["price", 1, "할인 안해도 구매 추천"]], "pt": 4197, "t": "서유기를 기반으로한 게임\n게임 특징\n1. 소울류보다는 조금 쉽긴하지만 그래도 엄청나게 쉬운건 아님(난이도 조절은 없음)\n2. 잡몹의 비중이 적고 보스의 비중이 높아 보스 레이스처럼 하나씩 격파하면서 스토리를 보면됨\n3. 길찾기가 조금 어려운곳이 있음(점프가 가능한지 불가한지 구분이 잘안된다거나)\n4. 메인, 서브퀘스트를 표기가 없어서 내가 뭘하고있는지 확인 안되어 이건 불편(NPC랑 말해서 뭘 해달라고했는데 두리뭉실하게 말을해서 퀘스트인지도 헷갈리고 퀘스트 표기도없음)\n할인 안해도 구매 추천 합니디. 스토리가 보장된 소재이기 때문에 재미있을수밖에없음", "ts": 1772455952, "up": true, "w": "퀘스트 표기 추가"}, {"ea": false, "g": 2358720, "h": 3, "id": "212615494", "l": "koreana", "o": [["feel", 1, "타격감은 dd"], ["difficulty", -1, "소황룡패링에 정신을 잃었습니다"]], "pt": 1948, "t": "벽곤 간파충인데 소황룡패링에 정신을 잃었습니다\n근데 타격감은 dd", "ts": 1764943278, "up": true}, {"ea": false, "g": 2358720, "h": 3, "id": "211414113", "l": "koreana", "o": [["performance", -1, "화면이 끊기고 싱크 문제가 발생하는"], ["art", 1, "그래픽은 정말 놀랄 만큼 훌륭했습니다"]], "pt": 1019, "t": "CPU, GPU 사용량이 여유가 있어 RT까지 켜 놓으면 화면이 끊기고 싱크 문제가 발생하는 점은 감정 요소이지만 RT를 포기한다면 나름 쾌적한 플레이를 즐길 수 있습니다. 최적화를 제외한 완성도에서는 내가 생각했던 이상으로 잘 만들어진 게임인 거 같습니다. 그중에 그래픽은 정말 놀랄 만큼 훌륭했습니다. PC 사양이 높은 유저에게는 추천하는 게임입니다.", "ts": 1764340511, "up": true}, {"ea": false, "g": 2358720, "h": 3, "id": "209605223", "l": "koreana", "o": [["story", -1, "서유기 내용을 알고 해야지 스토리 이해가"]], "pt": 2446, "t": "그냥 해도 재밌지만 서유기 내용을 알고 해야지 스토리 이해가 좀 될 거 같네요.", "ts": 1763533250, "up": true}, {"ea": false, "g": 2358720, "h": 3, "id": "230006335", "l": "koreana", "o": [["story", 1, "매 장마다 끝날때 애니메이션 나오는 것도 너무 좋았고"], ["balance", 1, "전체적으로 밸런스가 딱 잡힌 게임같은 느낌"], ["difficulty", -1, "살짝 벽느껴지는 기분이었어요"], ["ui", -1, "자막 크기랑 가독성 실화냐?"]], "pt": 3668, "t": "재밌다!!!!!! 초회차 싹싹김치 진엔딩 마무리\r\n일단 소울류나 액션겜 좋아하는 사람으로서 보스전은 그다지\r\n어려운게 없었으나 이랑진군은 ㅋㅋ 초회차 이랑진군은 좀.. 아.. 하..\r\n잡는법이 있었는지는 모르겠지만 살짝 벽느껴지는 기분이었어요\r\n일단 재밌었음. 매 장마다 끝날때 애니메이션 나오는 것도 너무 좋았고\r\n그래서 스토리도 너무 좋다고 느꼈고 보스전 많은것도 좋았고\r\n탐험 요소도 초반엔 그냥 직진느낌인데 갈수록 탐험할거 많아지는 것도\r\n괜찮았고 전체적으로 밸런스가 딱 잡힌 게임같은 느낌이 들고\r\n4장 팔계행님 ㅠ 저 울어요 ㅋㅋㅋ 그 노래 가사가 나왔었으면 진짜 좋았을거 같은데\r\n없던게 아쉬웠고 무튼 고티를 제대로 받지 못했다는게 이상할정도였습니다\r\n\r\n갓겜이네요 갓겜 아, 게임 하실분들 미리 자막 모드 받아서 자막 200이상으로 하고 하시는거 추천\r\n자막 크기랑 가독성 실화냐?", "ts": 1783581077, "up": true, "w": "자막 크기 설정 확대"}, {"ea": false, "g": 2358720, "h": 1, "id": "237051377", "l": "koreana", "o": [["loop", 1, "최근 작 중에 젤 재밌음"], ["difficulty", 1, "충분히 할 수 있으니 불안감 ㄴㄴㄴ"], ["price", 0, "세일 안 하면 안 사도 댐"]], "pt": 28673, "t": "무슨 패밀리 수퍼컴보이 등 등등 ps1,2,쓰리없음 4.까지하다가 5없음 플레 20개 가까이 따고 이제 pc로 넘어와서\r\n\r\n첨으로 플레 딴 게임임 조낸 재밌음 이거 무조건 개추 몇십년 게임 라이프 중에 최근 작 중에 젤 재밌음\r\n\r\n세일 안 하면 안 사도 댐 대신 세일 20플 이상 들어가면 무조건 사라 재미 없으면 삼촌이 환불 해준다\r\n\r\n난이도 조절 x 멀티 x 이게 더 흥미 진지하다 쫌 짜치면 누가 도와주러 오나 이딴 생각 1도 하지마\r\n\r\n충분히 할 수 있으니 불안감 ㄴㄴㄴ 진엔딩 이랑 플레는 아무나 할 수 있어 믿고 구매 ㄱㄱ \r\n\r\n개재밌음", "ts": 1791295246, "up": true}, {"ea": false, "g": 2358720, "h": 3, "id": "224718941", "l": "koreana", "o": [["loop", 1, "재미있고, 또 재미있었다"], ["price", 1, "돈이 아깝지 않고, 후회하지 않았다"]], "pt": 5150, "t": "재미있고, 또 재미있었다. 돈이 아깝지 않고, 후회하지 않았다. 잘만든 게임!", "ts": 1777848705, "up": true}, {"c": "P의 거짓", "ea": false, "g": 2358720, "h": 1, "id": "223907729", "l": "koreana", "o": [["progression", 1, "스킬을 배울 수록 재미나짐"], ["art", 1, "그래픽도 좋은데"], ["feel", -1, "타격감과 조작감이 아쉬웠던 액션게임"], ["variety", 1, "다양한 보스가 있어서 지루하지 않고"]], "pt": 2742, "t": "스킬을 배울 수록 재미나짐..\n\n그래픽은 오공\n조작감은 P의 거짓\n타격감은 스텔라블레이드\n\n다양한 보스가 있어서 지루하지 않고 그래픽도 좋은데..\n타격감과 조작감이 아쉬웠던 액션게임.. \n\n그래도 충분하 할만한 게임", "ts": 1776949137, "up": true}, {"ea": false, "g": 2358720, "h": 2, "id": "228937006", "l": "koreana", "o": [["loop", 1, "생각보다 많이 재밌고"], ["difficulty", 0, "어려웠던 게임"]], "pt": 2391, "t": "생각보다 많이 재밌고 어려웠던 게임. (엔딩 본지 오래인데 지금 게시하는 건 안비밀)", "ts": 1782541911, "up": true}, {"c": "세키로", "ea": false, "g": 2358720, "h": 1, "id": "218772061", "l": "koreana", "o": [["difficulty", 1, "난이도는 훨씬 낮다"], ["balance", 1, "좋은 밸런스의 게임이라고 생각한다"], ["story", -1, "로어를 풀어가는 방식은 많이 아쉽다"], ["art", 1, "이미 유명한 그래픽적 유려함은"]], "pt": 2852, "t": "악명보다 훨씬 접근성 좋은 액션 갓겜 하지만 로어를 풀어가는 방식은 많이 아쉽다.\r\n전반적인 게임 경험은 소울류와 비슷하다기보다는 봉하나로 다 팬다는 느낌의 세키로와 가까운 전투를 추구하지만 난이도는 훨씬 낮다. \r\n간파, 체술 등 회피와 무적기들이 다양하고 변신술같은 얼방도 있으며 말 그대로 상대를 정지하는 개사기 스킬 등 여러가지 스킬이 있기 때문에 쓰라고 놔둔거 쓰면 '한대맞으면 죽어' 같이 시험대에 오르는 쫄깃한 상황은 각 장의 최종보스에서도 거의 나타나지 않는다. 그렇기 때문에 어느정도 재미를 위해 몇가지를 봉인하지 않으면 패턴도 볼 필요 없는 오공쇼 시뮬레이터를 구경하는 느낌이 날수도 있지만 몇몇의 보스들은 충분히 악명에 걸맞는 불쾌하지 않은 난이도를 보여주기 때문에 보편성을 충분히 챙긴 좋은 밸런스의 게임이라고 생각한다.거기에 이미 유명한 그래픽적 유려함은 월드 탐방 도중 도중 뛰는게 아까워서 걸어다니며 감탄할만큼 경험적인 관점에서도 너무나 훌륭한 게임이라고 칭찬하고 싶다.\r\n그러나 로어를 풀어나가는 방식은 게임의 장점만큼이나 거대하다. 비교를 안할수 없는 프롬겜 특유에 본인들이 정성껏 가꾼 월드에 그냥 이방인 1로 던져놓고 내가 찾아다니고 고민하지 않으면 정말 끝까지 침묵하는 우직함, 그런 감성을 표방하려는것처럼 느껴지나 프롬만큼의 세심한 단서들의 분배와 그 오묘한 낌새들이 없이 그냥 '~은 일단 모아두면 쓸모가 있을것'. '지금은 어디에 쓰이는지 알 수 없다' 같은 대놓고 정보를 제공하지 않겠다는 중요 아이템들과 쓰잘대기 없는 탈무드 이야기같은 소리가 80퍼 이상인 영신도 시스템은 몰입에 전혀 도움이 되지 않을뿐더러, 고민할 거리를 당초부터 주지 않았기에 오공뇌 같은걸 굴릴 유인도 없이 해석을 인터넷에 쳐보게 되는것 같았다.\r\n그밖의 묘하게 조선족스러운 번역들과 미니맵 없음, 어두울수록 아래(로 내려가는)길 같은 그지같은 맵구성 등 여러가지 거슬렸던 점은 많지만 액션겜이라는 장르의 독보적 수작이라는 평가를 위태롭게 할만큼은 절대 아니라고 본다. 추가로 해석을 찾아 보는데에 크게 거부감이 없다면 황미,영길보살같은 인물들에 대한 평가나 전통적이지 않은 선악 및 세력구도, 게임이 말하고자 하는 주제의 해석같은 것들이 짜잘하지만 다양하게 분포해 있다보니 이런것들 보면서 내 게임 경험에 맞춰 나만의 해석을 선택해 보는것도 의외로 신선한 재미였던것 같다.", "ts": 1771592945, "up": true, "w": "로어 설명 강화"}, {"ea": false, "g": 2358720, "h": 1, "id": "217690972", "l": "koreana", "o": [["feel", -1, "회피가 바로바로 안되서 좀 답답한데"], ["loop", 1, "재밋게 즐긴 게임"]], "pt": 2838, "t": "첨에 하면 회피가 바로바로 안되서 좀 답답한데\r\n하다 보면 익숙해져서 할만한 게임\r\n소울라이크인듯 아닌듯 하지만 재밋게 즐긴 게임", "ts": 1770378016, "up": true}, {"ea": false, "g": 2358720, "h": 1, "id": "212472259", "l": "koreana", "o": [["loop", 1, "재미도 있고 명상하는동안 힐링도 되고"]], "pt": 4430, "t": "충분히 잘만든 게임. 재미도 있고 명상하는동안 힐링도 되고 추천!", "ts": 1764765116, "up": true}, {"ea": false, "g": 2358720, "h": 2, "id": "211809963", "l": "koreana", "o": [["feel", 1, "타격감 좋고 스킬도 여러가지라 재밌습니다"], ["story", 1, "스토리도 이 정도면 나쁘지 않습니다"], ["repetition", -1, "반복적인 보스 전투"], ["progression", -1, "느린 레벨링"]], "pt": 5318, "t": "타격감 좋고 스킬도 여러가지라 재밌습니다 패링으로 승부를 보는 게 제 취향이네요 \n손오공 스토리 원래 좋아했는데 게임으로도 출시하니 바로 구매하고 플레이해봤습니다\n스토리도 이 정도면 나쁘지 않습니다 하지만 게임 플레이 시 반복적인 보스 전투,느린 레벨링,길 찾기 어려움등\n도전과제 노가다도 있고 여러가지 미흡한 점이 뉴비분들에겐 많이 어려울 거 같습니다 \n결국 저는 도전과제까지 다 깼지만 정말 재밌기도 했고 그만큼 제일 어려운 게임이었어요 \n처음부터 다시 하라면 못 할거 같습니다 ㅋㅋ 그래도 꼭 추천해요!", "ts": 1764479686, "up": true, "w": "레벨링 속도 개선"}, {"ea": false, "g": 2358720, "h": 2, "id": "209112887", "l": "koreana", "o": [["bugs", -1, "종울리면 계속 튕김"]], "pt": 1217, "t": "2번 새게임 시도\n적용 모드 맵만 사용 \n2번째 뱀요괴 깨고 종울리면 계속 튕김;;\n3번째 흑곰 깨고 다음 챕터 넘어가면 거기서 부터 계속 또 튕김 아예 겜진행이 안됨 \n어려운겜 2번이나 연속으로 처음부터 시작하는거 은근히 화남... 방법 없나요? 어후 화나\n\n맵모드가 문제였네;;;삭제하니깐 잘되눙...", "ts": 1763036410, "up": true}, {"ea": false, "g": 2358720, "h": 1, "id": "218919891", "l": "koreana", "o": [["difficulty", 1, "소울류 보다는 확실히 낮다"], ["progression", 1, "레벨노가다가 가능해서 충분히 돌파 가능한"], ["story", 1, "서유기를 읽으신 분들이면 자체 가산점"]], "pt": 3237, "t": "설 세일기간에 구입해서 플레이 했는데 이정도 퀄리티 일줄은 몰랐다\r\n자잘한 단점은 있으나 너무 큰 장점이 다 씹어 먹어 버림\r\n서유기를 읽으신 분들이면 자체 가산점 +5-10정 더 받을 수 있음\r\n\r\n다음 차기작은 종규?? 라는데 세일기간까지 안기다리고 바로 구매할거 같다\r\n타협하지 않고 게임을 만든 부분이 너무 맘에 들고\r\n중국게임이라고 억까당할 부분이 하나도 없음\r\n\r\n게임 난이도는 소울류 보다는 확실히 낮다\r\n시체 찾으로 가야하는 스트레스도 없고\r\n레벨노가다가 가능해서 충분히 돌파 가능한 구조로 짜여 있음", "ts": 1771729884, "up": true}, {"ea": false, "g": 2358720, "h": 3, "id": "218764579", "l": "koreana", "o": [["price", 0, "비싸긴하지만 한번쯤 해봐도 좋을거 같음"], ["loop", 1, "재미있었음"]], "pt": 355, "t": "생각보다 퀄리티가 너무 좋아서 당황함 별 피 두번 나가고 회피 씹히고 회피 두번 나가고 회피 씹히고 회피 두번 나가고 회피 씹히고 회피 두번 나가고 회피 씹히고 회피 두번 나가고 회피 씹히고 회피 두번 나가고 \n\n도저히 추천은 못하겠다.", "ts": 1785936468, "up": false, "w": "회피 입력 씹힘 해결"}, {"c": "다크앤다커", "ea": false, "g": 3282300, "h": 14, "id": "231898804", "l": "koreana", "o": [["loop", 1, "소울류와 서바이벌 장르까지 도합"], ["network", -1, "서버 관리로 인해, 교전에 대한 어려움"]], "pt": 1029, "t": "다크앤다커 이후로 기대되는 게임 중 하나. 소울류와 서바이벌 장르까지 도합하여, 최종적인 중세시대 탈콥류라고 생각.\n하지만, 베타 테스트와 맞먹는 서버 관리로 인해, 교전에 대한 어려움이 있음. 특히 3대3, 3대3대3 교전 시에 거의 예지급 타게팅으로 게임을 해야되는 수준임.\n\n아시아 서버외에 일본/한국 서버로 묶어 주었으면 좋겠다고 생각. 진짜 서버 관리 엠창났음", "ts": 1785680946, "up": true, "w": "일본/한국 서버 묶기"}, {"ea": false, "g": 3282300, "h": 13, "id": "233031169", "l": "koreana", "o": [["network", -1, "높은 지연 시간(불안정한 핑)"], ["bugs", -1, "고장난 피격 판정"], ["balance", -1, "불합리한 직업간 밸런스"]], "pt": 3883, "t": "< PVP게임이지만 PVP에서 필수적으로 갖추어야 할 조건이 충족되지 않은 게임 >\n이유를 나열하자면 아래와 같습니다.\n1. 높은 지연 시간(불안정한 핑)\n - 유저간 대결게임에서 상대의 스킬을 보고 즉각적으로 회피하거나 반격하는 플레이가 중요한 요소인데 회피 후 공격모션이 상대를 충분히 타격(검이 상대를 몸뚱이를 뚫고 지나가면서 타격음까지 들음)하였음에도 피격판정이 이루어지지 않음.\n\n - 특히나 글로벌 유저간 매칭으로 인해 핑이 튀는 무지성 돌진 유저를 만났을땐 어렵게 모은 전리품을 그냥 상납하게 됨\n\n2. 고장난 피격 판정\n - 핑과는 무관하게 정상적인 유저간 대결에서도 특정 상황(ex. 해머 워리어의 차징 공격이 끝난 시점(슈퍼아머 종료 후 타격 시 맞지 않는 현상 등)에서 공격이 먹히지 않음.\n\n3. 불합리한 직업간 밸런스\n - 어떤 직업은 슈퍼아머 기술을 난사(낮은 스태미나 소모량 및 캔슬 후 쿨타임이 돌지 않음) 할 수 있는 반면 어떤 직업은 모든 스킬이 조건부(짧은 시간 또는 마지막 공격 시에만) 슈퍼아머에 캔슬 불가로 한번의 판단미스로 스킬을 날려버림.\n\n - 어쌔신의 경우 탁월한 기동성과 빠른 공격속도를 살려 기민한 플레이(파일럿 실력에 따라 고점이 높은)를 의도한 직업이면서 짧은 쿨타임의 슈퍼아머 기술로 전사계열 직업과 맞다이(대쉬+기절 스킬 및 장판기에 기절이 달려있는 등..동실력 직업을 압살)가 가능하며 은신스킬의 패널티 부재(소리로 인지는 가능하나 상대에게 전술아이템 한칸을 강제하는 효과 등)로 거의 대부분의 상황에서 선공권을 가지고 있으며 맞다이 실패 시 우월한 도주기로 도망가는 등 이기는 싸움만 선택 가능.\n\n - 소서러의 경우 공격 한번에 반피를 까버리는 위력적인 스킬을 가졌으면서 어썌신 처럼 은신으로 선공권까지 가지고 있습니다. 마찬가지로 장판 cc로 견제 또한 우수한데다 장비옵션을 보시면 아시겠지만 소서러랑 전사계열 스탯이 동일합니다.(소서러맷집 = 전사맷집). 원거리 선공권을 가졋는데 전사계열과 스탯이 동일한 것은 조정이 필요해 보입니다. 실제로 큐좀 돌려보시면 아시겠지만 소서러 어쌔신이 가장 많이 보입니다.\n\n구구절절 써놨지만 분명 PVP 익스트랙션 장르 특유의 재미는 잘 살린게임이며 위의 단점들을 보완한다면 충분히 좋은 게임이 될것으로 생각됩니다.", "ts": 1786952327, "up": false, "w": "직업간
