몇백개 게임 중 1순위로 안좋음"], ["bugs", -1, "심각한 버그들이 있는데 절대 안고침"]], "pt": 25949, "t": "진지하게 했는데 내년 초 중반에 끝날 게임입니다. \n컨텐츠와 깊이가 같은 장르 다른 게임들에 비해 매우 떨어집니다.\n장점 1\n밸런스는 최근 패치 후 의외로 무난한 편임\n왜냐 빌드나 게임의 깊이가\n오늘 좌욕한 내 화장실 대야급임\n장점 끝\n\n문제점 1\n서버 상태가 진짜 해본 몇백개 게임 중 \n1순위로 안좋음\n익스트렉션이라 장비 다 잃는 게임인데\n적이 순간이동하거나 한번 맞으면\n계속 맞다가 죽는일 다반사.\n\n순간 회피기가 이 게임만의 특징이라고 볼수있는데 적과 내가 순간이동하는건 \n일상임 계속 맞고 있어서 연타하면\n혼자 회피 여러번 쓰고 뇌절함\n특정 스킬들은 캐스팅하다가 혼자 멈춘다던지 심각한 버그들이 있는데 절대 안고침\n한마디로 하스스톤 급 운빨이 녹아들어있는 게임임. \n상대편도 나한테 그렇게 죽은적 있을테니 하스스톤 매니아들은 당장 시작하세요.\n\n2\n이제 사람이 별로 없어서\n사람 없는 시간대는 매칭이 \n10분에서 20분\n핑으로 몇 팀 있는지 가까이 있는지도\n눈치껏 판별 가능\n\n3 \n로그는 도주와 진입이 자유고 좀만 할 줄 알면 못 쫒아 감 그로 인해 보상이 더 좋은 트리오에 와서 솔로 로그를 하는 사람이 엄청 많음. 가장 높은 난이도 돌리면 평균 절반이 솔로에 도망다님. 맵에 있는 상자만 재빠르게 까고 하루 종일 도망감. 많을 때는 우리 팀 빼고 전부 솔로 도적임 겜 하고 싶겠음? \n\n4\n즉시 회복과 회피기 때문에\n다른 익스트렉션 장르 게임와 달리\n불리한 상황을 역전 시키거나\n잘하는 유저가 다수를 잡기 매우 어려움\n팀 전체가 구멍이 없어야 하고\n어나더의 승률이 너무 높음\n(즉시 회복기가 3번이 끝임 의도는 이해함 잘하는 팀이 전부를 죽이지 못하게 하는 거\n하지만 그래서 어나더가 너무 깡패임 오히려 공정성이 떨어짐 이것도 깊이 문제)\n\n5\n캠프 업글 몇 번 씩하면 끝인데\n그 이후로 할게 전혀없음\n타 겜들은 장비 옵션이 랜덤이거나 템 커스텀, 모딩등으로 더더욱 게임 이해도가 곧 실력으로 연결되는데 이 겜은 프리셋으로 그냥 계속 삼 직업별로 빌드가 2-3개밖에 없음 한마디로 게임의 깊이가 없음 껍데기는 익스트렉션이지만 사실상 총 안쏘고 교전는 좀 더 노잼에 렉걸리는 오버워치라고 봐도 무방함 \n\n6\n위의 문제 때문에 파밍이 역대급으로 재미없음 장비 옵션이 고정이고 다 똑같은 보석을 박기 때문에 그냥 유저 한 마리 잡는 게 훨씬 나음 유저 잡아 죽이는 게 유일한 목표였음 돈 넘치고 컨텐츠 없고 할 거 없으니 그냥 사람이나 죽이고 죽자 이 마인드로 하게 됨 목표가 없음. 다들 무의식적으로 비슷하게 생각하는지 거지팀 제외하고 암묵적으로 한 곳에 모여서 어나더 칠 생각부터 함.\n\n7\n게임 디자인이나 곳곳에서\n짱개 스멜이 물씬 남\n짱개 게임임\n\n중간 생략\n\n단점 1000번째\n\n출시하고 얼마 안 지났는데\n100만이 넘게 다운 받은 게임\n9월 기준으로\n1000명에서 2000명 동접임", "ts": 1788681489, "up": false, "w": "서버 안정화 및 버그 수정"}, {"c": "엘든링", "ea": false, "g": 3282300, "h": 5, "id": "231720963", "l": "koreana", "o": [["performance", 1, "최적화는 양호하나"], ["network", -1, "서버 핑이 좀 불안정함"], ["loop", 1, "템포는 빠른편"]], "pt": 652, "t": "엘든링 밤의통치자에 pvp 추가한 느낌 \n\n템포는 빠른편 \n\n최적화는 양호하나 서버 핑이 좀 불안정함\n\n오픈 초창기라, 당연히 불안할수있다고 생각함 게임플레이에 크게 지장없음\n\n전부 논타겟이라 , 위치선정 에임중요함 \n\n재밌음 앞으로도 퍼먹을예정", "ts": 1785477212, "up": true}, {"c": "다크앤다커", "ea": false, "g": 3282300, "h": 18, "id": "231646709", "l": "koreana", "o": [["loop", -1, "전투나 시스템이 독특하지도 재밌지도 않고"], ["repetition", -1, "이쯤되면 너무 지루한 느낌임"], ["price", -1, "23000내고 해야하나"], ["art", 1, "배경이나 비주얼은 엘든링"]], "pt": 89, "t": "자기가 다크앤다커류 겜을 너무 좋아하는데, 다크앤다커를 굳이 하기는 싫다 하는게 아니면 추천하기 어려움.\n배경이나 비주얼은 엘든링에 전투는 3인칭 다크앤다커(또는 던젼본)느낌인데 솔직히 전투나 시스템이 독특하지도 재밌지도 않고 늘 먹던 맛임. 이게 나쁘다기보다는 그냥 지금까지 닼앤닼을 표방한 여러 겜들이 죄다 나왔다가 망했다가를 반복하는동안 비슷한 경험을 쭉 해왔는데 이것도 별반 다르지 않으니까 이쯤되면 너무 지루한 느낌임. 뭔가 신선함이라던가 기존 유사작들에 비해 확 끌어당기는 뭐가 없음. 그리고 겜의 미래도 불투명해보임. 애초에 파이가 그렇게 크지 않은 익스트랙션 장르 중에서도 판타지 컨셉의 근접전투게임 <- 이거 자체가 이미 마이너한데, 내가 기존 장르의 매니아층이 아니라면 아직도 동접 10000따리로 어찌저찌 버티고있는 무료인 닼앤닼을 납두고 이걸 23000내고 해야하나? 솔직히 진짜 모르겠음....", "ts": 1785394996, "up": false}, {"ea": false, "g": 3282300, "h": 3, "id": "232346506", "l": "koreana", "o": [["balance", -1, "근딜 혐오 원거리의 불합리한 밸런스 붕괴"], ["network", -1, "서버 불안정으로 모두가 산데비스탄을"], ["dev", -1, "얘네는 아시아권 서버를 안정화할 생각이 없음"]], "pt": 6916, "t": "근딜 혐오 원거리의 불합리한 밸런스 붕괴.\n\n서버 불안정으로 모두가 산데비스탄을 쓰며 서로가 서로의 잔상을 때리는 미친 게임\n\n- 세번의 핑 패치 이후 -\n\n여전함. 얘네는 아시아권 서버를 안정화할 생각이 없음", "ts": 1786195453, "up": false, "w": "아시아 서버 안정화"}, {"ea": false, "g": 3282300, "h": 3, "id": "236014831", "l": "koreana", "o": [["network", -1, "절대 고치지 않는"], ["multiplayer", -1, "트리오 모드에 들어와서 혼자 개인 플레이하는"], ["balance", -1, "씹창난 직업간 벨런스"], ["dev", -1, "유저들의 요청이나 피드백은 아예 무시하는"]], "pt": 6181, "t": "절대 고치지 않는 병신같은 서버, 트리오 모드에 들어와서 혼자 개인 플레이하는 쌀숭이들, 씹창난 직업간 벨런스. 자세한 수정 내용을 절대 발설하지 않고 꼭꼭 숨기는 패치.\n\n유저들의 요청이나 피드백은 아예 무시하는 개 똥고집 개발팀.", "ts": 1790236840, "up": false, "w": "패치 내용 상세 공개"}, {"ea": false, "g": 3282300, "h": 6, "id": "232563804", "l": "koreana", "o": [["network", -1, "핑문제 주옥되는게임이라"], ["bugs", -1, "이동기를썻는데 제자리로 되돌아오기도함"], ["dev", -1, "고칠려면 시간 ㅈㄴ 걸린다는데"]], "pt": 4405, "t": "핑문제 주옥되는게임이라 지금 인게임들어가서 게임하면 내공격은 1초뒤 들어가는장면과 상대가 순간이동해서 날때리는장면을 목격하실수있어요 죽일수있는기회를 매판마다 놓치며 가끔 심하면 내캐릭터가 이동기를썻는데 제자리로 트레이서마냥 되돌아오기도함 ㅇㅇ ; 고칠려면 시간 ㅈㄴ 걸린다는데 그시간동안 관짝갈듯함", "ts": 1786434467, "up": false}, {"ea": false, "g": 3282300, "h": 6, "id": "232751297", "l": "koreana", "o": [["dev", -1, "패치당일날 해당문구를 삭제하는등"], ["network", -1, "매칭범위가 확장되면 핑이 300대까지"], ["balance", -1, "원거리딜러가 게임내에서 전멸중인게임"], ["multiplayer", -1, "매칭은 하루종일걸리고"]], "pt": 6528, "t": "정말심각한 인게임 핑문제 패치하겠다고 클로즈베타 테스트때부터 떠들어대고 출시 이후에도 고치겠다 원인을파악했다 이번업데이트에 해결했다는 말을 계속하지만 패치당일날 해당문구를 삭제하는등 현재 진행형으로 해결되지않아 원거리딜러가 게임내에서 전멸중인게임 일주일이 지난지금 유저는 다빠지고 매칭은 하루종일걸리고 매칭시간이 길어져 매칭범위가 확장되면 핑이 300대까지 나옴 이게임의 평가내용에서 대부분 핑문제와 렉으로인한 비추천이 대부분이라 혹여나 이게임을 사볼까 고민중이라면 교전중 진흙탕에서 싸우는 느낌을 감당할수있는사람만 구매하길바람 니가 회피를했어도 캐릭터는 원래자리로 되돌아가는 수준의 문제임", "ts": 1786648141, "up": false, "w": "핑 문제 실질적 해결"}, {"ea": false, "g": 3282300, "h": 9, "id": "232700450", "l": "koreana", "o": [["dev", -1, "유저들 기만하면서 시간끌기 선언함"], ["network", -1, "핑 하나 제대로 못잡고"]], "pt": 6308, "t": "이런 답 없는 게임 절대 하지마세요\r\n\r\n이 ㅅㄲ들 핑 하나 제대로 못잡고 자꾸 유저들 기만하면서 시간끌기 선언함\r\n핑 못고치면서 왜 자꾸 구라치냐?\r\n짱깨새끼들 아니라고 할까봐 입만 열면 구라만 치네 ㅋㅋㅋㅋ\r\n어차피 쳐망하는거 확정인데 그냥 일찍이 망해라 ㅋㅋㅋ", "ts": 1786588791, "up": false}, {"c": "다크소울", "ea": false, "g": 3282300, "h": 3, "id": "231672018", "l": "koreana", "o": [["loop", 1, "게임 재미가 쏠쏠함"], ["onboarding", -1, "템이 뭐가 필요한지 제대로 알기 어렵다"], ["multiplayer", -1, "지역락들 왜 해둔지 모르겠고"], ["balance", -1, "원거리 놈들은 전부 너프좀해라"]], "pt": 616, "t": "게임 재미가 쏠쏠함 다크소울 엘든링 이런거 못해도 할만하고 올만에 재밌는거 찾은듯\n단점은 굳이 지역락들 왜 해둔지 모르겠고 템이 뭐가 필요한지 제대로 알기 어렵다는거 정도\n그리고 원거리 놈들은 전부 너프좀해라 너무 사기인데", "ts": 1785423753, "up": true, "w": "원거리 밸런스 너프"}, {"ea": false, "g": 3282300, "h": 1, "id": "235249318", "l": "koreana", "o": [["feel", -1, "조작은 어렵고"], ["ui", -1, "편의성은 구데기"], ["difficulty", -1, "보스처치를 한시간도 안돼서 요구"]], "pt": 240, "t": "걍 쓰레기 게임. 조작은 어렵고 편의성은 구데기. 3인칭 액션에 매우 익숙한 유저가 아니라면 가차없이 쳐내고 다 나가라고 외치는 수준의 메인 퀘스트. 실패 시 장비가 다 손실되는 익스 장르에서 보스처치를 한시간도 안돼서 요구하는 게임은 처음.", "ts": 1789373550, "up": false}, {"ea": false, "g": 3282300, "h": 1, "id": "235433158", "l": "koreana", "o": [["monetization", -1, "7200짜리 코스튬 만든사람 짤라라"], ["art", -1, "전체적으로 디자인이 너무 구려"]], "pt": 29505, "t": "다른건 모르겠고, 7200짜리 코스튬 만든사람 짤라라. 디자인이 그게 머냐? 내가 자다가 생각한거보다 구림. 진심으로 센스를 이해할수가없음. 멋 드럽게없네. 아니 그게아니더라도 싼것도 일단 전체적으로 디자인이 너무 구려. 그냥 일반옷이 이쁠정도임. 캐시옷 디자인한애들 다 짤라!!!!!!!!!!!", "ts": 1789604656, "up": true, "w": "코스튬 디자인 개선"}, {"c": "다크앤다커", "ea": false, "g": 3282300, "h": 1, "id": "234389150", "l": "koreana", "o": [["loop", 1, "재미있는 게임이었음"], ["feel", 1, "시원하게 잡으면서도"], ["updates", 1, "1주, 길게는 2주 간격으로 꾸준히 패치"], ["network", -1, "서버인지 핑차인지 개지랄 날 때가"]], "pt": 6056, "t": "100시간 찍었으니 리뷰.\n\n재밌는 게임이었음, \n\n닼닼에서 아쉬웠던 속도감을 챙겼고 잡몹 하나에 혈압 오를 거 없이 시원하게 잡으면서도 또 교전 중엔 변수로서 역할도 톡톡히 함.\n\n밸런스 문제가 없진 않겠지만 짧게는 1주, 길게는 2주 간격으로 꾸준히 패치를 넣어주고 있다는 점은 나름 긍정적으로 생각함.\n\n글섭 기준 거래소는 파탬 이상부터 활발한 편.\n\n문제는 서버인지 핑차인지 개지랄 날 때가 있는데 특히 매칭을 길게 잡고 인 게임에 들어갈 시 이러한 현상이 심각해짐. 1분 10초를 넘기지 말 것.\n\n자잘한 패치는 계속해주고 있지만 서버 관련 패치는 점진적으로 진행한다고 발표했으나 2주 동안 나아진 기미는 별로 없는 거 같음\n\n그럼에도 불과하고 게임 자체는 재밌었음. 살지 고민된다면 한 번 찍먹하길 권장함\n\n서버 문제가 신경 쓰인다면 찜 목록에 넣어두고 시즌2 시작 때 찾아와 보셈. 시즌2까지 개선이 없으면 걍 안 하는 게 맞지 ㅅㅂ", "ts": 1788455956, "up": true, "w": "매칭 대기 시간 단축"}, {"c": "던전본", "ea": false, "g": 3282300, "h": 1, "id": "234227797", "l": "koreana", "o": [["network", -1, "핑ㅈㄴ 튀어서 캐릭터가 순간이동하고"], ["balance", -1, "밸런스를 다음 패치에서 잡아주길 기대하며"], ["multiplayer", -1, "친구들이 접어서 신목림 솔큐"]], "pt": 9404, "t": "이기적인 놈들. 게임이 망해도 좋다 이거냐?\n\n오랜만에 출시한 판타지 익스트랙션 게임하나 붙잡고 언제망할까 조마조마하며\n맛있는 3vs3 교전하려는데 핑ㅈㄴ 튀어서 캐릭터가 순간이동하고\n친구들이 접어서 신목림 솔큐 돌리고\n좆망한 밸런스를 다음 패치에서 잡아주길 기대하며\n결국 던전본처럼 섭종할 날까지 희망회로 돌리는것이 진정한 미폴헌의 행복이란 말이다.", "ts": 1788263557, "up": true}, {"ea": false, "g": 3282300, "h": 1, "id": "234043339", "l": "koreana", "o": [["ui", 1, "정출이후 테섭때보다 훨씬 UI,편의성 전부 좋아짐"], ["art", 1, "그래픽은 약탈게임중 좋은편에 속한다고보고"], ["feel", 1, "서로 주고받는느낌"], ["network", 0, "핑문제가 있다고 들었는데 아직은 크게 못느낌"]], "pt": 332, "t": "정출이후 테섭때보다 훨씬 UI,편의성 전부 좋아짐\n그래픽은 약탈게임중 좋은편에 속한다고보고 전투도 찎 죽는게아닌 서로 주고받는느낌\n핑문제가 있다고 들었는데 아직은 크게 못느낌 (개선이 좀 되었다고는 들음)\n아마 플레이하다보면 다른분들처럼 핑문제로 스트레스받을순 있지만, 게임자체는 꿀잼\n\n앞으로 유저수가 줄어들지 늘어날지는 모르지만 9천~1.3만명기준에선 거래가 활발해서 굿", "ts": 1788058897, "up": true}, {"ea": false, "g": 3282300, "h": 1, "id": "231757009", "l": "koreana", "o": [["network", -1, "핑 150~200 정도 잡히는 문제"], ["variety", 1, "다양한 빌드로 스킬 투자가 가능한 게 재밌고"], ["price", 1, "돈값은 하는 킬링타임용 게임"], ["loop", 1, "소울류 pvp처럼 심리전 하는 맛"]], "pt": 556, "t": "가끔 이상한 서버가 잡혀서 핑 150~200 정도 잡히는 문제가 있어요\r\n\r\n개선점은 많지만 그래도 돈값은 하는 킬링타임용 게임 같아요\r\n\r\n다양한 빌드로 스킬 투자가 가능한 게 재밌고, 소울류 pvp처럼 심리전 하는 맛이 조금은 있어요\r\n\r\n뉴비 분들이나 익숙치 않아 불합리하게 느끼시는 분들은 두 대 때리면 상대가 긴급회피를 할 수 있다는 걸 생각하시고 한 템포 쉬어서 구르기 캐치를 시도해보시는 걸 추천드려요 아직까진 잘 먹히더라고요", "ts": 1785518976, "up": true}, {"ea": false, "g": 3282300, "h": 2, "id": "232631408", "l": "koreana", "o": [["loop", 1, "게임 자체는 재밌음"], ["bugs", -1, "자잘한 버그, 렉"], ["network", -1, "핑 전체적 운영이 문제가 심함"], ["dev", -1, "전체적 운영이 문제가 심함"]], "pt": 3925, "t": "게임 자체는 재밌음.\n근데 자잘한 버그, 렉, 핑 전체적 운영이 문제가 심함.\n장르 특성상 한대 때리고 맞는걸로 죽는데 이것때문에 ㄹㅇ 개빡침.\n내 평생 샷건을 해본적이 없는데 이 게임 떄문에 매일이 샷건임.\n누가봐도 이건 서버 문제라고 볼꺼임. 밸런스? 서버문제가 시급함.\n사지마세요. 성격 더려워짐.", "ts": 1786508130, "up": false, "w": "서버 문제 해결"}, {"ea": false, "g": 3282300, "h": 2, "id": "231958843", "l": "koreana", "o": [["loop", 1, "게임은 ㅈㄴ 재미있는데"], ["network", -1, "핑 티는거땜에 진짜 컴터 부실뻔했네"]], "pt": 1659, "t": "게임은 ㅈㄴ 재미있는데 핑 티는거땜에 진짜 컴터 부실뻔했네 휴 ㅡㅡ", "ts": 1785750930, "up": false}, {"ea": false, "g": 3282300, "h": 4, "id": "233201987", "l": "koreana", "o": [["network", -1, "핑 ㅈㄴ 구림"], ["multiplayer", -1, "매판 쌀먹 도적 팀으로와서 딴짓함"], ["balance", -1, "파티 직업 중복 가능 시스템 덕분에"]], "pt": 6557, "t": "핑 ㅈㄴ 구림 + 매판 쌀먹 도적 팀으로와서 딴짓함. + 파티 직업 중복 가능 시스템 덕분에 2법사 3법사 나왔을 때 슬로우 장판에 블랙홀에 하루종일 시달리다 유성술 뿅뿅의 압도적인 화력에 죽어나가야 함", "ts": 1787152986, "up": false, "w": "파티 직업 중복 제한"}, {"ea": false, "g": 3282300, "h": 2, "id": "232587998", "l": "koreana", "o": [["loop", 1, "파밍하는 재미가 충분하네요"], ["difficulty", 1, "탈출은 쉬운편이라"], ["network", -1, "아직 멀티서버가 좋지 않아서 핑이 튀는"]], "pt": 1494, "t": "평소 익스트랙션 슈터 게임을 좋아하지 않아도 소울류 조작감에 익숙하고 3인 액션게임을 좋아하면 충분히 재미있게 즐길 게임입니다 타 익스트랙션 게임보다 탈출은 쉬운편이라 pvp를 포기해도 파밍하는 재미가 충분하네요 대신 아직 멀티서버가 좋지 않아서 핑이 튀는 현상떄문에 억까를 당해서 죽는 경우가 많아 나는 억까를 견딜 자신이 있다 하는 강한 멘탈인 유저가 아니면 어느정도 서버 안정화 소식이 들려올때 구매하는걸 추천드립니다 솔큐에선 핑차이가 크게 체감되는 느낌은 아니었습니다 (그러니 빠르게 브란드르 솔큐도 만들어주세요 서버 안정화 안시킬거면)", "ts": 1786462475, "up": true, 져서 게임플레이의 흥미가 생기지 않았음", "ts": 1786278604, "up": false}, {"ea": false, "g": 3282300, "h": 0, "id": "232179101", "l": "koreana", "o": [["network", -1, "핑 문제 심각"], ["multiplayer", -1, "적이 쌀먹할라고 문앞에서 대기하고있다가"], ["repetition", -1, "시즌 패스 노가다가 상상 이상임"], ["progression", -1, "쓸모없는 퀘스트 상당히 많음"]], "pt": 1888, "t": "핑 문제 심각\n보스잡고 일정시간 회복할시간도없이 적이 쌀먹할라고 문앞에서 대기하고있다가 들어와서 죽임 개 불쾌함\n스쿼드시 그냥 빨간몹 잡는데 난입해서 죽임\n시즌 패스 노가다가 상상 이상임, 주말퀘다해도 400밖에안됨, 일반퀘 30씩인데 쓸모없는 퀘스트 상당히 많음", "ts": 1786009349, "up": false, "w": "쓸모없는 퀘스트 정리"}, {"ea": false, "g": 3282300, "h": 0, "id": "232178929", "l": "koreana", "o": [["network", -1, "핑을 개선할 생각 자체를 안 하는"], ["dev", -1, "동아시아 지역은 버린 게 아닌가"]], "pt": 18350, "t": "핑을 개선할 생각 자체를 안 하는 것 같음. 패치할 때마다\r\n\r\n분명 코앞에 있는 적을 타격해도 유유히 걸어서 빠져나가는 신기한 현상\r\n\r\n내가 먼저 치고 상대가 으억 하는 모션까지 나왔는데 갑자기 나를 때리고 있는 현상\r\n\r\n공격 들어오는 걸 보고 회피를 눌러서 피했는데 갑자기 상대 앞으로 끌려가더니 맞고 있는 현상\r\n\r\n이 정도면 동아시아 지역은 버린 게 아닌가 싶음", "ts": 1786009140, "up": false, "w": "핑 개선 및 동아시아 서버 대응"}, {"ea": false, "g": 3282300, "h": 0, "id": "232177679", "l": "koreana", "o": [["balance", 0, "직업간 밸런스는 계속 맞춰나가야 하는 숙제"], ["updates", 1, "패치도 적극적으로 자주 하는 중"]], "pt": 974, "t": "직업간 밸런스는 계속 맞춰나가야 하는 숙제긴 하지만 당장은 하고자 하는 의지도 있고 패치도 적극적으로 자주 하는 중이라 불만없이 게임중", "ts": 1786007414, "up": true}, {"ea": false, "g": 3282300, "h": 0, "id": "232080603", "l": "koreana", "o": [["network", -1, "서버 핑이 매우 좋지 않음"], ["multiplayer", -1, "esp, 에임 핵 의심자 다수 확인"], ["balance", -1, "트리오에서는 밸런스가 다소 무너져있음"], ["dev", -1, "유저 의견 반영률이 너무 소소함"]], "pt": 6963, "t": "1. 서버 핑이 매우 좋지 않음\n→ 중국 업체들의 vpn 무분별 사용 및 esp, 에임 핵 의심자 다수 확인\n2. 직업 밸런스가 솔로 위주로 개선되기때문에 트리오에서는 밸런스가 다소 무너져있음 트리오는 위자드 존엄\n→ 밸런스 패치는 지속적으로 맞춰 나갈 것이나 유저 의견 반영률이 너무 소소함\n3. 게임이 흥하려면 솔로없애고 트리오만하던가 솔로만 하던가 둘 중 하나는 해야할 듯. 둘 다 잡기엔 밸런스를 절대 못 잡는 구조\n4. 일본인과 중국인은 교전 중에 팀원버리고 도망가거나 PVP겜에서 RPG를 하려는 경향이 매우 큼\n→ 개인적으로 이 부분이 매우 엿같았고 게임 정이 떨어짐\n\n특히 요새같은 트리오맵에서 혼자들어와가지고 쌀먹하고 분탕치고 도망가는 도적놈들 천지\n솔로와 트리오 티어 구분도 없고 그냥 판 수 갈아넣으면 티어 올라가는 구조\n솔직히 티어가 실력의 징표가 될 수 없음", "ts": 1785887631, "up": false, "w": "트리오 밸런스 및 솔로 트리오 분리"}, {"ea": false, "g": 3282300, "h": 0, "id": "231964745", "l": "koreana", "o": [["network", -1, "서버 렉, 핑 문제를 고칠 능력이 없으며"], ["dev", -1, "고칠 능력도 생각도 없어요"], ["volume", -1, "맵이 달랑 2개 뿐인"]], "pt": 2734, "t": "10월 1일 추가\n\n이 새1끼들 스캠이에요. 고칠 능력도 생각도 없어요. 하지마세요.\n\n--------------------------------------------------------------------------------------------------------\n개발진은 서버 렉, 핑 문제를 고칠 능력이 없으며, 베타 때부터 문제됐던 맵이 달랑 2개 뿐인, 심지어 솔로맵 1개, 스쿼드 맵 1개로 솔플러들은 맵 하나만 죽어라 해야하는 거지같은 상황을 정식 오픈 이후에도 지속하는 상황임. 한마디로 개발진이 판매 대박이 나자 돈 들고 튄 느낌.", "ts": 1785758049, "up": false, "w": "맵 추가 및 서버 핑 개선"}, {"c": "엘든링", "ea": false, "g": 3282300, "h": 0, "id": "231950591", "l": "koreana", "o": [["multiplayer", -1, "마주치면 대부분 싸움남"], ["balance", -1, "도적만 버그급 대시기 줘서"], ["progression", -1, "확률도 쓰래기 같은게"]], "pt": 10825, "t": "낙원 대기소로 쓸사람들을 위한 참고글\n낙원은 협통 파밍 건축등. \n실제 사람과 마주치면 마이크로 소통하며 피해가거나 협동함\n\n이겜도 마이크 기능이 있다곤 하지만 마이크 쓰는사람이 없음\npvp전용 게임이고 심지어 어려운 난이도는 2킬해야 특수 탈출이 가능하며\n랭킹을 올리는데 킬많이 하는게 유리함\n그래서 마주치면 대부분 싸움남\n싸움법은 대시하는 상대에게 연속으로 공격넣는게 끝\n\n근데 도적만 버그급 대시기 줘서 사실상 도적만 하라는 듯한 느낌\n확률도 쓰래기 같은게 100~1000 이면 150이상 나오는걸 못보고 150~3000 이면 사실상 500이상은 안나옴.\n\n추천유저 = 엘든링같이 하드한 게임 + 격투 게임 좋아하는사람\n손절하고 싶은사람, 스트레스 부족한 사람에게 추천하기 딱 좋음", "ts": 1785738093, "up": false, "w": "도적 대시 밸런스 조정 및 확률 개선"}, {"c": "엘든링", "ea": false, "g": 3282300, "h": 0, "id": "231874434", "l": "koreana", "o": [["network", -1, "서버렉 끊킴"], ["multiplayer", -1, "PVP가 강제되기 때문에"], ["progression", -1, "재화가 안쌓이고 정체되거나 점점 줄어들거나"], ["art", 1, "비주얼은 칭찬함"]], "pt": 11794, "t": "1. 서버렉 끊킴 (Goat)\n\n2. 난이도가 올라갈수록 무조건 강제되는 PVP\n PVP가 강제되기 때문에 한판에서 만나는 상대들을 모두 딲고 나올 정도의 고수가 아니면 \n 게임, 판수를 계속 돌리면 돌리수록 재화가 안쌓이고 정체되거나 점점 줄어들거나 하는 현상을 겪게 될꺼임 ㅋㅋ\n\n3. 맵이 넓은 것 같지만, 하다보면 크지 않음. \n 좀 해본 사람들은 알꺼임. 타팀이나 사람들 스타팅 포인트 가까운 거리에 있음.\n 즉, 싸우도록 무조건 설계된게 보임\n (트럭들은 시작하자마자 근처 스폰되는 곳들 무조건 들고 달림 ㅋㅋ)\n 근데 시작하자마자 사람 만나서 싸우고, 뒤지면 그대로 템 GG, 허망함. 특히 에픽들고 갔을때 ㅎㅎ\n 시작하자마자 한팀,이나 한넘 담굴 정도는 되야.. 아니면 계속 도망다니면서 눈치보면서 몹잡고 파밍하거나\n 그렇게 해도 결국 파밍한 템을 들고 나가고 싶으면.. 탈출 포인트에서 대부분 싸워야 함.\n \n4. 뭐 이 이외에도 할말이 많다만..\n 개인적으로 이런 판타지 세계관과 꽤 괜찮은 캐릭터 모션 타격감, 스킬 이펙트, 비주얼은 칭찬함\n 엘든링처럼 PVE, 유저들과 협동해서 탐험하는 맛을 좀 더 살렸으면 좋겠음.\n 그 속에서 PVP도 있고 했음 좋겠는데\n 이건 그냥 너무 PVP게임. PVP가 강요되는 게임임.\n \n 참고로 보스전도 잡고 나오면 죽이려고 대기하는 사람들.\n 요새에서 보스전을 잡고 나와서 종을 먹어야 탈출할 수 있기 때문에\n 끝까지 남아서 사람을 다 닦고 나오거나, 마지막원까지 좁아진 후 나오는 종3개 사람닦고 먹거나 먹을 자신 있는 사람들만 하는 컨텐츠.\n 즉 PVE를 좋아하는 사람들을 위한 컨텐츠가 아니라, PVP잘하는 사람들의 여흥 + 쏠쏠한 득템 장소 컨텐츠 입니다.", "ts": 1785653348, "up": false, "w": "PVE 협동 탐험 모드 추가"}, {"ea": false, "g": 3282300, "h": 0, "id": "231723358", "l": "koreana", "o": [["price", 1, "2만원겜 치고는"], ["art", 1, "언리얼엔진으로 만들어서 그래픽 좋고"], ["balance", -1, "직업밸런스가 쓰레기라서"], ["difficulty", 1, "몹상대로 플레이 난이도도 높지않아서"]], "pt": 136, "t": "2만원겜 치고는 언리얼엔진으로 만들어서 그래픽 좋고 몹상대로 플레이 난이도도 높지않아서 입문용으로 나쁘지 않음. 문제는 직업밸런스가 쓰레기라서 특정 직업만 엄청 보임.", "ts": 1785480757, "up": true, "w": "직업 밸런스 조정"}, {"ea": false, "g": 3282300, "h": 3, "id": "231822691", "l": "koreana", "o": [["loop", 1, "근접이라 다같이 못해서 재밌음"]], "pt": 414, "t": "이런 장르 총쏘는 부류는 고인물들이 많아서 맨날 죽기 다반사인데 이건 근접이라 다같이 못해서 재밌음 ㅋㅋ", "ts": 1785595534, "up": true}, {"ea": false, "g": 3282300, "h": 2, "id": "231640369", "l": "koreana", "o": [["loop", 1, "재미는 있음"]], "pt": 146, "t": "3인칭을 별로 안좋아하긴하는데 재미는 있음 낙원나올때까지 킬링타임용으로 좋음", "ts": 1785385622, "up": true}, {"ea": false, "g": 3282300, "h": 0, "id": "232883541", "l": "koreana", "o": [["loop", -1, "익스트랙션 할 이유가 이제 없음"], ["network", -1, "서버나 전투 밸런스가 먼저라서"], ["progression", -1, "업그레이드 다 하면 상점행"], ["balance", -1, "전투 밸런스가 먼저라서"]], "pt": 2101, "t": "서버랑 전투까지 그렇다 쳐도 익스트랙션 할 이유가 이제 없음 캠프 업그레이드 재료는 그냥 업그레이드 다 하면 상점행이고 소모품으로 계속 쓰는 아이템들만 가격 유지되는데 초기화를 할지 안할지 모르겠지만 서버나 전투 밸런스가 먼저라서 뭐 화이팅", "ts": 1786797316, "up": false, "w": "캠프 업그레이드 재료 활용 개선"}, {"ea": false, "g": 3282300, "h": 1, "id": "236621457", "l": "koreana", "o": [["network", -1, "역대급 PING"], ["dev", -1, "운영진은 이걸 고칠 생각이 전혀 없고"]], "pt": 11440, "t": "역대급 PING.\r\n운영진은 이걸 고칠 생각이 전혀 없고, 그럴 능력도 없음. 오픈 초 4만이 넘었는데, 순수 개발진 핑 문제로 다 떠남. 이런 장르의 게임에서 렉 핑이 걸리면 그냥 답이 없음. 렉 걸려서 죽으면 불쾌하기만 함. 답이 없다 이건.", "ts": 1790863651, "up": fa       R.push({type:"avoid",k:a.k,sc,title:`${nm(a.k)} 문제를 안고 출시하지 않는다`,
        body:`${nm(a.k)} 순감성은 ${f2(a.net)}이고, 비추천 리뷰의 ${pct(a.negNR,1)}가 이 요소를 부정적으로 언급했습니다.${a.early!=null&&a.late!=null&&a.late-a.early<=-0.2?` 최근 평가가 더 나빠졌습니다(${f2(a.early)} → ${f2(a.late)}).`:""} 출시 전 반드시 해결 수준을 확인해야 하는 위험 요소입니다.`,
        metric:`순감성 ${f2(a.net)} (+${a.p} −${a.n}) · 비추천 리뷰 중 부정 언급 ${pct(a.negNR,1)}`});
    }
    const bk=a.bk.map((v,i)=>[v,i]).filter(x=>x[0]!=null);
    const flip=bk.length>=2?Math.max(...bk.map(x=>x[0]))-Math.min(...bk.map(x=>x[0])):0;
    const shift=(a.early!=null&&a.late!=null)?a.late-a.early:0;
    const split=a.rv>=10&&Math.abs(a.net)<0.25;
    if(split||Math.abs(shift)>=0.3||flip>=0.5){
      let why,sc;
      if(flip>=0.5){const hi=bk.reduce((x,y)=>y[0]>x[0]?y:x),lo=bk.reduce((x,y)=>y[0]<x[0]?y:x);why=`플레이 시간에 따라 평가가 뒤집힙니다(${BUCKETS[hi[1]]} ${f2(hi[0])}, ${BUCKETS[lo[1]]} ${f2(lo[0])}).`;sc=flip*a.share}
      else if(Math.abs(shift)>=0.3){why=`최근 평가가 ${shift>0?"좋아졌습니다":"나빠졌습니다"}(${f2(a.early)} → ${f2(a.late)}).`;sc=Math.abs(shift)*a.share}
      else{why=`칭찬(${a.p}건)과 불만(${a.n}건)이 팽팽하게 갈립니다.`;sc=a.share*0.8}
      R.push({type:"verify",k:a.k,sc,title:`${josa(nm(a.k),"을","를")} 출시 전에 검증한다`,
        body:`${why} 같은 설계라도 대상 플레이어나 플레이 시점에 따라 결과가 달라질 수 있으므로, 출시 전 ${josa(CHECKS[a.k],"을","를")} 측정해 확인해야 합니다.`,
        metric:`순감성 ${f2(a.net)} · 플레이시간별 ${a.bk.map(f2).join(" / ")}`});
    }
  }
  const cards=[];let ci=0;
  const byK=new Map();for(const c of R.slice().sort((x,y)=>y.sc-x.sc))if(!byK.has(c.k))byK.set(c.k,c);  // 한 요소는 한 유형에만
  const RR=[...byK.values()];
  for(const t of ["reinforce","avoid","verify"]){
    RR.filter(c=>c.type===t).sort((x,y)=>y.sc-x.sc).slice(0,5).forEach(c=>{
      const ev=pickEv(st,c.k,t==="reinforce"?1:t==="avoid"?-1:null);if(!ev.length)return;
      cards.push({id:"c"+(ci++),type:t,title:c.title,body:c.body,aspects:[c.k],metric:c.metric,evidence:ev});
    });
  }
  /* 숨은 요구: 요청 문장을 요소별로 묶음 */
  const g=new Map();
  for(const r of st.R){if(!r.w)continue;const as=findAspects(r.w).sort((x,y)=>(GENERIC.has(x)?1:0)-(GENERIC.has(y)?1:0));const k=as[0]||(r.o[0]&&r.o[0][0])||"etc";const e=g.get(k)||{k,n:0,ids:[],ex:[]};e.n++;if(e.ids.length<4)e.ids.push(r.id);if(e.ex.length<3&&!e.ex.includes(r.w))e.ex.push(r.w);g.set(k,e)}
  const needs=[...g.values()].filter(e=>e.n>=2||g.size<=3).sort((a,b)=>b.n-a.n).slice(0,8).map(e=>({title:e.k==="etc"?"기타 개선 요청":`${nm(e.k)} 개선 요청`,desc:e.ex.map(x=>`“${x}”`).join(" · "),aspects:e.k==="etc"?[]:[e.k],count:e.n,evidence:e.ids}));
  const top=L.slice().sort((a,b)=>b.rv-a.rv).slice(0,3).map(a=>`${nm(a.k)}(${pct(a.share,0)})`).join(", ");
  const best=L.filter(a=>a.rv>=8).sort((a,b)=>b.net-a.net)[0],worstCard=cards.find(c=>c.type==="avoid"),worst=worstCard?st.K[worstCard.aspects[0]]:null;
  const summary=L.length?`분석한 리뷰 ${fmt(st.n)}건에서 가장 많이 언급된 요소는 ${top}입니다.${best?` 가장 칭찬받는 요소는 ${nm(best.k)}(순감성 ${f2(best.net)})이고,`:""}${worst?` 비추천 리뷰에서 가장 자주 지적된 불만은 ${nm(worst.k)}(비추천 리뷰의 ${pct(worst.negNR,0)})입니다.`:""}`:"요소 언급이 적어 결론을 내리기 어렵습니다.";
  return {summary,cards,needs,engine:"rule"};
}

function perfOf(g){
  const s=g.stats||{};const c=s.charts||{};
  const months=(c.months||[]).filter(x=>x.m!=="last30").sort((a,b)=>a.m<b.m?-1:1);
  const last30=(c.months||[]).find(x=>x.m==="last30");
  const price=s.store?(s.store.free?0:s.store.initial):null;
  const base=months.length?Math.max(...months.slice(0,3).map(m=>m.avg)):null;
  const recentAvg=last30?last30.avg:(months.length?months[months.length-1].avg:null);
  const retention=base&&recentAvg!=null?recentAvg/base:null;
  const peakAll=c.peakAll??(months.length?Math.max(...months.map(m=>m.peak)):null);
  return {ok:!!(s.charts||s.current!=null||s.store),price,months,last30,recentAvg,peakAll,current:s.current??c.now??null,peak24:c.peak24??null,spy:s.spy||null,retention,base,err:s.error||null};
}
function gameAspects(gid){
  const st=S.st;const n=st.R.filter(r=>r.g===gid).length;if(!n)return {n:0,bad:null,good:null};
  let bad=null,good=null;
  for(const a of st.list){const [p,ng]=a.g[gid]||[0,0];
    if(ng>=3&&(!bad||ng/n>bad.r))bad={k:a.k,r:ng/n,c:ng};
    if(p>=3&&(!good||p/n>good.r))good={k:a.k,r:p/n,c:p}}
  return {n,bad,good};
}
function retentionCompare(){
  const rows=S.run.games.map(g=>({g,p:perfOf(g),n:S.st.R.filter(r=>r.g===g.id).length})).filter(x=>x.p.retention!=null&&x.n>=10);
  if(rows.length<4)return null;
  const sorted=rows.slice().sort((a,b)=>a.p.retention-b.p.retention);const half=Math.floor(sorted.length/2);
  const low=sorted.slice(0,half),high=sorted.slice(sorted.length-half);
  const rate=(grp,k,i)=>grp.reduce((s,x)=>{const v=(S.st.K[k].g[x.g.id]||[0,0])[i];return s+v/x.n},0)/grp.length;
  const diffs=S.st.list.filter(a=>a.rv>=5).map(a=>({k:a.k,neg:rate(low,a.k,1)-rate(high,a.k,1),pos:rate(high,a.k,0)-rate(low,a.k,0),lowNeg:rate(low,a.k,1),highNeg:rate(high,a.k,1)}));
  return {low,high,neg:diffs.filter(d=>d.neg>0.02).sort((a,b)=>b.neg-a.neg).slice(0,3),pos:diffs.filter(d=>d.pos>0.02).sort((a,b)=>b.pos-a.pos).slice(0,3)};
}

   ${!has?`<p class="small muted">${S.hostOk?"정가와 동시 접속 기록은 위의 <b>지표 불러오기</b>를 누르면 채워집니다.":"정가와 동시 접속 기록은 수집 서버에 연결되어야 불러올 수 있습니다."}</p>`:""}

  if(!has)return head+table;
  const legend=`<div class="legend" style="margin:10px 0">${P.filter(x=>x.p.months.length>=2).slice(0,8).map((x,i)=>`<span><i style="background:${SERIES_C[i]}"></i>${esc(x.g.name)}</span>`).join("")}</div>`;
  const cmp=retentionCompare();
  const cmpHtml=cmp?`<p class="lead" style="margin-top:12px"><b>동접 유지율이 낮은 게임</b>(${cmp.low.map(x=>esc(x.g.name)).join(", ")})은 높은 게임(${cmp.high.map(x=>esc(x.g.name)).join(", ")})보다 ${cmp.neg.length?cmp.neg.map(d=>`<b>${esc(AK[d.k][1])}</b> 불만(${pct(d.lowNeg,0)} vs ${pct(d.highNeg,0)})`).join(", ")+"을 더 많이 언급했습니다":"특별히 더 많이 지적된 불만 요소가 없습니다"}.${cmp.pos.length?` 유지율이 높은 게임은 ${cmp.pos.map(d=>`<b>${esc(AK[d.k][1])}</b>`).join(", ")}에 대한 칭찬이 더 많았습니다.`:""} 게임 수가 적어 인과관계가 아닌 참고 신호로 읽으세요.</p>`:`<p class="small muted" style="margin-top:10px">동접 기록과 리뷰가 충분한 게임이 4개 이상이면, 유지율이 낮은 게임과 높은 게임의 리뷰 차이를 비교해 보여 줍니다.</p>`;

   <div class="card"><h3>월별 평균 동시 접속</h3><p class="lead">게임 간 규모 차이가 커서 세로축을 로그 눈금(한 칸에 10배)으로 그렸습니다.</p>${legend}<div id="perfAbs"></div></div></div>

}
function drawMultiLine(id,series,o){
  const el=$(id);if(!el)return;const SS=series.filter(s=>s.pts.length>=2);
  if(!SS.length){el.innerHTML='<p class="small muted">동시 접속 기록이 2개월 이상인 게임이 없습니다.</p>';return}
  const W=wOf(id,300),H=260,m={l:52,r:16,t:12,b:30};
  const xs=SS.flatMap(s=>s.pts.map(p=>p[0]));const ys=SS.flatMap(s=>s.pts.map(p=>p[1])).filter(v=>o.log?v>0:true);
  let x0=Math.min(...xs),x1=Math.max(...xs);if(x1===x0)x1=x0+1;
  let y0,y1;if(o.log){y0=Math.pow(10,Math.floor(Math.log10(Math.max(1,Math.min(...ys)))));y1=Math.pow(10,Math.ceil(Math.log10(Math.max(2,...ys))));if(y1<=y0)y1=y0*10}else{y0=0;const mx=Math.max(o.yMax||0,...ys);const step=Math.pow(10,Math.floor(Math.log10(mx/4)));const nice=[1,2,2.5,5,10].map(k=>k*step).find(st=>mx/st<=5)||step*10;y1=Math.ceil(mx/nice)*nice}
  const X=v=>m.l+(v-x0)/(x1-x0)*(W-m.l-m.r);
  const Y=v=>o.log?m.t+(1-(Math.log10(Math.max(y0,v))-Math.log10(y0))/(Math.log10(y1)-Math.log10(y0)))*(H-m.t-m.b):m.t+(1-(v-y0)/(y1-y0))*(H-m.t-m.b);
  let s=`<svg ${NS} width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.label)}">`;
  const yt=[];if(o.log){for(let v=y0;v<=y1*1.0001;v*=10)yt.push(v)}else{{const n=Math.round((y1-y0)/((y1-y0)/4));for(let i=0;i<=4;i++)yt.push(y0+(y1-y0)*i/4)}}
  for(const v of yt){const y=Y(v);s+=`<line class="grid" x1="${m.l}" x2="${W-m.r}" y1="${y}" y2="${y}"/><text x="${m.l-6}" y="${y+4}" font-size="10.5" text-anchor="end">${o.yFmt(v)}</text>`}
  for(const [v,lab] of o.xTicks(x0,x1))s+=`<text x="${X(v)}" y="${H-10}" font-size="10.5" text-anchor="middle">${esc(lab)}</text>`;
  s+=`<line class="ax" x1="${m.l}" x2="${W-m.r}" y1="${H-m.b}" y2="${H-m.b}"/>`;
  for(const se of SS){const d=se.pts.map((p,i)=>`${i?"L":"M"}${X(p[0]).toFixed(1)},${Y(p[1]).toFixed(1)}`).join("");
    s+=`<path d="${d}" fill="none" stroke="${se.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    const L=se.pts[se.pts.length-1];s+=`<circle cx="${X(L[0])}" cy="${Y(L[1])}" r="3.5" fill="${se.color}" stroke="var(--surface)" stroke-width="1.5"/>`}
  const ux=[...new Set(xs)].sort((a,b)=>a-b);
  ux.forEach((v,i)=>{const prev=i?X(ux[i-1]):m.l,next=i<ux.length-1?X(ux[i+1]):W-m.r;const a=i?(prev+X(v))/2:m.l,b=i<ux.length-1?(X(v)+next)/2:W-m.r;
    const lines=SS.map(se=>{const p=se.pts.find(q=>q[0]===v);return p?`${se.name}: ${o.tipFmt(p[1])}`:null}).filter(Boolean);
    if(lines.length)s+=`<rect class="hit" x="${a}" y="${m.t}" width="${Math.max(1,b-a)}" height="${H-m.t-m.b}" fill="transparent" data-tip="${esc(o.xName(v)+"\n"+lines.join("\n"))}"/>`});
  el.innerHTML=s+"</svg>";
}
const ymIdx=k=>{const [y,mm]=k.split("-").map(Number);return y*12+mm-1};
const idxLab=i=>`${Math.floor(i/12)}.${String(i%12+1).padStart(2,"0")}`;
function drawPerf(){
  const P=S.run.games.map(g=>({g,p:perfOf(g)})).filter(x=>x.p.months.length>=2).slice(0,8);
  drawMultiLine("perfRet",P.map((x,i)=>({name:x.g.name,color:SERIES_C[i],pts:x.p.months.map((m,j)=>[j,x.p.base?m.avg/x.p.base*100:0])})),
    {label:"출시 후 동접 유지 곡선",yMax:100,yFmt:v=>Math.round(v)+"%",tipFmt:v=>Math.round(v)+"%",xName:v=>`출시 ${v}개월째`,xTicks:(a,b)=>{const st=Math.max(1,Math.ceil((b-a)/6));const t=[];for(let v=0;v<=b;v+=st)t.push([v,v+"개월"]);return t}});
  drawMultiLine("perfAbs",P.map((x,i)=>({name:x.g.name,color:SERIES_C[i],pts:x.p.months.filter(m=>m.avg>0).map(m=>[ymIdx(m.m),m.avg])})),
    {label:"월별 평균 동시 접속",log:true,yFmt:v=>fmtBig(v),tipFmt:v=>fmt(v)+"명",xName:v=>idxLab(v),xTicks:(a,b)=>{const t=[];for(let v=Math.ceil(a/12)*12;v<=b;v+=12)t.push([v,String(v/12)]);if(t.length<2)t.unshift([a,idxLab(a)]);return t}});
  const el=$("perfScatter");if(!el)return;
  const pts=S.run.games.map(g=>({g,p:perfOf(g)})).filter(x=>x.p.retention!=null&&x.g.pos!=null);
  if(pts.length<2){el.innerHTML='<p class="small muted">유지율과 평가가 모두 있는 게임이 2개 이상이어야 그립니다.</p>';return}
  const W=wOf("perfScatter",320),H=300,m={l:46,r:20,t:14,b:36};
  const xmax=Math.min(1.2,Math.max(0.6,...pts.map(x=>x.p.retention))*1.1);const ylo=Math.max(0,Math.floor((Math.min(...pts.map(x=>x.g.pos))*100-5)/10)*10);
  const X=v=>m.l+Math.min(v,xmax)/xmax*(W-m.l-m.r),Y=v=>m.t+(1-(v*100-ylo)/(100-ylo))*(H-m.t-m.b);
  const R=()=>8;
  let s=`<svg ${NS} width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="동접 유지율과 리뷰 긍정 비율">`;
  for(let v=ylo;v<=100;v+=10){const y=Y(v/100);s+=`<line class="grid" x1="${m.l}" x2="${W-m.r}" y1="${y}" y2="${y}"/><text x="${m.l-6}" y="${y+4}" font-size="10.5" text-anchor="end">${v}%</text>`}
  for(let v=0;v<=xmax+1e-9;v+=0.2){const x=X(v);s+=`<line class="grid" x1="${x}" x2="${x}" y1="${m.t}" y2="${H-m.b}"/><text x="${x}" y="${H-m.b+16}" font-size="10.5" text-anchor="middle">${Math.round(v*100)}%</text>`}
  s+=`<text x="${(m.l+W-m.r)/2}" y="${H-4}" font-size="11" text-anchor="middle">동접 유지율 →</text><line class="ax" x1="${m.l}" x2="${W-m.r}" y1="${H-m.b}" y2="${H-m.b}"/>`;
  pts.sort((a,b)=>(b.g.total||0)-(a.g.total||0)).forEach((x,i)=>{const cx=X(x.p.retention),cy=Y(x.g.pos),r=R();const c=x.g.grp==="bot"?"var(--s2)":"var(--s1)";
    s+=`<g class="hit" data-game="${x.g.id}" style="cursor:pointer" data-tip="${esc(`${x.g.name}\n동접 유지율 ${pct(x.p.retention)}\n리뷰 긍정 ${pct(x.g.pos)}`)}"><circle cx="${cx}" cy="${cy}" r="${r+2}" fill="var(--surface)"/><circle cx="${cx}" cy="${cy}" r="${r}" fill="${c}" fill-opacity=".35" stroke="${c}" stroke-width="1.5"/></g>`;
    if(i<8){const right=cx<W-130;s+=`<text x="${right?cx+r+5:cx-r-5}" y="${cy+4}" font-size="11.5" text-anchor="${right?"start":"end"}" fill="var(--ink-2)" pointer-events="none">${esc(x.g.name.length>20?x.g.name.slice(0,19)+"…":x.g.name)}</text>`}});
  el.innerHTML=s+"</svg>";
}

function saveOfficialForm(id){

function genreLabel(run){return run.mode==="genre"?`${run.title} 장르`:`${run.title} 계열`}
function bestGameFor(k,sign){
  const st=S.st;let best=null;
  for(const g of S.run.games){const [p,n]=st.K[k].g[g.id]||[0,0];if(p+n<3)continue;const v=(p-n)/(p+n);if(!best||(sign>0?v>best.v:v<best.v))best={g,v,c:p+n}}
  return best;
}
function evQuotes(k,sign,n=2){
  return S.st.R.filter(r=>r.o.some(o=>o[0]===k&&(sign==null||o[1]===sign)&&o[2])).sort((a,b)=>(b.h||0)-(a.h||0)).slice(0,n).map(r=>({id:r.id,q:r.o.find(o=>o[0]===k)[2],g:gName(r.g),up:r.up,h:Math.round(r.pt/60)}));
}
function bucketN(a,i){return (a.b[i]||[0,0])}
function levelOf(rv){return rv>=60?"높음":rv>=25?"보통":"낮음"}
function needsList(){
  const L=S.run.llm?.needs;if(L&&L.length)return L.slice().sort((a,b)=>b.count-a.count);
  return ruleInsights(S.run,S.st).needs||[];
}
function buildDirections(){
  const run=S.run,st=S.st;const L=st.list.filter(a=>a.rv>=4);
  if(st.n<30||L.length<3)return {error:`분석된 리뷰가 ${st.n}건이고 언급된 요소가 ${L.length}개라, 방향을 만들 근거가 부족합니다. 게임 수나 게임당 리뷰 수를 늘려 다시 분석해 주세요.`};
  const G=genreLabel(run);const nm=k=>AK[k][1];const used=new Set();
  const take=(arr)=>{const a=arr.find(x=>!used.has(x.k));if(a)used.add(a.k);return a||null};
  const avoidRank=L.filter(a=>a.n>=3).map(a=>({k:a.k,a,sc:a.negNR*1.5+a.share*Math.max(0,-a.net)})).sort((x,y)=>y.sc-x.sc);
  const hygiene=avoidRank.filter(x=>x.a.net<0.1).slice(0,3).map(x=>x.a);
  const retCmp=(typeof retentionCompare==="function")?retentionCompare():null;
  const perfs=run.games.map(g=>({g,p:typeof perfOf==="function"?perfOf(g):null})).filter(x=>x.p&&x.p.retention!=null);
  const avgRet=perfs.length?perfs.reduce((s,x)=>s+x.p.retention,0)/perfs.length:null;
  const dirs=[];
  /* ① 핵심 재미 극대화 */
  const gapOf=a=>{const t=a.grp[0][0]+a.grp[0][1],b=a.grp[1][0]+a.grp[1][1];return (t>=5&&b>=5&&a.top!=null&&a.bot!=null)?a.top-a.bot:null};
  const coreRank=L.filter(a=>a.p>=3&&a.net>0).map(a=>({k:a.k,a,sc:a.share*a.net+0.15*Math.max(0,gapOf(a)||0)*Math.min(1,a.share*5)})).sort((x,y)=>y.sc-x.sc);
  const c1=take(coreRank)||take(L.slice().sort((x,y)=>y.net-x.net).map(a=>({k:a.k,a})));
  if(c1){const a=c1.a;const gap=gapOf(a);const sup=coreRank.find(x=>x.k!==a.k&&!used.has(x.k));

/* 패널을 그린 뒤 호출: 번역 버튼을 달고, 켜진 곳은 번역을 채운다 */
function trAfter(p){
  p=p||$("panel");if(!p)return;
  const els=[...p.querySelectorAll(".trx")];if(!els.length)return;
  const bar=document.createElement("div");bar.className="trbar";bar.id="trBar";bar.innerHTML=trBarHtml(els.length);p.prepend(bar);
  const all=trPartsOf(p);const seen=new Set();
  for(const el of els){const part=el.parentElement?.closest(TR_PART);if(!part||seen.has(part))continue;seen.add(part);
    const key=trKeyOf(part,all);const on=trOn()||TRS.parts.has(key);
    const b=document.createElement("button");b.type="button";b.className="trbtn";b.dataset.trpart=key;b.setAttribute("aria-pressed",on);b.textContent=on?"원문 보기":"번역";b.title=on?"이 부분을 원문으로 되돌립니다":"이 부분의 영어·중국어 원문을 한국어로 번역합니다";

    const h=part.matches(".rv")?part.querySelector(".h"):null;

  for(const el of els)if(trActive(el,all))trPaint(el);

}
function trBarUpdate(){const bar=$("trBar");if(bar)bar.innerHTML=trBarHtml(document.querySelectorAll("#panel .trx").length)}
async function trRun(){
  if(TRS.busy){TRS.again=true;return}
  const p=$("panel");if(!p)return;const all=trPartsOf(p);
  const need=[...new Set([...p.querySelectorAll(".trx:not([data-done])")].filter(el=>trActive(el,all)).map(el=>el.dataset.tx).filter(t=>trGet(t)==null))];
  if(!need.length)return;
  TRS.busy=true;TRS.err="";TRS.done=0;TRS.total=need.length;trBarUpdate();
  try{
    let i=0;
    while(i<need.length){
      const batch=[];let chars=0;
      while(i<need.length&&batch.length<20&&chars+Math.min(need[i].length,2000)<=12000){batch.push(need[i]);chars+=Math.min(need[i].length,2000);i++}
      if(!batch.length){batch.push(need[i]);i++}

      const st=trStore();let miss=0;
      batch.forEach((t,k)=>{const x=r.out&&r.out[k];if(x&&x.t)st[trHash(t)]=x.t;else miss++});
      trSave();TRS.done+=batch.length;
      const p2=$("panel");if(p2){const all2=trPartsOf(p2);for(const el of p2.querySelectorAll(".trx:not([data-done])"))if(trActive(el,all2))trPaint(el)}
      if(miss)TRS.err=`${miss}건은 번역하지 못해 원문으로 둡니다`;
      trBarUpdate();
    }
  }catch(e){TRS.err=e.code==="network"?"번역 서버에 연결하지 못했습니다":(e.message||"번역하지 못했습니다");toast(TRS.err)}
  TRS.busy=false;trBarUpdate();
  if(TRS.again){TRS.again=false;trRun()}
}

function cleanText(t){return String(t||"").replace(/\[\/?[a-z0-9*]+(=[^\]]*)?\]/gi," ").replace(/https?:\/\/\S+/g," ").replace(/[ \t]+/g," ").replace(/\n{3,}/g,"\n\n").trim()}

async function collectReviews(g,quota,langs,onPage){
  const out=[],seen=new Set();let dropped=0;
  const wsum=langs.reduce((s,l)=>s+LANG_W[l],0);
  for(const lang of langs){
    const q=Math.max(20,Math.round(quota*LANG_W[lang]/wsum));
    for(const [filter,share] of [["all",.5],["recent",.5]]){
      let need=Math.round(q*share),cursor="*",guard=0,got=0;
      while(need>0&&guard<12){
        guard++;const n=Math.min(40,need+10);
        const url=`https://store.steampowered.com/appreviews/${g.id}?json=1&filter=${filter}&language=${lang}&review_type=all&purchase_type=all&num_per_page=${n}&cursor=${encodeURIComponent(cursor)}${filter==="all"?"&day_range=365":""}`;
        let {j,raw}=await steamJSON(url);
        if(!j)dbg(`${g.name}: 응답을 JSON으로 읽지 못함 (${(raw||"").slice(0,80).replace(/\s+/g," ")})`);
        if(!j&&raw){const k=raw.lastIndexOf(',{"recommendationid"');if(k>0){try{j=JSON.parse(raw.slice(0,k)+"]}");j.cursor=null}catch(e){j=null}}}
        if(!j||!j.reviews||!j.reviews.length)break;
        for(const r of j.reviews){
          if(seen.has(r.recommendationid))continue;seen.add(r.recommendationid);
          const t=cleanText(r.review);
          if(!keep(t,lang)){dropped++;continue}
          if(!g.rel&&r.app_release_date)g.rel=Number(r.app_release_date);
          out.push({id:String(r.recommendationid),g:g.id,l:r.language||lang,t:t.slice(0,1400),up:!!r.voted_up,pt:r.author?.playtime_at_review||r.author?.playtime_forever||0,ts:r.timestamp_created,h:r.votes_up||0,ea:!!r.written_during_early_access});
          need--;got++;if(need<=0)break;
        }
        onPage&&onPage(out.length);
        if(!j.cursor||j.cursor===cursor)break;cursor=j.cursor;
      }
    }
  }
  return {reviews:out,dropped};
}

function clsPrompt(batch){

  const lines=batch.map((r,i)=>`[${i}] (${r.up?"recommended":"not recommended"}, ${Math.round(r.pt/60)}h played) ${r.t.slice(0,650).replace(/\s+/g," ")}`).join("\n");
  return `You are coding Steam user reviews for game-design research. For each review, extract the player's opinions about specific aspects of the game.

Aspect keys (use ONLY these keys):

Reply with ONLY a JSON array. One object per review that contains at least one concrete opinion:
{"i": <review index>, "o": [[aspectKey, s, "evidence"], ...], "w": "...", "c": "..."}
- s: 1 = positive, -1 = negative, 0 = mixed
- evidence: a short phrase copied from the review text (at most 10 words) that shows this opinion
- at most 4 opinions per review; one opinion per aspect

- "c" (optional): the name of another game the reviewer compares this game to. Omit when there is none.
- Skip reviews that are only jokes, memes or have no concrete opinion. Use the recommendation flag and context to read sarcasm.
Example: [{"i":0,"o":[["performance",-1,"stutters every boss fight"],["art",1,"gorgeous hand drawn art"]],"w":"보스전 프레임 개선"}]

Reviews:
${lines}`;
}
function applyCls(batch,res){
  const seen=new Set();
  if(Array.isArray(res))for(const x of res){
    const i=Number(x?.i);const r=batch[i];if(!r||seen.has(i))continue;seen.add(i);
    const o=[];const used=new Set();
    for(const it of (Array.isArray(x.o)?x.o:[])){const k=String(it?.[0]||"");const s=Math.sign(Number(it?.[1])||0);if(!AK[k]||used.has(k))continue;used.add(k);o.push([k,s,String(it?.[2]||"").slice(0,120)]);if(o.length>=4)break}
    r.o=o;if(x.w)r.w=String(x.w).slice(0,40);if(x.c)r.c=String(x.c).slice(0,60);
  }
  for(let i=0;i<batch.length;i++)if(!seen.has(i))batch[i].o=[];
}

function validateLLM(res,run){
  const ids=new Set(run.reviews.map(r=>r.id));
  const cards=[];let ci=0;
  for(const c of (res?.cards||[])){if(!TYPES[c?.type])continue;const ev=(c.evidence||[]).map(String).filter(i=>ids.has(i)).slice(0,4);if(!ev.length)continue;
    cards.push({id:"c"+(ci++),type:c.type,title:String(c.title||"").slice(0,120),body:String(c.body||"").slice(0,600),aspects:(c.aspects||[]).filter(k=>AK[k]),metric:String(c.metric||"").slice(0,200),evidence:ev})}
  const needs=(res?.needs||[]).map(n=>({title:String(n?.title||"").slice(0,80),desc:String(n?.desc||"").slice(0,400),aspects:(n?.aspects||[]).filter(k=>AK[k]),count:Number(n?.count)||0,evidence:(n?.evidence||[]).map(String).filter(i=>ids.has(i)).slice(0,4)})).filter(n=>n.title);
  return {summary:String(res?.summary||""),cards,needs};
}

/* ---------- statistics ---------- */
const bucketOf=min=>{const h=min/60;return h<2?0:h<20?1:h<100?2:3};
const netOf=(p,n,min=4)=>(p+n)>=min?(p-n)/(p+n):null;
function gName(id){return S.run?.games.find(g=>g.id===id)?.name||String(id)}
function computeStats(run){
  const R=run.reviews.filter(r=>Array.isArray(r.o));
  const nUp=R.filter(r=>r.up).length,nDown=R.length-nUp;
  const ts=R.map(r=>r.ts).sort((a,b)=>a-b);const tsMed=ts[Math.floor(ts.length/2)]||0;
  const gpos=run.games.map(g=>g.pos).filter(x=>x!=null).sort((a,b)=>a-b);const gMed=gpos[Math.floor(gpos.length/2)]??0;
  run.games.forEach(g=>{g.grp=(g.pos??0)>=gMed?"top":"bot"});
  const grpOf=Object.fromEntries(run.games.map(g=>[g.id,g.grp==="top"?0:1]));
  const K={};for(const [k] of ASPECTS)K[k]={k,rv:0,p:0,n:0,z:0,negNRc:0,posRc:0,g:{},b:[[0,0],[0,0],[0,0],[0,0]],per:[[0,0],[0,0]],grp:[[0,0],[0,0]]};
  let ops=0;
  for(const r of R){
    for(const [k,s] of r.o){const A=K[k];if(!A)continue;ops++;A.rv++;
      if(s>0)A.p++;else if(s<0)A.n++;else A.z++;
      if(!r.up&&s<0)A.negNRc++;if(r.up&&s>0)A.posRc++;
      const add=(arr)=>{if(s>0)arr[0]++;else if(s<0)arr[1]++};
      add(A.g[r.g]||(A.g[r.g]=[0,0]));add(A.b[bucketOf(r.pt)]);add(A.per[r.ts<tsMed?0:1]);add(A.grp[grpOf[r.g]??0]);
    }
  }
  const list=Object.values(K).map(A=>{
    A.share=R.length?A.rv/R.length:0;A.net=(A.p-A.n)/Math.max(1,A.p+A.n);
    A.negNR=nDown?A.negNRc/nDown:0;A.posR=nUp?A.posRc/nUp:0;
    A.bk=A.b.map(([p,n])=>netOf(p,n));A.early=netOf(...A.per[0]);A.late=netOf(...A.per[1]);A.top=netOf(...A.grp[0]);A.bot=netOf(...A.grp[1]);
    const f=[];
    if(A.share>=.04&&A.net>=.35)f.push("reinforce");
    if(A.top!=null&&A.bot!=null&&A.top-A.bot>=.25&&A.share>=.03)f.push("reinforce");
    if((A.negNR>=.08&&A.n>=5)||(A.n>=10&&A.net<=-.2))f.push("avoid");
    if(A.rv>=10&&Math.abs(A.net)<.25)f.push("verify");
    if(A.early!=null&&A.late!=null&&Math.abs(A.late-A.early)>=.3)f.push("verify");
    const bk=A.bk.filter(x=>x!=null);if(bk.length>=2&&Math.max(...bk)-Math.min(...bk)>=.5)f.push("verify");
    A.flags=[...new Set(f)];return A;
  }).sort((a,b)=>b.rv-a.rv);
  return {R,n:R.length,nUp,nDown,ops,K,list,tsMed,gMed,pending:run.reviews.filter(r=>!Array.isArray(r.o)).length};
}

const STOP=new Set("a an the and or but if then so of to in on at for with from by as is are was were be been being it its it's this that these those i i'm im me my we our you your he she they them their his her there here what which who whom when where why how all any both each few more most other some such no nor not only own same too very can will just don don't should now also get got really one would could even much game games play played playing like dont didnt doesnt isnt cant wont ive id youre theyre thats theres lot lots make makes made thing things way still ever every well yes yeah though through over into out up down about after before again than because while do does did has have had having am time hours hour".split(" "));
const KEEPNEG=new Set(["not","no","don't","dont","cant","can't","wont","isnt","didnt","doesnt","never"]);
const KO_P=/(으로|에서|에게|까지|부터|이나|보다|처럼|하고|입니다|이에요|예요|이다|은|는|이|가|을|를|에|의|도|로|과|와|만|요)$/;
function tokens(text,lang){
  const set=new Set();const t=text.toLowerCase();
  if(lang==="schinese"){const h=t.replace(/[^一-鿿]/g," ");for(const seg of h.split(/\s+/))for(let i=0;i+1<seg.length;i++)set.add(seg.slice(i,i+2));return set}
  if(lang==="koreana"){const w=t.split(/[^가-힣a-z0-9]+/).map(x=>{const y=x.replace(KO_P,"");return y.length>=2?y:x}).filter(x=>x.length>=2&&!/^\d+$/.test(x));
    for(let i=0;i<w.length;i++){set.add(w[i]);if(i+1<w.length)set.add(w[i]+" "+w[i+1])}return set}
  const w=t.replace(/[’']/g,"'").split(/[^a-z']+/).map(x=>x.replace(/^'+|'+$/g,"")).filter(Boolean);
  for(let i=0;i<w.length;i++){const a=w[i];if(a.length>=3&&!STOP.has(a))set.add(a);
    if(i+1<w.length){const b=w[i+1];const aOk=!STOP.has(a)||KEEPNEG.has(a),bOk=!STOP.has(b);if(aOk&&bOk&&a.length>1&&b.length>2)set.add(a+" "+b)}}
  return set;
}
function logOdds(A,nA,B,nB,minDf){
  const out=[];const all=new Set([...A.keys(),...B.keys()]);
  for(const w of all){const a=A.get(w)||0,b=B.get(w)||0;if(a+b<minDf)continue;
    const d=Math.log((a+.5)/(nA-a+.5))-Math.log((b+.5)/(nB-b+.5));const z=d/Math.sqrt(1/(a+.5)+1/(b+.5));out.push({w,a,b,z})}
  return out;
}
function wording(run,lang){
  const R=run.reviews.filter(r=>r.l===lang);
  const dfP=new Map(),dfN=new Map(),dfOld=new Map(),dfNew=new Map(),gs=new Map();
  let nP=0,nN=0;const maxTs=Math.max(0,...R.map(r=>r.ts));const cut=maxTs-90*86400;let nNew=0,nOld=0;
  const toks=new Map();
  for(const r of R){const T=tokens(r.t,lang);toks.set(r.id,T);
    const M=r.up?dfP:dfN;r.up?nP++:nN++;const M2=r.ts>=cut?dfNew:dfOld;r.ts>=cut?nNew++:nOld++;
    for(const w of T){M.set(w,(M.get(w)||0)+1);M2.set(w,(M2.get(w)||0)+1);let s=gs.get(w);if(!s){s=new Set();gs.set(w,s)}s.add(r.g)}}
  const minDf=Math.max(4,Math.round(R.length*.006));
  const lo=logOdds(dfP,nP,dfN,nN,minDf);
  const pos=lo.filter(x=>x.z>1.96).sort((a,b)=>b.z-a.z).slice(0,22);
  const neg=lo.filter(x=>x.z<-1.96).sort((a,b)=>a.z-b.z).slice(0,22);
  let rising=[];if(nNew>=30&&nOld>=30)rising=logOdds(dfNew,nNew,dfOld,nOld,minDf).filter(x=>x.z>2).sort((a,b)=>b.z-a.z).slice(0,14);
  const gWith=new Set(R.map(r=>r.g));const gCount=[...gWith].filter(g=>R.filter(r=>r.g===g).length>=10).length;
  let common=[];if(gCount>=3)common=[...gs].filter(([w,s])=>s.size>=Math.ceil(gCount*.6)).map(([w,s])=>({w,a:(dfP.get(w)||0)+(dfN.get(w)||0),gs:s.size})).sort((a,b)=>b.a-a.a).slice(0,20);
  return {n:R.length,nP,nN,nNew,pos,neg,rising,common,gCount,toks};
}

async function openRun(id){

async function saveRun(run){

async function findTargets(){
  S.busy=true;updateButtons();$("findMsg").textContent="Steam에서 찾는 중…";
  try{await ensureTab();const o=opts();
    if(S.mode==="genre"){
      let rows=[];for(const start of [0,100]){const r=await searchByTags(S.tags,start);rows=rows.concat(r.rows);if(r.rows.length<100)break}
      const minTs=o.years>=99?0:Date.now()/1000-o.years*365*86400;
      let pool=rows.filter(r=>r.total>=o.minRev&&r.rel>=minTs&&r.pos!=null);
      const seen=new Set();pool=pool.filter(r=>!seen.has(r.id)&&seen.add(r.id));
      pool.sort((a,b)=>b.total-a.total);
      const nBot=Math.max(1,Math.floor(o.nGames*.3));
      const low=pool.filter(r=>r.pos<.75);
      const bot=low.slice(0,nBot);
      const top=pool.filter(r=>!bot.includes(r)).slice(0,o.nGames-bot.length);
      const picked=new Set([...top,...bot]);
      S.cands=pool.slice(0,Math.max(o.nGames*2,24)).map(r=>({...r,on:picked.has(r)}));
      for(const b of bot)if(!S.cands.some(c=>c.id===b.id))S.cands.push({...b,on:true});
      S.cands.forEach(c=>{if(c.on)c.grp=bot.find(b=>b.id===c.id)?"bot":"top"});
      $("findMsg").textContent=pool.length?`조건에 맞는 게임 ${pool.length}개 중 리뷰가 많은 순으로 골랐고, 평가 낮은 게임(긍정 75% 미만)을 ${bot.length}개 섞었습니다.`:"조건에 맞는 게임이 없습니다. 기간이나 최소 리뷰 수를 낮춰 보세요.";
    }else{
      S.cands=[];for(const g of S.games){$("findMsg").textContent=`${g.name} 정보 확인 중…`;const m=await gameMeta(g.id);S.cands.push({...g,...m,on:true})}
      $("findMsg").textContent="";
    }
    drawCands();
  }catch(e){$("findMsg").textContent=errText(e)}
  S.busy=false;updateButtons();
}
function errText(e){const c=e?.code;
  if(c==="cancelled")return "중지했습니다.";
  if(c==="bad_code")return "접근 코드가 맞지 않습니다. 왼쪽 위에서 코드를 다시 입력해 주세요.";
  if(c==="rate_limited")return "Claude API 사용 한도(속도 제한)에 걸렸습니다. 지금까지 결과는 저장했습니다. 1~2분 뒤 결과 화면 위쪽의 '이어서 분석'을 눌러 주세요.";
  if(c==="no_key"||c==="bad_key")return "서버의 Claude API 키가 없거나 올바르지 않습니다. 관리자에게 알려 주세요.";
  if(c==="no_code_set")return "서버에 접근 코드가 설정되지 않았습니다. 관리자에게 알려 주세요.";
  if(c==="overloaded")return "Claude가 일시적으로 혼잡합니다. 잠시 뒤 '이어서 분석'을 눌러 주세요.";
  return e?.message||String(c||e)}

/* ---------- run pipeline ---------- */
const STEPS=[["collect","리뷰 수집"],["clean","정제"],["classify","요소별 분석"],["insight","시사점 작성"],["save","저장"]];
let CUR="collect";
function stepUI(cur,state,extra){CUR=cur;$("steps").innerHTML=STEPS.map(([k,l],i)=>{const ci=STEPS.findIndex(s=>s[0]===cur);const cls=i<ci?"done":i===ci?(state||"run"):"";return `<div class="step ${cls}"><span class="dot"></span><span>${l}</span><span class="num small">${i===ci&&extra?esc(extra):""}</span></div>`}).join("")}
function logl(m){const l=$("log");l.textContent=(m+"\n"+l.textContent).slice(0,8000)}
function prog(x){$("pbar").style.width=Math.round(x*100)+"%"}
async function startRun(resume){
  const o=opts();S.busy=true;S.ctl=new AbortController();updateButtons();$("progBox").hidden=false;$("stopBtn").hidden=false;$("log").textContent="";
  let run=resume?S.run:null;
  try{
    if(!run){
      const on=S.cands.filter(c=>c.on);
      const title=S.mode==="genre"?S.tags.map(t=>TAGN[t]||t).join(" + "):on.map(g=>g.name).slice(0,3).join(", ")+(on.length>3?` 외 ${on.length-3}`:"");
      run={id:"r"+Date.now().toString(36),createdAt:Date.now(),title,mode:S.mode,tags:S.tags.slice(),settings:o,games:on.map(c=>({id:c.id,name:c.name,rel:c.rel||0,pos:c.pos,total:c.total,tags:c.tags||[],grp:c.grp||null})),reviews:[],dropped:0,llm:null,verdicts:{}};
      await ensureTab();
      stepUI("collect");
      for(let gi=0;gi<run.games.length;gi++){const g=run.games[gi];
        stepUI("collect","run",`${gi+1}/${run.games.length}`);logl(`${g.name}: 리뷰 수집`);
        const hist=await histogram(g.id);g.hist=hist.h;if(!g.rel&&hist.start)g.rel=hist.start;
        const {reviews,dropped}=await collectReviews(g,o.perGame,o.langs,n=>prog((gi+Math.min(1,n/o.perGame))/run.games.length));
        run.reviews.push(...reviews);run.dropped+=dropped;logl(`${g.name}: ${reviews.length}건 확보, ${dropped}건 제외`);
        g.stats=await fetchStats(g.id);logl(`${g.name}: 판매·동접 지표 ${g.stats.error?"가져오지 못함 ("+g.stats.error+")":"확보"}`);if(gi===run.games.length-1)run.statsAt=Date.now();
      }
      stepUI("clean");const seen=new Set();run.reviews=run.reviews.filter(r=>!seen.has(r.id)&&seen.add(r.id));
      logl(`정제 후 ${run.reviews.length}건 (짧거나 내용 없는 리뷰 ${run.dropped}건 제외)`);
      if(!run.reviews.length)throw {message:"분석할 리뷰를 찾지 못했습니다. 언어나 게임을 바꿔 보세요."};
      S.run=run;
      if(await saveRun(run).catch(e=>{logl("수집 결과 저장 실패: "+(e.code||e.message));return false})){logl("수집한 리뷰를 저장했습니다");await loadRuns()}
    }
    await classifyAll(run);
    await makeInsights(run);
    stepUI("save");
    if(await saveRun(run).catch(e=>{logl("저장 실패: "+(e.code||e.message));return false})){logl("저장했습니다");await loadRuns()}
    stepUI("save","done");prog(1);
    setRun(run);toast("분석을 마쳤습니다");
  }catch(e){
    const msg=errText(e);logl(msg);stepUI(CUR,"err");
    if(run&&run.reviews.length&&S.run===run){
      if(await saveRun(run).catch(()=>false)){logl("지금까지 결과를 저장했습니다");await loadRuns()}
      setRun(run);
    }
    toast(msg);
  }
  S.busy=false;$("stopBtn").hidden=true;updateButtons();
}
async function classifyAll(run){
  const todo=run.reviews.filter(r=>!Array.isArray(r.o));if(!todo.length)return;
  stepUI("classify","run",`0/${todo.length}`);logl(`규칙 기반 분석: 리뷰 ${todo.length}건`);
  for(let i=0;i<todo.length;i++){
    if(S.ctl?.signal.aborted)throw {code:"cancelled"};
    ruleClassifyReview(todo[i]);
    if(i%40===39||i===todo.length-1){stepUI("classify","run",`${i+1}/${todo.length}`);prog((i+1)/todo.length);await sleep(0)}
  }
}
async function makeInsights(run){
  stepUI("insight");const st=computeStats(run);S.run=run;
  run.llm=ruleInsights(run,st);run.llm.at=Date.now();
  if(!run.llm.cards.length&&st.n<20)run.llm.summary="분석된 리뷰가 적어 시사점을 만들지 않았습니다.";
}
async function regenInsights(){
  if(!S.run||!S.sample)return;S.busy=true;S.ctl=new AbortController();$("progBox").hidden=false;$("stopBtn").hidden=false;updateButtons();
  try{if(S.run.reviews.some(r=>!Array.isArray(r.o)))await classifyAll(S.run);await makeInsights(S.run);stepUI("save");await saveRun(S.run);await loadRuns();stepUI("save","done");setRun(S.run);toast("분석을 마쳤습니다")}
  catch(e){toast(errText(e));logl(errText(e));stepUI(CUR,"err");await saveRun(S.run).catch(()=>{});setRun(S.run)}
  S.busy=false;$("stopBtn").hidden=true;updateButtons();
}

   ${S.hostOk?`<button class="btn sm" id="marketBtn">${S.market?"다시 불러오기":"불러오기"}</button>`:""}</div>

function monthly(r){
  const m=new Map();
  for(const g of r.games)for(const [ts,up,dn] of (g.hist||[])){const d=new Date(ts*1000);const k=d.getUTCFullYear()*12+d.getUTCMonth();const e=m.get(k)||[0,0];e[0]+=up;e[1]+=dn;m.set(k,e)}
  const ks=[...m.keys()].sort((a,b)=>a-b);if(!ks.length)return [];
  const last=ks[ks.length-1];const first=Math.max(ks[0],last-35);
  const out=[];for(let k=first;k<=last;k++){const e=m.get(k)||[0,0];out.push({k,lab:`${Math.floor(k/12)}.${String(k%12+1).padStart(2,"0")}`,up:e[0],dn:e[1],n:e[0]+e[1]})}
  return out;
}

/* wording (Q3) */
function vWording(){
  const r=S.run;const counts={};for(const x of r.reviews)counts[x.l]=(counts[x.l]||0)+1;
  const langs=Object.keys(counts).sort((a,b)=>counts[b]-counts[a]);
  if(!S.wordLang||!counts[S.wordLang])S.wordLang=langs[0];
  if(!S._w||S._w.key!==r.id+S.wordLang){S._w={key:r.id+S.wordLang,w:wording(r,S.wordLang)}}
  const w=S._w.w;
  const list=(arr,col,key)=>{const mx=Math.max(1,...arr.map(x=>x[key]));return arr.length?`<div class="terms">${arr.map(x=>`<div class="term" data-term="${esc(x.w)}" title="리뷰에서 보기"><span class="tb" style="--w:${(x[key]/mx*100).toFixed(1)}%;--tc:${col}">${trx(x.w,{inline:1})}</span><span class="n num">${x[key]}건</span></div>`).join("")}</div>`:'<p class="small muted">통계적으로 두드러진 표현이 없습니다.</p>'};
  const aspPh=S.st.list.filter(a=>a.rv>=5).slice(0,8).map(a=>{const ph=S.st.R.flatMap(r=>r.o.filter(o=>o[0]===a.k&&o[2]).map(o=>({s:o[1],e:o[2],l:r.l}))).filter(x=>x.l===S.wordLang);
    const cnt=new Map();for(const x of ph){const k=x.e.toLowerCase().replace(/[.!?,]+$/,"");const e=cnt.get(k)||{n:0,s:0,e:x.e};e.n++;e.s+=x.s;cnt.set(k,e)}
    const top=[...cnt.values()].sort((a,b)=>b.n-a.n).slice(0,5);
    return top.length?`<div><div class="label" style="margin-bottom:4px">${esc(AK[a.k][1])}</div>${top.map(t=>`<div class="small"><span style="color:${t.s>0?"var(--pos)":t.s<0?"var(--neg)":"var(--muted)"}">${t.s>0?"+":t.s<0?"−":"·"}</span> ${trx(t.e,{inline:1})}${t.n>1?` <span class="muted num">×${t.n}</span>`:""}</div>`).join("")}</div>`:""}).join("");
  return `<div class="card"><div class="row" style="justify-content:space-between"><div><h3>추천과 비추천을 가르는 표현</h3><p class="lead">두 그룹에서 쓰인 빈도를 비교해(로그 오즈비, z>1.96) 한쪽에서만 유독 많이 나오는 단어와 두 단어 구절입니다. 숫자는 그 표현이 나온 리뷰 수입니다. 표현을 누르면 해당 리뷰를 봅니다.</p></div>
    <label class="small">언어 <select id="wordLang">${langs.map(l=>`<option value="${l}" ${l===S.wordLang?"selected":""}>${LANGS[l]||l} (${counts[l]}건)</option>`).join("")}</select></label></div>
    <div class="split" style="margin-top:12px"><div><div class="label" style="margin-bottom:6px;color:var(--pos)">추천 리뷰에서 두드러짐 · ${w.nP}건</div>${list(w.pos,"var(--pos)","a")}</div>
    <div><div class="label" style="margin-bottom:6px;color:var(--neg)">비추천 리뷰에서 두드러짐 · ${w.nN}건</div>${list(w.neg,"var(--neg)","b")}</div></div></div>
   <div class="split"><div class="card"><h3>최근 90일에 늘어난 표현</h3><p class="lead">가장 최근 90일 리뷰(${w.nNew}건)를 그 이전과 비교했습니다.</p>${w.nNew>=30?list(w.rising,"var(--accent)","a"):'<p class="small muted">최근 90일 리뷰가 30건 미만이라 비교하지 않았습니다.</p>'}</div>
   <div class="card"><h3>장르 공통 표현</h3><p class="lead">리뷰 10건 이상인 게임 ${w.gCount}개 중 60% 이상에서 쓰인 표현입니다. 이 장르 플레이어가 당연하게 쓰는 언어입니다.</p>${w.common.length?list(w.common,"var(--muted)","a"):'<p class="small muted">게임이 3개 이상이어야 계산합니다.</p>'}</div></div>
   <div class="card"><h3>요소별 대표 구절</h3><p class="lead">${S.run.llm?.engine==="rule"?"요소 키워드가 나온 문장 중 감성이 가장 뚜렷한 문장입니다.":"Claude가 리뷰에서 근거로 뽑은 구절 중 많이 나온 것입니다."}</p><div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px;margin-top:10px">${aspPh||'<p class="small muted">구절이 없습니다.</p>'}</div></div>`;
}

/* explorer */
function filtered(){
  const e=S.ex;const q=e.q.trim().toLowerCase();
  return S.run.reviews.filter(r=>{
    if(e.ids&&!e.ids.includes(r.id))return false;
    if(e.game&&String(r.g)!==e.game)return false;
    if(e.lang&&r.l!==e.lang)return false;
    if(e.rec&&(e.rec==="y")!==r.up)return false;

async function loadMarket(){
  const b=$("marketBtn");if(b){b.disabled=true;b.textContent="불러오는 중…"}
  try{await ensureTab();let rows=[];
    for(const f of ["topsellers","popularnew"]){const {j}=await steamJSON(`https://store.steampowered.com/search/results/?query&start=0&count=100&filter=${f}&infinite=1&category1=998&cc=KR&l=english&ndl=1`);if(j?.results_html)rows=rows.concat(parseSearchRows(j.results_html))}
    const seen=new Set();rows=rows.filter(r=>!seen.has(r.id)&&seen.add(r.id));
    const cut=Date.now()/1000-548*86400;const rec=rows.filter(r=>r.rel>=cut);
    const share=(arr,t)=>arr.filter(r=>r.tags.includes(t)).length/Math.max(1,arr.length);
    const cnt=new Map();for(const r of rows)for(const t of r.tags)cnt.set(t,(cnt.get(t)||0)+1);
    const out=[...cnt.keys()].filter(t=>TAGN[t]&&![492,19,21,4182,597].includes(t)).map(t=>({t,name:TAGN[t],all:share(rows,t),recent:share(rec,t),nAll:rows.filter(r=>r.tags.includes(t)).length,nRecent:rec.filter(r=>r.tags.includes(t)).length})).filter(r=>r.nRecent>=4).sort((a,b)=>(b.recent/b.all)-(a.recent/a.all)).slice(0,16);
    S.market={at:Date.now(),nAll:rows.length,nRecent:rec.length,rows:out};
    LS.set("rr-market",S.market);
    renderPanel();
  }catch(e){toast(errText(e));if(b){b.disabled=false;b.textContent="다시 시도"}}
}

  if(t.id==="mGenre")return setMode("genre");if(t.id==="mGame")return setMode("game");
  if(t.id==="tQuick"||t.id==="tDeep"){S.tier=t.id==="tQuick"?"quick":"deep";$("tQuick").setAttribute("aria-pressed",S.tier==="quick");$("tDeep").setAttribute("aria-pressed",S.tier==="deep");return}
  if(t.dataset.p!=null){setMode("genre");S.tags=PRESETS[+t.dataset.p][1].slice();drawTagSel();S.cands=[];$("candBox").hidden=true;updateButtons();$("tagIn").focus();return}
  if(t.dataset.t){S.tags=S.tags.filter(x=>x!==+t.dataset.t);drawTagSel();S.cands=[];$("candBox").hidden=true;updateButtons();return}
  if(t.dataset.addtag){const id=+t.dataset.addtag;if(!S.tags.includes(id)&&S.tags.length<4)S.tags.push(id);$("tagIn").value="";$("tagAc").hidden=true;drawTagSel();S.cands=[];$("candBox").hidden=true;updateButtons();return}
  if(t.dataset.g&&!t.dataset.addgame){S.games=S.games.filter(g=>g.id!==+t.dataset.g);drawGameSel();S.cands=[];$("candBox").hidden=true;updateButtons();return}
  if(t.dataset.swapbase){const id=+t.dataset.swapbase;const b=META[id]?.base;if(b){S.games=S.games.filter(x=>x.id!==id);if(!S.games.find(x=>x.id===b.id))S.games.push({id:b.id,name:b.name});drawGameSel();S.cands=[];$("candBox").hidden=true;updateButtons();loadMeta(b.id).then(drawGameSel);toast("본편으로 바꿨습니다")}return}
  if(t.dataset.addgame){const g=JSON.parse(t.dataset.addgame);if(!S.games.find(x=>x.id===g.id)&&S.games.length<8)S.games.push(g);$("gameIn").value="";$("gameAc").hidden=true;drawGameSel();S.cands=[];$("candBox").hidden=true;updateButtons();if(!META[g.id]||META[g.id].pending)loadMeta(g.id).then(drawGameSel);return}
  if(t.id==="findBtn")return findTargets();
  if(t.id==="runBtn")return startRun(false);
  if(t.id==="stopBtn"){S.ctl?.abort();return}
  if(t.id==="resumeBtn"||t.id==="regenBtn")return regenInsights();
  if(t.id==="exportBtn")return exportReport();
  if(t.id==="statsBtn")return refreshStats(t);
  if(t.id==="concludeBtn"){if(!S.run)return;S.tab="directions";renderMain();updateButtons();window.scrollTo({top:0,behavior:"smooth"});return}
  if(t.id==="dirExportBtn")return exportDirections();
  if(t.dataset.dirpick){const k="rr-dir-"+S.run.id;const cur=LS.get(k);if(cur===t.dataset.dirpick){LS.del(k);if(S.tab==="concept")S.tab="directions";const y=window.scrollY;renderMain();window.scrollTo({top:S.tab==="directions"?y:0});toast("선택을 해제했습니다")}else{LS.set(k,t.dataset.dirpick);S.tab="concept";renderMain();updateButtons();window.scrollTo({top:0,behavior:"smooth"});toast("콘셉트 시트를 만들었습니다")}return}
  if(t.dataset.openconcept){S.tab="concept";renderMain();updateButtons();window.scrollTo({top:0,behavior:"smooth"});return}
  if(t.id==="backDirBtn"){S.tab="directions";renderMain();updateButtons();window.scrollTo({top:0});return}
  if(t.id==="conceptExportBtn")return exportConcept();
  if(t.dataset.dirjump){e.preventDefault();document.getElementById("dir-"+t.dataset.dirjump)?.scrollIntoView({behavior:"smooth",block:"start"});return}
  if(t.dataset.ofedit){S.ofEdit=S.ofEdit===+t.dataset.ofedit?null:+t.dataset.ofedit;renderPanel();setTimeout(()=>$("of-units")?.focus(),0);return}
  if(t.dataset.ofsave)return saveOfficialForm(t.dataset.ofsave);
  if(t.dataset.ofcancel){S.ofEdit=null;renderPanel();return}
  if(t.dataset.ofreset){resetOfficial(+t.dataset.ofreset);S.ofEdit=null;renderPanel();toast("기본 공식 실적으로 되돌렸습니다");return}
  if(t.dataset.ofdel){if(t.dataset.sure){saveOfficial(+t.dataset.ofdel,null);S.ofEdit=null;renderPanel();toast("공식 실적 입력값을 지웠습니다")}else{t.dataset.sure="1";t.textContent="한 번 더 누르면 지웁니다"}return}
  if(t.id==="delRunBtn"){if(t.dataset.sure){deleteRun(S.run.id)}else{t.dataset.sure="1";t.textContent="한 번 더 누르면 지웁니다";setTimeout(()=>{if(t.isConnected){delete t.dataset.sure;t.textContent="이 분석 지우기"}},3000)}return}
  if(t.id==="marketBtn")return loadMarket();
  if(t.dataset.run)return openRun(t.dataset.run);
  if(t.dataset.tab){S.tab=t.dataset.tab;document.querySelectorAll(".tabs button").forEach(b=>b.setAttribute("aria-selected",b.dataset.tab===S.tab));renderPanel();updateButtons();return}
  if(t.dataset.evid){const c=S.run.llm.cards.find(c=>c.id===t.dataset.evid);return goExplore({ids:c.evidence,idsLabel:"시사점 근거: "+c.title.slice(0,24)})}
  if(t.dataset.need!=null){const n=S.run.llm.needs.sort((a,b)=>b.count-a.count)[+t.dataset.need];return goExplore({ids:n.evidence,idsLabel:"요구 근거: "+n.title.slice(0,24)})}
  if(t.dataset.wish){const ids=S.run.reviews.filter(r=>r.w===t.dataset.wish).map(r=>r.id);return goExplore({ids,idsLabel:"요청: "+t.dataset.wish.slice(0,24)})}
  if(t.dataset.v){const c=t.dataset.vc;S.run.verdicts=S.run.verdicts||{};const cur=S.run.verdicts[c]||{};cur.v=cur.v===t.dataset.v?null:t.dataset.v;S.run.verdicts[c]=cur;t.parentElement.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.v===cur.v));saveVerdicts();return}
  if(t.dataset.term){return goExplore({q:t.dataset.term,lang:S.wordLang})}
  if(t.dataset.cell){const [k,c]=t.dataset.cell.split("|");if(c[0]==="g")return goExplore({aspect:k,game:c.slice(1)});return goExplore({aspect:k,bucket:c.slice(1)})}
  if(t.dataset.game){return goExplore({game:t.dataset.game})}
  if(t.dataset.asp){return goExplore({aspect:t.dataset.asp})}
  if(t.id==="clrIds"){S.ex.ids=null;S.ex.idsLabel="";S.ex.page=0;renderPanel();return}
  if(t.id==="pPrev"){S.ex.page--;renderPanel();return}
  if(t.id==="pNext"){S.ex.page++;renderPanel();window.scrollTo({top:0});return}
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.dataset.c!=null){S.cands[+t.dataset.c].on=t.checked;updateButtons();return}
  if(t.closest("#langs")||["optPer","optN","optYears","optMin"].includes(t.id)){updateButtons();return}
  if(t.id==="runSel"){if(t.value)openRun(t.value);return}
  if(t.id==="wordLang"){S.wordLang=t.value;renderPanel();return}
  const map={fGame:"game",fAsp:"aspect",fSent:"sent",fRec:"rec",fBk:"bucket",fLang:"lang"};
  if(map[t.id]){S.ex[map[t.id]]=t.value;S.ex.page=0;renderPanel();return}
  if(t.dataset.memo){S.run.verdicts=S.run.verdicts||{};const c=t.dataset.memo;S.run.verdicts[c]={...(S.run.verdicts[c]||{}),memo:t.value.slice(0,500)};saveVerdicts()}
});
let qT;
document.addEventListener("input",e=>{
  const t=e.target;
  if(t.id==="fQ"){clearTimeout(qT);qT=setTimeout(()=>{S.ex.q=t.value;S.ex.page=0;const pos=t.selectionStart;renderPanel();const n=$("fQ");n.focus();n.setSelectionRange(pos,pos)},300);return}
  if(t.id==="tagIn"){const q=t.value.trim().toLowerCase();const ac=$("tagAc");if(!q){ac.hidden=true;return}
    const hits=TAGS.filter(x=>x[1].toLowerCase().includes(q)||x[2].toLowerCase().includes(q)).slice(0,12);
    ac.innerHTML=hits.map(x=>`<button data-addtag="${x[0]}"><span>${esc(x[1])}</span><span class="small muted">${esc(x[2])}</span></button>`).join("")||'<div class="small muted" style="padding:8px 10px">일치하는 태그가 없습니다</div>';ac.hidden=false;return}
  if(t.id==="gameIn"){clearTimeout(qT);const q=t.value.trim();const ac=$("gameAc");if(q.length<2){ac.hidden=true;return}
    qT=setTimeout(()=>gameSearch(q),450)}
});
const META={};
const KIND={game:"본편",dlc:"DLC",demo:"체험판",music:"사운드트랙",video:"영상",mod:"모드",advertising:"광고",series:"시리즈",episode:"에피소드",hardware:"하드웨어"};
function metaLabel(m){if(!m)return "확인 중…";if(m.fail)return "정보 없음";const y=m.soon?"출시 예정":(m.year||"연도 미상");return `${y} · ${KIND[m.type]||"기타"}`}
async function loadMeta(id){
  if(META[id]&&!META[id].pending)return META[id];
  META[id]={pending:true};
  try{const {j}=await steamJSON(`https://store.steampowered.com/api/appdetails?appids=${id}&cc=kr&l=english`);
    const d=j?.[id];
    if(!d?.success||!d.data)META[id]={fail:true};
    else{const y=(String(d.data.release_date?.date||"").match(/(19|20)\d{2}/)||[])[0]||null;
      META[id]={type:d.data.type||"other",year:y,soon:!!d.data.release_date?.coming_soon,base:d.data.fullgame?{id:Number(d.data.fullgame.appid),name:d.data.fullgame.name}:null}}
  }catch(e){META[id]={fail:true}}
  return META[id];
}
async function gameSearch(q){
  const ac=$("gameAc");if(!S.hostOk){ac.innerHTML='<div class="small muted" style="padding:8px 10px">수집 서버에 연결되지 않아 검색할 수 없습니다</div>';ac.hidden=false;return}
  ac.innerHTML='<div class="small muted" style="padding:8px 10px">검색 중…</div>';ac.hidden=false;
  let items;
  try{const {j}=await steamJSON(`https://store.steampowered.com/api/storesearch/?term=${encodeURIComponent(q)}&l=english&cc=KR`);items=(j?.items||[]).filter(i=>i.type==="app").slice(0,10)}
  catch(e){ac.innerHTML=`<div class="small muted" style="padding:8px 10px">${esc(errText(e))}</div>`;return}
  if($("gameIn").value.trim()!==q)return;
  if(!items.length){ac.innerHTML='<div class="small muted" style="padding:8px 10px">검색 결과가 없습니다</div>';return}
  ac.innerHTML=items.map(i=>`<button data-addgame='${esc(JSON.stringify({id:i.id,name:i.name}))}'><span>${esc(i.name)}</span><span class="small muted meta-lab" data-meta="${i.id}">${esc(metaLabel(META[i.id]&&!META[i.id].pending?META[i.id]:null))}</span></button>`).join("");
  for(const i of items){
    if($("gameIn").value.trim()!==q)return;
    const m=await loadMeta(i.id);
    const el=ac.querySelector(`[data-meta="${i.id}"]`);if(el){el.textContent=metaLabel(m);el.classList.toggle("is-dlc",m.type==="dlc")}
  }
}
function dlcNotice(){
  const box=$("dlcNote");if(!box)return;
  const d=S.games.filter(g=>META[g.id]?.type==="dlc");
  if(!d.length){box.hidden=true;box.innerHTML="";return}
  box.hidden=false;
  box.innerHTML=d.map(g=>{const b=META[g.id].base;return `<div><b>${esc(g.name)}</b>은(는) DLC입니다. DLC는 리뷰가 본편과 따로 쌓여 수가 적고 긍정적으로 치우치기 쉬우며, 동시 접속 기록은 본편 기준이라 비어 있을 수 있습니다.${b?` <button class="linkbtn" data-swapbase="${g.id}">본편(${esc(b.name)})으로 바꾸기</button>`:""}</div>`}).join("");
}
document.addEventListener("keydown",e=>{if(e.key==="Escape"){$("tagAc").hidden=true;$("gameAc").hidden=true}
  if(e.key==="Enter"&&e.target.id==="tagIn"){const b=$("tagAc").querySelector("button");if(b){e.preventDefault();b.click()}}});
document.addEventListener("focusout",e=>{if(e.target.id==="tagIn"||e.target.id==="gameIn")setTimeout(()=>{const a=document.activeElement;if(!a?.closest?.(".ac")){$("tagAc").hidden=true;$("gameAc").hidden=true}},150)});

/* ---------- export ---------- */
async function exportReport(){
  if(!S.dl||!S.run)return;const r=S.run,st=S.st,L=r.llm||{},V=r.verdicts||{};
  const vl={adopt:"채택",hold:"보류",reject:"기각"};
  let md=`# ${r.title} — Steam 리뷰 분석\n\n${new Date(r.createdAt).toLocaleString("ko-KR")} · 게임 ${r.games.length}개 · 분석 리뷰 ${st.n}건 (추천 ${st.nUp} / 비추천 ${st.nDown})\n\n`;
  if(L.summary)md+=`## 핵심 결론\n\n${L.summary}\n\n`;
  for(const t of ["reinforce","avoid","verify"]){const cs=(L.cards||[]).filter(c=>c.type===t);if(!cs.length)continue;md+=`## ${TYPES[t][0]}\n\n`;
    for(const c of cs){md+=`### ${c.title}${V[c.id]?.v?` [${vl[V[c.id].v]}]`:""}\n\n${c.body}\n\n- 근거 수치: ${c.metric}\n- 관련 요소: ${c.aspects.map(k=>AK[k][1]).join(", ")}\n`;
      for(const id of c.evidence){const x=revById(id);if(x){const o=(x.o||[]).find(o=>c.aspects.includes(o[0]))||(x.o||[])[0];md+=`- 근거: "${trMd(o?.[2]||x.t.slice(0,100))}" (${gName(x.g)}, ${x.up?"추천":"비추천"}, ${Math.round(x.pt/60)}시간)\n`}}
      if(V[c.id]?.memo)md+=`- 팀 메모: ${V[c.id].memo}\n`;md+="\n"}}
  md+=`## 요소별 집계\n\n| 요소 | 언급 리뷰 | 긍정 | 부정 | 순감성 | 비추천 중 부정 언급 |\n|---|---:|---:|---:|---:|---:|\n`;
  for(const a of st.list.filter(a=>a.rv>=3))md+=`| ${AK[a.k][1]} | ${a.rv} | ${a.p} | ${a.n} | ${a.net.toFixed(2)} | ${pct(a.negNR,1)} |\n`;
  if((L.needs||[]).length){md+=`\n## 숨은 요구\n\n`;for(const n of L.needs)md+=`- **${n.title}** (${n.count}): ${n.desc}\n`}
  md+=perfReport(r);
  md+=directionsReport();
  md+=`\n## 분석 대상 게임\n\n| 게임 | 출시 | 전체 리뷰 | 긍정 |\n|---|---|---:|---:|\n`+r.games.map(g=>`| ${g.name} | ${dstr(g.rel)} | ${g.total} | ${g.pos!=null?pct(g.pos):"-"} |`).join("\n")+"\n";
  try{await S.dl.save({filename:`리뷰분석_${r.title.replace(/[^\p{L}\p{N}]+/gu,"_")}.md`,data:md});}catch(e){if(e?.code!=="cancelled"&&e?.code!=="declined")toast("파일을 저장하지 못했습니다")}
}

boot();
</script>
